<text x="60" y="62.65" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#0F172A" text-anchor="start">Rendu partiel en espèces : qui décide, qui rend</text>
<text x="60" y="105.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Le prestataire autorise, l’organisateur active, le caissier rend, une seconde personne valide au-delà du seuil</text>
<text x="275.0" y="145.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0061FF" text-anchor="middle">Acteurs</text>
<text x="1225.0" y="145.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0061FF" text-anchor="middle">Cas d&#x27;usage</text>
<text x="275.0" y="269.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Prestataire (admin)</text>
<text x="275.0" y="459.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Organisateur (admin)</text>
<text x="275.0" y="649.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Caissier ou superviseur</text>
<text x="275.0" y="839.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Seconde personne (sur place)</text>
<text x="1225.0" y="250.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Autoriser la fonction pour ses organisateurs</text>
<text x="1225.0" y="402.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Activer ou désactiver pour un événement</text>
<text x="1225.0" y="554.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Rendre une partie du solde payé</text>
<text x="1225.0" y="706.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Refus avec motif distinct</text>
<text x="1225.0" y="858.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Valider le cumul du jour au-dessus du seuil</text>
<text x="60" y="971.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">PLANIFIÉ (plan du 23/11/2026, rien n’est codé). Refusée par défaut aux deux niveaux ; l’organisateur n’active que si le prestataire autorise.</text>
<text x="60" y="1003.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Le festivalier, avec ou sans compte, est servi sur simple lecture du bracelet. Le bracelet reste actif ; crédits offerts et caution inchangés.</text>
</g>
