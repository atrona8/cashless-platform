<text x="60" y="1585.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Relu le 23/11/2026, non fusionné. Rôle cashless_claimadmin (sans mot de passe en production, migrate.ts refuse) ; cashless_app n’a aucun droit sur la réémission.</text>
<text x="60" y="1610.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Les lots clos sont compris ; les bracelets dont le code courant a déjà servi sont ignorés ; aucun code en clair en base, au journal ni à la sortie standard.</text>
