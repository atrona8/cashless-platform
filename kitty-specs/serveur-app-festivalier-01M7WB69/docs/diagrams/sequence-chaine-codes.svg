<text x="60" y="1589.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Relu le 23/11/2026, non fusionné. Essais notés sans le code ; code gardé 35 s au plus : au plafond, la chaîne s’arrête sans repli (OP-N166) ; redémarrage : bascule perdue.</text>
<text x="60" y="1614.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Les trois faux refusent le démarrage en production ; l’en-tête X-Test-Otp-Code du faux reste jusqu’à la mission 12b (OP-N120).</text>
