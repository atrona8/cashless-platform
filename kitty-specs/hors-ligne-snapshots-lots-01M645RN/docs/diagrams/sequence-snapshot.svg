<text x="1115.0" y="1639.995" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="middle">Enregistrer l’accusé</text>
<text x="34.0" y="1661.7699999999998" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle">19</text>
<text x="60" y="1749.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Un signataire par grand livre : un FULL ne retarde plus le DELTA d&#x27;un autre. Cadence : 60 s, 5 s après un blocage. Échec de signature : rien de publié.</text>
