<text x="60" y="1031.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Le vendeur ouvre sa session en ligne (valable 12 h) ; aucune connexion hors ligne. Aucune recharge espèces hors ligne (décision du 30/10/2026).</text>
<text x="60" y="1063.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Une recharge espèces dans un lot est rejetée seule, avec une anomalie portant le montant.</text>
