<text x="60" y="1293.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Approbation : même personne que l’auteur ou le demandeur, refus. FAILED : refusé à l’auteur et au valideur (403). Autorité EDGE : 409. PAID n’écrit rien. Livré (16/11/2026).</text>
