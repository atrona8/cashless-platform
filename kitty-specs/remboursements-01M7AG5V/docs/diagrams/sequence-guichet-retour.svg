<text x="60" y="1075.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Tout ou rien : un refus à une étape n’écrit rien ; rejeu avec la même clé : même réponse. Planifié (plan du 13/11/2026), non implémenté.</text>
