<text x="60" y="1111.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Jamais de crédit sans notification authentifiée (ou statut confirmé par interrogation). Carte : 3-D Secure attesté, plafond par carte et par jour. PSP réels reportés : faux refusé en production (OP-N81).</text>
