<text x="960.0" y="1031.9950000000001" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="middle">Fermeur ayant compté : 403</text>
<text x="34.0" y="1053.77" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle">11</text>
<text x="60" y="1141.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Ordre des verrous fixé par la migration 0040 : plus d&#x27;interblocage avec une recharge en espèces. Sans comptage : 409. Seconde session sur la caisse ou le terminal : 409. Vue CASHIER : écart masqué.</text>
