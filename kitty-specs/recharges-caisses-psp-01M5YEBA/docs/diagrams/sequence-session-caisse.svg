<text x="60" y="105.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Ouverture au terminal, comptage à l’aveugle, fermeture par une autre personne</text>
