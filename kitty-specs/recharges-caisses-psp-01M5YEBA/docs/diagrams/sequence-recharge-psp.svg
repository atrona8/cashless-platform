<text x="60" y="1445.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Non créditable (plafond, 3-D Secure, grand livre fermé) : FAILED, aucune écriture, anomalie. Annulation : même schéma en trois temps.</text>
