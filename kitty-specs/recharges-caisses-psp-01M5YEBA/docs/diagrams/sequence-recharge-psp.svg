<text x="60" y="105.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Rien n’est crédité avant la notification authentifiée ; l’appel au PSP se fait hors transaction</text>
