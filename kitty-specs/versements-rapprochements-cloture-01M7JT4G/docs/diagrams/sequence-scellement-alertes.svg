<text x="60" y="1196.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Implémenté (review du 17/11/2026), servi sur la branche de la mission, 404 dans feat et main.</text>
<text x="60" y="1221.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Scellement toutes les 5 min, y compris LOCKED. Cinq contrôles : sommes nulles, droits = argent, versements &gt; 48 h, relevés non rapprochés, anomalies PSP, transactions &gt; 60 s.</text>
<text x="60" y="1246.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Dette consignée : la copie externe reste simulée et l’alerte n’atteint aucune personne avant la mission 12b.</text>
