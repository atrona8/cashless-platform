<text x="60" y="62.65" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#0F172A" text-anchor="start">Versements, rapprochements et relevés</text>
<text x="60" y="105.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Qui prépare, valide, confirme, importe, rapproche et obtient un relevé</text>
<text x="275.0" y="145.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0061FF" text-anchor="middle">Acteurs</text>
<text x="1225.0" y="145.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0061FF" text-anchor="middle">Cas d&#x27;usage</text>
<text x="275.0" y="274.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Administrateur (auteur du lot)</text>
<text x="275.0" y="474.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Administrateur (valideur)</text>
<text x="275.0" y="674.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Back-office</text>
<text x="275.0" y="874.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Partie concernée</text>
<text x="275.0" y="1074.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Exploitant</text>
<text x="1225.0" y="224.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#374151" text-anchor="middle">Voir les droits nets</text>
<text x="1225.0" y="324.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Préparer un lot de versements</text>
<text x="1225.0" y="424.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Valider le lot (à deux)</text>
<text x="1225.0" y="524.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Exporter le lot en CSV</text>
<text x="1225.0" y="624.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Confirmer ou déclarer en échec</text>
<text x="1225.0" y="724.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Importer un relevé CSV</text>
<text x="1225.0" y="824.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Rapprocher une ligne à la main</text>
<text x="1225.0" y="924.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Créer une demande de remboursement</text>
<text x="1225.0" y="1024.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#374151" text-anchor="middle">Obtenir mon relevé (API, CSV)</text>
<text x="1225.0" y="1124.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#374151" text-anchor="middle">Configurer et exporter la comptabilité</text>
<text x="60" y="1211.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Implémenté (review du 17/11/2026), servi sur la branche de la mission, 404 dans feat et main.</text>
<text x="60" y="1243.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Rôle du lot selon le bénéficiaire : organisateur pour les commerçants et l’organisateur, exploitant de la plateforme pour le prestataire et la plateforme.</text>
<text x="60" y="1275.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Partie : commerçant, festivalier, organisateur, prestataire ou plateforme.</text>
<text x="60" y="1307.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Aucun paiement n’est envoyé par l’API : paiement hors système, puis confirmation de chaque ligne.</text>
<text x="60" y="1339.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Aucun PDF. Export CSV : numéro sans « + ».</text>
</g>
