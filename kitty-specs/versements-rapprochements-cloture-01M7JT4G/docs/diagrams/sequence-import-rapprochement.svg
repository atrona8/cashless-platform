<text x="572.5" y="1556.395" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="middle">État de rapprochement des comptes</text>
<text x="34.0" y="1578.1699999999998" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle">13</text>
<text x="572.5" y="1653.395" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="middle">Compte rapproché : lignes toutes rapprochées et soldes concordants</text>
<text x="60" y="1728.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Implémenté (review du 17/11/2026), servi sur la branche de la mission, 404 dans feat et main.</text>
<text x="60" y="1753.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Les anomalies PSP ouvertes sont représentées dans l’écart, non comptées comme inexpliquées.</text>
<text x="60" y="1778.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Une condition « comptes PSP rapprochés » gate le passage à SETTLING.</text>
