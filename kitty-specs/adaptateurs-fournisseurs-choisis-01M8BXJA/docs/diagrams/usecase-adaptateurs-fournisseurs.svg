<text x="1225.0" y="232.09285714285713" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Recharger par Wave</text>
<text x="1225.0" y="346.37857142857143" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Recharger par PayDunya</text>
<text x="1225.0" y="460.6642857142857" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Recharger par carte Stripe</text>
<text x="1225.0" y="574.95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Rapprocher les paiements</text>
<text x="1225.0" y="689.2357142857143" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Ranger les identifiants au coffre</text>
<text x="1225.0" y="803.5214285714286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Clés et scellements sur AWS</text>
<text x="1225.0" y="917.8071428571429" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0F172A" text-anchor="middle">Essayer puis lever la garde</text>
<text x="60" y="1011.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Relu le 27/11/2026 : code livré, aucun essai réel, liste PRODUCTION_ENABLED_SERVICES vide. Décisions D1 à D9 du porteur : Orange Money hors périmètre,</text>
<text x="60" y="1043.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">PayDunya traité comme un signal, refus en production jusqu’à l’essai réel (liste dans le code, PR relue), remboursement hors plateforme.</text>
