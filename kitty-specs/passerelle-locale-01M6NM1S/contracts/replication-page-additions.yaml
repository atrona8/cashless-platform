# Extrait OpenAPI 3.1 : ajouts facultatifs à `ReplicationPage` (mission 8, passerelle locale)
#
# SCHÉMA UNIQUE de la mission 8 pour le flux de réplication (passe contradictoire, A02) : aucune autre description
# (research.md, data-model.md, gateway-served-operations.md) ne définit de champ concurrent. Les champs `service_state`
# et `service_state_version` d'une version antérieure de research.md n'existent pas : ils sont remplacés par le bloc
# `reference` et son curseur `change_seq`.
#
# Portée : `GET /edge/replication-feed` (`getEdgeReplicationFeed`), le schéma `ReplicationPage`, et le corps de
# `POST /edge/sync-batches` (`EdgeSyncBatch`, une propriété facultative d'audit, décision 18 du porteur). Tout est sous
# `/edge/*` ; `ReplicationPage` et `EdgeSyncBatch` ne sont référencés que par ces deux routes (vérifié dans
# `openapi.yaml` : lignes 7000 et 7058). Aucune autre route, aucun autre schéma, aucun code d'erreur, aucun champ
# `required` n'est touché (C-002, NFR-012). Aucune valeur d'énumération n'est ajoutée nulle part (A11).
# Contrôle de référence : `packages/contracts/openapi.yaml` au commit d2a7c538 (identique au fichier courant au
# 05/11/2026) ; `ReplicationPage` y est aux lignes 14690-14728, la route aux lignes 6968-7015.
#
# Règles de lecture
#   - Tout ce qui est ajouté est facultatif. Un client qui ignore ces champs (il n'en existe pas d'autre que la
#     passerelle) reçoit la même page qu'aujourd'hui. `additionalProperties` n'est pas fermé sur `ReplicationPage`.
#   - Le bloc `reference` n'est servi que si la passerelle envoie le paramètre `after_change_seq` (accepté par le
#     porteur, décision 12). Sans lui, la réponse reste celle d'aujourd'hui, aux champs `edge_seq_applied`,
#     `device_seq_acked` et `pwd_pack_key` près, tous facultatifs.
#   - Trois curseurs indépendants, avancés par la passerelle dans la transaction locale qui applique la page :
#     `after_posting_id` (soldes), `after_change_seq` (référence), et la position du lot de la file (`edge_seq`).
#   - Aucun secret en clair : voir la section "Ce que le flux ne porte jamais" en fin de fichier.
#   - Le minimum : chaque champ cite l'opération servie qui le requiert. Les candidats écartés sont en fin de fichier.
#
# Ce fichier est un EXTRAIT à fusionner dans `openapi.yaml` par la mission (IC-15), puis à régénérer
# (`npm run generate`, types TypeScript et Dart). Il n'est pas lu par la CI tel quel.

openapi: 3.1.0
info:
  title: Ajouts facultatifs à ReplicationPage (extrait)
  version: 0.0.0

paths:
  /edge/replication-feed:
    get:
      # Seule modification d'opération : un paramètre de requête facultatif, sous /edge/*.
      # Les paramètres existants (after_posting_id obligatoire, Limit, RequestId, AcceptLanguage) sont inchangés.
      parameters:
        - name: after_change_seq
          in: query
          required: false
          description: |
            Curseur du bloc `reference` (journal des changements de données de référence). Absent : le bloc
            `reference` n'est pas servi et la réponse est celle d'avant l'ajout. Présent (0 pour une première
            copie complète) : la page porte, dans `reference`, les entités de référence modifiées depuis ce
            curseur, au plus `Limit` entités au total. Le curseur ne progresse qu'avec la réponse reçue ; la
            passerelle le mémorise après l'avoir appliqué (reprise sans trou ni doublon, US5-3). Une requête qui
            porte le curseur `c` prouve au central que la passerelle a appliqué toutes les pages jusqu'à `c` : le
            central le consigne (`reference_applied_seq`) et `edge_ack_handover` refuse l'accusé tant que ce curseur
            n'a pas atteint le curseur de référence pris à l'accord (A03). Avant d'accuser, la passerelle relit donc
            une page avec son curseur final (page vide).
          schema:
            type: integer
            format: int64
            minimum: 0

components:
  schemas:
    ReplicationPage:
      type: object
      required: [ledger_id, epoch, from_posting_id, to_posting_id, wallets, media, has_more] # inchangé
      # Sémantique précisée, sans changer de champ (A18) : `to_posting_id` ne dépasse jamais l'horizon des écritures
      # validées (aucune transaction d'écriture en vol dont une ligne aurait un `id` inférieur), pris sous un verrou
      # exclusif très bref de l'autorité de débit. Aucune écriture validée hors ordre ne peut donc être sautée.
      properties:
        # ---- propriétés existantes, inchangées : ledger_id, epoch, from_posting_id, to_posting_id, media, has_more
        wallets:
          type: array
          items:
            type: object
            required: [wallet_id, status, paid, promo] # inchangé
            properties:
              # ---- propriétés existantes inchangées : wallet_id, status, paid, promo
              kyc_verified: # AJOUT
                type: boolean
                description: |
                  Le portefeuille est rattaché à un client identifié (`wallet_kyc_level = VERIFIED`) à la date de la
                  page. Choisit le palier des plafonds (`event.wallet_limits`). Absent : traiter comme non identifié
                  (le palier le plus strict). Usage : `createCashTopup` (`422 WALLET_LIMIT_EXCEEDED`,
                  `422 MONTHLY_TOPUP_LIMIT_EXCEEDED`, appliqués par `check_wallet_limits`).
              topup_month_paid: # AJOUT
                type: integer
                format: int64
                minimum: 0
                description: |
                  Total des recharges (`TOPUP`, `TOPUP_CASH`) créditées au portefeuille payé pendant le mois UTC
                  de `to_posting_id` (même calcul que `check_wallet_limits`). La passerelle y ajoute ses propres
                  recharges du mois. Usage : plafond mensuel de `createCashTopup`. Absent : traiter comme inconnu et
                  refuser une recharge qui dépasserait le plafond mensuel du palier le plus strict.
        edge_seq_applied: # AJOUT
          type: integer
          format: int64
          minimum: 0
          description: |
            `contiguous_edge_seq` de la passerelle (dernier `edge_seq` enregistré au registre du central), lu dans la
            MÊME transaction `REPEATABLE READ` que les soldes de la page. Sert au calcul du solde effectif de la
            passerelle : solde central répliqué plus les deltas locaux des opérations d'`edge_seq` supérieur à cette
            valeur, ce qui évite le double comptage d'une vente déjà rejouée (A02, A26). Présent sur chaque page.
        device_seq_acked: # AJOUT
          type: array
          description: |
            Accusé du central par terminal de l'événement, pour `getDeviceSeqStatus` (FR-026). Remplace tout champ
            `seq_status` par terminal : il n'existe qu'ici. Après la bascule la passerelle ne l'avance que par les
            résultats de `submitEdgeSyncBatch`, jamais provisoirement. Servi sur la dernière page d'une passe
            (`has_more = false`) ; périmé plutôt que provisoire.
          items:
            $ref: '#/components/schemas/EdgeDeviceSeqAcked'
        pwd_pack_key: # AJOUT
          $ref: '#/components/schemas/WrappedKey'
          description: |
            Clé de contenu PAR PASSERELLE (et par clé d'accord), pas par page : elle est la même à chaque page tant que
            la clé d'accord de la passerelle ne change pas (le central la génère une fois, la scelle pour
            `edge_gateway.agreement_public_key`, jamais pour un terminal, et la dépose avec les colis). Elle ouvre les
            `pwd_pack_enc` des entrées de `media` et de `reference.unassigned_media`. Absente (et colis non servis)
            pour une passerelle `STANDBY` non promue et pendant le délai suivant l'inscription ou la promotion (A16).
            Requise
            par le contrat existant des entrées (`SnapshotEntry.pwd_pack_enc`) mais absente de la page
            aujourd'hui : sans elle la passerelle ne peut pas ouvrir les mots de passe qu'on lui envoie.
            Usage : `getMediaAuthKey` (re-chiffrement pour le terminal) et `getOfflineSnapshot` (snapshot signé
            par la passerelle). Le central l'émet dès qu'une entrée de la page porte un `pwd_pack_enc`.
            La construction de scellement et l'AAD (liaison à `ledger_id`, `edge_gateway_id` et à la page) sont
            fixés par le plan ; le central ne scelle que pour la clé d'accord de la passerelle appelante.
        reference: # AJOUT
          $ref: '#/components/schemas/EdgeReference'
          description: |
            Données de référence que la passerelle ne peut pas déduire des écritures (sessions, terminaux,
            personnes habilitées, catalogue, réglages de l'événement, bracelets non encore attachés).
            Servi seulement si la requête porte `after_change_seq`.

    EdgeReference:
      type: object
      description: |
        Changements de données de référence de l'événement de la passerelle, par ordre de `change_seq`. Chaque
        entité modifiée est renvoyée en entier (état courant, pas de différence). Une fermeture ou une
        révocation est un changement d'état de l'entité (`status`, `closed_at`), jamais une suppression : la
        passerelle n'a donc besoin d'aucun marqueur de suppression. Tout est limité à l'événement, au grand
        livre et au prestataire de la passerelle authentifiée (NFR-011).
      required: [from_change_seq, to_change_seq, has_more]
      # `change_seq` : journal central `edge_reference_change`, numéro attribué sous un verrou consultatif par grand
      # livre tenu jusqu'à la validation, donc l'ordre des numéros est l'ordre de validation (aucun saut possible).
      # Il couvre tout changement sans écriture comptable : statut d'un bracelet ou d'un portefeuille (blocage),
      # palier d'identification, sessions, terminaux, personnes, catalogue, réglages, rôle de la passerelle (A03, A25).
      properties:
        from_change_seq:
          type: integer
          format: int64
          minimum: 0
          description: Curseur reçu.
        to_change_seq:
          type: integer
          format: int64
          minimum: 0
          description: Dernier changement inclus ; à renvoyer comme `after_change_seq`.
        has_more:
          type: boolean
          description: |
            D'autres changements attendent. Indépendant de `ReplicationPage.has_more` : la passerelle boucle
            tant que l'un des deux est vrai. Les deux curseurs avancent séparément.
        gateway:
          $ref: '#/components/schemas/EdgeGatewaySelf'
        event:
          $ref: '#/components/schemas/EdgeEventSettings'
        wallet_states:
          type: array
          items:
            $ref: '#/components/schemas/EdgeWalletState'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/EdgeDevice'
        device_configs:
          type: array
          items:
            $ref: '#/components/schemas/EdgeDeviceConfig'
        cash_sessions:
          type: array
          items:
            $ref: '#/components/schemas/EdgeCashSession'
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/EdgeVendor'
        vendor_sessions:
          type: array
          items:
            $ref: '#/components/schemas/EdgeVendorSession'
        staff:
          type: array
          items:
            $ref: '#/components/schemas/EdgeStaff'
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/EdgeCatalog'
        media_refs:
          type: array
          items:
            $ref: '#/components/schemas/EdgeMediaRef'
        unassigned_media:
          type: array
          items:
            $ref: '#/components/schemas/EdgeUnassignedMedia'

    EdgeGatewaySelf:
      type: object
      description: |
        Ligne de la passerelle appelante (jamais d'une autre). Porte son rôle : la promotion d'une `STANDBY` est
        un changement de rôle fait au central par la fonction atomique `swap_edge_gateway_roles` ; la passerelle
        l'apprend par ce bloc, relu à chaque passe (A25). Sûreté : elle ne débite jamais sans l'accusé `200`.
      required: [gateway_id, role, status]
      properties:
        gateway_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [PRIMARY, STANDBY]
        status:
          type: string
          enum: [ACTIVE, ISOLATED, CATCHING_UP, REVOKED]
        role_changed_at:
          $ref: '#/components/schemas/Timestamp'

    EdgeWalletState:
      type: object
      description: |
        État d'un portefeuille changé SANS écriture comptable : blocage ou déblocage (statut), palier
        d'identification. Un blocage n'écrit aucun `posting` : le curseur de soldes ne le livrerait pas (A03).
        Prime sur `wallets[].status` et `wallets[].kyc_verified` pour la même valeur de `change_seq` ultérieure.
      required: [wallet_id, status, kyc_verified]
      properties:
        wallet_id:
          type: string
          format: uuid
        status:
          type: string
          description: Statut du portefeuille (même énumération que `wallets[].status`).
        kyc_verified:
          type: boolean

    EdgeEventSettings:
      type: object
      description: |
        Réglages de l'événement. Usage : `getDeviceConfig` et `postDeviceHeartbeat` (blocs `event` et
        `terminal_settings`), refus `EVENT_CLOSING` / `LEDGER_LOCKED` des ventes et recharges, mode d'activation
        autorisé de `activateMedia` (`422 ACTIVATION_MODE_NOT_ALLOWED`), plafonds de `createCashTopup`.
      required: [event_id, name, currency, minor_units, timezone, status, activation_modes, terminal_settings, wallet_limits]
      properties:
        event_id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        minor_units:
          type: integer
          minimum: 0
          maximum: 3
        timezone:
          type: string
        status:
          type: string
          enum: [DRAFT, LIVE, CLOSING, RECONCILING, SETTLING, REFUND_WINDOW, CLOSED]
        activation_modes:
          type: array
          items:
            type: string
            enum: [DESK, SELF_APP, FIRST_TOPUP]
        terminal_settings:
          $ref: '#/components/schemas/DeviceConfig/properties/terminal_settings'
        wallet_limits:
          type: object
          description: |
            Plafonds de la législation du grand livre (`jurisdiction_profile`), en unités mineures ; nul = aucun
            plafond. Quatre valeurs, celles que lit `check_wallet_limits` ; rien d'autre du profil n'est servi.
          required: [max_wallet_balance, unidentified_max_balance, identified_monthly_limit, unidentified_monthly_limit]
          properties:
            max_wallet_balance:
              type: [integer, 'null']
              format: int64
            unidentified_max_balance:
              type: [integer, 'null']
              format: int64
            identified_monthly_limit:
              type: [integer, 'null']
              format: int64
            unidentified_monthly_limit:
              type: [integer, 'null']
              format: int64

    EdgeDevice:
      type: object
      description: |
        Terminal de l'événement. Usage : les trois preuves du terminal sur chacune des 16 opérations (certificat,
        clé de signature de requête, état), blocs `device` et `pos` de `getDeviceConfig`, enveloppe du mot de
        passe pour ce terminal (`getMediaAuthKey`, `getOfflineSnapshot`), `getDeviceSeqStatus`. Un terminal
        suspendu ou révoqué au central l'est sur la passerelle dès réception. Aucune de ces valeurs n'est
        secrète (certificat, clés publiques), sauf `token_family` (empreinte d'un jeton de rafraîchissement, voir sa
        description) ; elles ne sortent que par `/edge/*`, comme `DeviceAdmin` les cache aux écrans.
      required: [device_id, serial, kind, app_mode, os, nfc_enabled, status, public_key, cert_sha256]
      properties:
        device_id:
          type: string
          format: uuid
        serial:
          type: string
        kind:
          $ref: '#/components/schemas/DeviceKind'
        app_mode:
          $ref: '#/components/schemas/DeviceAppMode'
        os:
          type: string
          enum: [ANDROID, IOS]
        nfc_enabled:
          type: boolean
        status:
          $ref: '#/components/schemas/DeviceStatus'
        station_name:
          type: [string, 'null']
        pos:
          type: [object, 'null']
          description: Point de vente du terminal (bloc `pos` de `DeviceConfig`) ; nul sans point de vente.
          required: [pos_id, name, merchant_name]
          properties:
            pos_id:
              type: string
              format: uuid
            name:
              type: string
            merchant_name:
              type: string
        cash_desk_account_id:
          type: [string, 'null']
          format: uuid
          description: |
            Compte d'espèces de la station du terminal. Usage : `EdgeSyncOperation.edge_guichet.cash_desk_account_id`,
            obligatoire pour une opération `DEPOSIT_CASH` de la file ; sans ce champ la passerelle ne peut pas
            décrire une caution en espèces.
        public_key:
          type: string
          contentEncoding: base64
          description: Clé publique de signature du terminal (`device.public_key`) ; épingle `cnf.jkt` et vérifie RFC 9421.
        cert_sha256:
          $ref: '#/components/schemas/Hex32'
        agreement_public_key:
          type: [string, 'null']
          contentEncoding: base64
          description: Clé d'accord ECDH P-256 du terminal ; nulle pour un terminal sans mots de passe hors ligne.
        token_family:
          type: [object, 'null']
          description: |
            Famille de jetons d'appareil du terminal, pour `refreshDeviceToken` sur la passerelle SANS rotation
            (décision 11 du porteur, A01) : la passerelle vérifie le jeton de rafraîchissement présenté contre
            l'empreinte courante, avec la preuve de possession (signature du terminal) et le certificat, puis émet un
            jeton d'accès court, valable sur elle seule (`aud` de la passerelle), sans consommer ni faire tourner le
            jeton de rafraîchissement. Le central ne sert l'empreinte qu'à la passerelle `PRIMARY` de l'événement,
            marque la famille `edge_exposed` et force la rotation au rendu (la détection de réutilisation est
            retrouvée). C'est un secret dérivé de plus sur le site : écart accepté, ADR et OP à l'appui.
          required: [fid, status, refresh_token_sha256_current]
          properties:
            fid:
              type: string
            status:
              type: string
              enum: [ACTIVE, REVOKED]
            refresh_token_sha256_current:
              $ref: '#/components/schemas/Hex32'

    EdgeDeviceSeqAcked:
      type: object
      description: |
        État des numéros d'un terminal vu par le central à la date de la page : base de `getDeviceSeqStatus` et de
        `DeviceConfig.seq`. Un seul endroit du flux le porte (A02).
      required: [device_id, contiguous_acked_seq, max_seen_seq, missing_seqs, next_seq_floor, as_of]
      properties:
        device_id:
          type: string
          format: uuid
        contiguous_acked_seq:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        max_seen_seq:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        missing_seqs:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
        next_seq_floor:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        as_of:
          $ref: '#/components/schemas/Timestamp'

    EdgeDeviceConfig:
      type: object
      description: |
        Configuration effective servie par le central à un terminal, et celles encore en vigueur. Usage :
        `getDeviceConfig` et `postDeviceHeartbeat` doivent rendre le `config_id` du central (il ne se recrée
        pas sur la passerelle) ; `submitOfflineBatch` contrôle les plafonds de la configuration citée par
        `OfflineOperation.config_id` (sync_protocol.md §7.2, historique des politiques effectives). Une entrée
        par `config_id` encore admissible ; la dernière en vigueur porte `in_force = true`.
      required: [config_id, device_id, in_force, offline_policy]
      properties:
        config_id:
          type: integer
          format: int64
        device_id:
          type: string
          format: uuid
        in_force:
          type: boolean
        offline_policy:
          $ref: '#/components/schemas/OfflinePolicy'

    EdgeCashSession:
      type: object
      description: |
        Session de caisse d'un terminal `TOPUP_DESK`. Usage : `createCashTopup` (`409 CONFLICT_STATE` sans
        session `OPEN` du terminal, FR-015), `takeDeposit` en espèces (idem, `cash_session_id` facultatif de la
        requête) ; condition 3 de la tolérance du jeton de personne (la personne qui a ouvert la session). Le
        contrat public ne connaît que `OPEN` et `CLOSED` (`CashSession.status`) ; ici `CLOSING` existe aussi
        (`cash_session.status`) et vaut fermé pour la passerelle. Ni théorique, ni compté, ni écart, ni compte
        d'espèces : la passerelle n'en a pas l'usage.
      required: [cash_session_id, device_id, status, opened_by, opened_at]
      properties:
        cash_session_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, CLOSING, CLOSED]
        opened_by:
          type: string
          format: uuid
          description: Identifiant de la personne (`EdgeStaff.user_id`) qui a ouvert la session.
        opened_at:
          $ref: '#/components/schemas/Timestamp'
        closed_at:
          $ref: '#/components/schemas/Timestamp'

    EdgeVendor:
      type: object
      description: |
        Vendeur. Usage : `createPayment` et `reversePayment` (vendeur `ACTIVE` et non bloqué, sinon
        `409 VENDOR_SESSION_INVALID`), attribution et `PaymentResult.vendor` (`display_name`). JAMAIS de PIN, ni
        d'empreinte de PIN (`pin_hash`), ni de compteur d'échecs, ni de secret de PIN : la passerelle n'ouvre
        aucune session vendeur, elle n'a donc rien à vérifier.
      required: [vendor_id, display_name, status, locked]
      properties:
        vendor_id:
          type: string
          format: uuid
        display_name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        locked:
          type: boolean
          description: Vrai si le vendeur est bloqué (`locked_at` non nul). Le compteur d'échecs n'est pas servi.

    EdgeVendorSession:
      type: object
      description: |
        Session vendeur ouverte au central. Usage : `assert_vendor_session` de `createPayment` et
        `reversePayment` (ouverte sur ce terminal, non expirée). La passerelle ne l'ouvre ni ne la prolonge
        (`expires_at` = `opened_at` + 12 h, contrainte `vendor_session_ttl`).
      required: [vendor_session_id, vendor_id, device_id, opened_at, expires_at]
      properties:
        vendor_session_id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        opened_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        closed_at:
          $ref: '#/components/schemas/Timestamp'
        closed_reason:
          type: string
          enum: [LOGOUT, REPLACED, VENDOR_DISABLED, VENDOR_LOCKED, DEVICE_SUSPENDED, DEVICE_REVOKED, PIN_CHANGED]

    EdgeStaff:
      type: object
      description: |
        Personne habilitée au guichet ou à l'approbation de terrain, avec ses seuls rôles `CASHIER` et
        `SUPERVISOR`. Usage : `X-Staff-Authorization` de `createCashTopup`, `activateMedia`, `takeDeposit` (le
        jeton prouve l'identité `issuer` + `subject` ; le prestataire, le statut et les rôles sont relus ici,
        comme `tx.identify` au central) ; `reversePayment` sur approbation d'un `SUPERVISOR` ; condition 2 de la
        tolérance du jeton expiré (même personne que `EdgeCashSession.opened_by`). Aucune coordonnée (courriel,
        téléphone) ni nom : le minimum pour identifier et autoriser. Un autre rôle (`OPERATOR_ADMIN`...) n'est
        pas servi.
      required: [user_id, issuer, subject, status, roles]
      properties:
        user_id:
          type: string
          format: uuid
        issuer:
          type: string
        subject:
          type: string
        status:
          type: string
          description: État de la personne (`app_user.status`) ; tout état autre qu'`ACTIVE` refuse l'accès.
        roles:
          type: array
          description: >-
            Affectations non révoquées de `CASHIER` ou `SUPERVISOR`. Vide : la personne perd l'accès.
          items:
            type: object
            required: [role, scope_type, scope_id]
            properties:
              role:
                type: string
                enum: [CASHIER, SUPERVISOR]
              scope_type:
                type: string
                enum: [ORGANIZER, EVENT]
              scope_id:
                type: string
                format: uuid

    EdgeCatalog:
      type: object
      description: |
        Catalogue d'un point de vente de l'événement. Usage : `createPayment` depuis une caisse `CATALOG_POS`
        (lignes obligatoires, prix et taux, sinon `422 SALE_LINES_INVALID`), bloc `catalog` de `getDeviceConfig`.
        Les libellés sont servis dans les deux langues du catalogue : la passerelle choisit selon
        `Accept-Language`, comme le central.
      required: [pos_id, version, items]
      properties:
        pos_id:
          type: string
          format: uuid
        version:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [product_id, name_fr, name_en, unit_price, vat_rate_bps]
            properties:
              product_id:
                type: string
                format: uuid
              name_fr:
                type: string
              name_en:
                type: string
              category_fr:
                type: string
              category_en:
                type: string
              unit_price:
                $ref: '#/components/schemas/Amount'
              vat_rate_bps:
                type: integer
                minimum: 0
                maximum: 10000

    EdgeMediaRef:
      type: object
      description: |
        Lien entre un bracelet attaché et son identifiant. Usage : la réponse de `createTap` rend le bracelet ;
        `takeDeposit` porte `media_id` dans son chemin ; `EdgeSyncOperation.edge_guichet.media_id` est obligatoire
        pour `ACTIVATION` et `DEPOSIT_CASH`. `SnapshotEntry` (déjà dans `media`) ne porte ni `media_id`, ni
        `wallet_id`, et ne peut pas être modifié : c'est un schéma partagé avec des routes hors `/edge/*`.
      required: [media_id, token_hash, wallet_id, status]
      properties:
        media_id:
          type: string
          format: uuid
        token_hash:
          $ref: '#/components/schemas/Hex32'
        wallet_id:
          type: [string, 'null']
          format: uuid
          description: Portefeuille rattaché ; nul pour un bracelet non attaché (voir `unassigned_media`).
        status:
          $ref: '#/components/schemas/MediaStatus'
          description: |
            Statut courant du bracelet. Un blocage n'écrit aucun `posting` : le statut vient d'ici (journal
            `change_seq`), et prime sur `media[]` pour le statut et le statut de lot (A03).
        batch_status:
          type: [string, 'null']
          enum: [ORDERED, PERSONALIZED, DELIVERED, ACTIVE, SUSPENDED, CLOSED, null]

    EdgeUnassignedMedia:
      type: object
      description: |
        Bracelet de l'événement personnalisé mais pas encore attaché (aucun portefeuille). Le flux existant
        (`media`, "une entrée par rattachement ouvert") ne peut pas le porter, car `SnapshotEntry.wallet_status`
        est obligatoire. Usage : `getMediaAuthKey` (PWD/PACK avant `PWD_AUTH`), `createTap` (`NOT_ACTIVATED` plutôt
        que `UNKNOWN`), `activateMedia` (vérification de l'UID et de la signature d'originalité). Sans lui,
        l'activation au guichet pendant la coupure est impossible, alors qu'elle est servie (ADR-52).
      required: [media_id, nfc_uid, token_hash, key_index, originality_sig_sha256, status, batch_event_id, batch_status, pwd_pack_enc, pwd_pack_sha256]
      properties:
        media_id:
          type: string
          format: uuid
        nfc_uid:
          $ref: '#/components/schemas/NfcUid'
        token_hash:
          $ref: '#/components/schemas/Hex32'
        key_index:
          type: integer
        originality_sig_sha256:
          oneOf:
            - $ref: '#/components/schemas/Hex32'
            - type: 'null'
        status:
          $ref: '#/components/schemas/MediaStatus'
        batch_event_id:
          type: [string, 'null']
          format: uuid
        batch_status:
          type: [string, 'null']
          enum: [ORDERED, PERSONALIZED, DELIVERED, ACTIVE, SUSPENDED, CLOSED, null]
        pwd_pack_enc:
          oneOf:
            - $ref: '#/components/schemas/EncryptedBlob'
            - type: 'null'
          description: |
            PWD||PACK chiffré (AES-256-GCM) avec la clé de contenu de `ReplicationPage.pwd_pack_key`. Jamais en
            clair, jamais la clé maître du bracelet (C-009, NFR-010).
        pwd_pack_sha256:
          oneOf:
            - $ref: '#/components/schemas/Hex32'
            - type: 'null'

# (suite des schémas)
    EdgeSyncBatch: # EXTRAIT : seule la propriété ajoutée est décrite ; les propriétés existantes sont inchangées
      type: object
      required: [batch_id, edge_gateway_id, ledger_id, epoch, edge_seq_from, edge_seq_to, prev_chain_hash, last_chain_hash, operations, signature] # inchangé
      properties:
        staff_token_audit: # AJOUT (décision 18 du porteur)
          type: array
          maxItems: 500
          description: |
            Audit des usages d'un jeton de personne EXPIRÉ toléré au guichet de la passerelle (tolérance de la
            décision 3 du porteur), pour les opérations de ce lot : au plus une ligne par opération, donc 500. Les
            lignes sont couvertes par la signature du lot (`signature` porte sur le lot entier sans elle). Le central
            les range dans `edge_staff_token_audit` (immuable, par passerelle) et les recopie dans l'audit de la
            plateforme. Absent ou vide : aucun usage toléré dans ce lot. Une ligne dont `edge_seq` n'est pas dans
            l'intervalle du lot est refusée (`400`, lot non traité).
          items:
            $ref: '#/components/schemas/EdgeStaffTokenAudit'

    EdgeStaffTokenAudit:
      type: object
      required: [edge_seq, at, subject, issuer, jti, seconds_past_expiry, route, device_serial]
      properties:
        edge_seq:
          type: integer
          format: int64
          minimum: 1
          description: Opération de la file que ce jeton a autorisée.
        at:
          $ref: '#/components/schemas/Timestamp'
        subject:
          type: string
        issuer:
          type: string
        jti:
          type: string
        seconds_past_expiry:
          type: integer
          minimum: 1
        route:
          type: string
          enum: [activateMedia, takeDeposit, createCashTopup]
        device_serial:
          type: string
        cash_session_id:
          type: string
          format: uuid

# ============================================================================================================
# Ce que le flux ne porte jamais (NFR-010, C-009)
#   - aucune clé maître de bracelet, aucun PWD ni PACK en clair (seulement `pwd_pack_enc` sous `pwd_pack_key`) ;
#   - aucune empreinte de PIN de vendeur (`pin_hash`), aucun PIN, aucun compteur d'échecs de PIN ;
#   - aucun jeton d'appareil, aucun jeton de rafraîchissement en clair, aucune clé privée, aucun secret de signature
#     (seule exception, décision 11 du porteur : l'EMPREINTE SHA-256 du jeton de rafraîchissement courant,
#     `devices[].token_family`) ;
#   - aucune coordonnée de personne (courriel, téléphone, nom), aucun rôle autre que CASHIER et SUPERVISOR ;
#   - aucune donnée d'un autre événement, d'un autre grand livre ou d'un autre prestataire.
# Test attendu (IC-04, NFR-010, A22) : canari dans chacun de ces champs côté central, recherché sous TOUTES ses
# représentations (UTF-8, hexadécimal minuscule et majuscule, base64, base64url, échappements JSON et SQL, entier
# décimal pour une valeur numérique) dans le flux, la base de la passerelle (dump compris), les journaux de
# PostgreSQL local (`log_statement = all` activé pour le test), la sortie standard et d'erreur de la passerelle et
# de ses processus enfants, et l'image. Un CONTRÔLE POSITIF est obligatoire : une version volontairement fautive du
# code (qui journalise le canari en base64) doit faire échouer le test, sinon le test ne prouve rien.
# Test de cloisonnement (NFR-011) : une seconde passerelle d'un autre événement ne voit aucune entité de la première,
# sur chaque tableau.
#
# Candidats écartés (aucun usage prouvé, ou solution sans champ)
#   - `device_token_keys` (clés publiques de vérification des jetons du CENTRAL) : la passerelle ne vérifie que ses
#     propres jetons (décisions 2 et 11 du porteur). Un terminal qui présente encore un jeton du central reçoit
#     `401` et rafraîchit sur la passerelle ; pas de clé du central sur le site.
#   - `identity_keys` (JWKS du serveur d'identité) : clés publiques d'un tiers, pas des données du central. La
#     passerelle en tient une copie qu'elle rafraîchit tant que le serveur d'identité est joignable ; pendant la
#     coupure elle vérifie avec cette copie (hypothèse de la spec). Aucun champ.
#   - `snapshot_keys` du central : un snapshot se vérifie à sa réception ; la passerelle déclare sa seule clé
#     dans `config.snapshot_keys`. Aucune vérification du central n'a lieu sur la passerelle.
#   - historique complet des politiques, jeux d'essai, `expected_amount`, `cash_account_id` d'une session,
#     coordonnées des personnes : aucune opération servie ne les lit.
#   - `tap_id` du central : un `tap_id` est local à la passerelle (`createTap` y est servi) ; aucune réplication.
#   - `service_state`, `service_state_version`, `after_change_cursor` (version antérieure de research.md) : remplacés
#     par `reference` et `after_change_seq`.
#   - changement du palier d'identification sans écriture : couvert par `reference.wallet_states` (journal
#     `change_seq`), il n'est donc plus une limite (une perte d'identification pendant la coupure est livrée).
