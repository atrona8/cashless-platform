  /offline-batches/{batch_id}:
    get:
      tags: [Hors ligne]
      operationId: getOfflineBatchResult
      summary: Relire le résultat d'un lot (reprise après coupure pendant la réponse)
      description: |
        Résultat mémorisé du lot. Un lot abandonné (traitement interrompu plus de 15 min) répond `200` avec
        `abandoned: true` et les résultats des seules opérations traitées : le terminal construit un nouveau lot
        (nouveau `batch_id`) à partir de son plus petit numéro non `ACKED` (sync_protocol.md §6.2-6).
      security:
