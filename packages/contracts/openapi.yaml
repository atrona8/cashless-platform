    get:
      tags: [Bracelets]
      operationId: getTagKey
      x-process: public
      summary: Consulter une clé de bracelet
      description: |
        Clé, versions de sa clé de données (statut seulement) et travaux en cours. Rôle : `OPERATOR_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/KeyIndex'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Clé de bracelet.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagKeyDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
