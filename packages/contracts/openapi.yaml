          format: uuid
        device_id:
          type: string
          format: uuid
          description: Terminal PAIRED_TPE qui présentera l'intention ; absent = paiement par QR seulement.
        capture_method:
          type: string
          enum: [AUTOMATIC, MANUAL]
          default: AUTOMATIC
        external_reference:
          type: string
          maxLength: 128
        expires_in_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
        metadata:
