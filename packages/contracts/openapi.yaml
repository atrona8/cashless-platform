          description: Espèces rendues ; remettre `amount` au détenteur.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashDueRefundResult'
              example:
                transaction_id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                idempotency_key: C1-TPE:0042
                media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                amount: 7000
                currency: XOF
                resolved_anomaly_ids: [e2f3a4b5-c6d7-4e8f-9a0b-1c2d3e4f5a6b]
                approved_by: null
                cash_session_id: 0d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a
        '400':
