  # ---------------------------------------------------------------- payment_request QR
  /payment-requests:
    post:
      tags: [Demandes de paiement QR]
      operationId: createPaymentRequest
      x-process: public
      summary: Créer un QR commerçant (MERCHANT_QR)
      description: |
        Le terminal (souvent iOS, sans NFC) crée une `payment_request` `MERCHANT_QR` et affiche `qr_payload`.
        Le jeton (128 bits, aléatoire) n'est stocké que haché (`nonce_hash = sha256(token)`) ; durée de vie
        60 s par défaut. Toujours en ligne : jamais de QR hors ligne. Idempotency-Key = `serial:seq` ; la
        vente résultante reprend cette clé. `<serial>` doit être celui du terminal authentifié (sinon
        `422 VALIDATION_FAILED`, rien n'est écrit) ; chaque réponse finale est enregistrée dans le registre des
        numéros du terminal.
        Réponse non conservée : le jeton n'est rendu qu'une fois et n'est gardé nulle part (ni base, ni journaux, ni
        registre d'idempotence) ; un renvoi de la même clé reçoit `409` et le terminal crée une nouvelle demande.
        Session de vendeur : `vendor_session_id` est requis (session ouverte de ce terminal, non expirée, vendeur
        `ACTIVE` et non bloqué, sinon `409 VENDOR_SESSION_INVALID`) ; la vente qui suivra est attribuée au vendeur
        de cette session. Lignes contrôlées comme une vente (`CATALOG_POS` : obligatoires, avec `product_id` ;
        `KEYPAD_TPE` : interdites), sans écriture de vente : `422 SALE_LINES_INVALID`.
      security:
        - deviceMtls: []
          deviceToken: []
          deviceSignature: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceRequestId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  $ref: '#/components/schemas/Amount'
                currency:
                  $ref: '#/components/schemas/Currency'
                vendor_session_id:
                  type: string
                  format: uuid
                  description: |
                    Session de vendeur ouverte sur ce terminal (`openVendorSession`). Requise : absente, close,
                    expirée ou autre que la session ouverte du terminal → `409 VENDOR_SESSION_INVALID`.
                ttl_seconds:
                  type: integer
                  minimum: 15
                  maximum: 300
                  default: 60
                lines:
                  type: array
                  items:
                    $ref: '#/components/schemas/SaleLine'
            example:
              amount: 4000
              currency: XOF
              vendor_session_id: 2f3a4b5c-6d7e-4f80-9a1b-2c3d4e5f6a7b
              ttl_seconds: 60
      responses:
        '201':
          description: Demande créée (jeton rendu une seule fois ; réponse jamais rejouée).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestObject'
              example:
                payment_request_id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                direction: MERCHANT_QR
                status: PENDING
                amount: 4000
                currency: XOF
                merchant_name: Bar de l'organisateur
                qr_payload: https://pay.cashless.test/r/6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d#t=H4K9M2QX7TPB3NZ8
                expires_at: '2026-12-11T20:06:00Z'
                transaction_id: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /payment-requests/{payment_request_id}:
    get:
      tags: [Demandes de paiement QR]
      operationId: getPaymentRequest
      x-process: public
      summary: Consulter une demande de paiement
      description: |
        Le terminal l'interroge (ou long-polling `wait`) jusqu'à `CONFIRMED` / `EXPIRED` / `CANCELLED`.
        L'app client l'appelle après scan pour afficher montant et commerçant avant confirmation
        (ne renvoie jamais le jeton).
        Garde exclusive : si le certificat client (mTLS) ou l'en-tête `Signature` est présent, le chemin terminal
        complet est exigé (trois preuves), sans repli sur le jeton d'une personne ; seul le terminal d'origine de la
        demande la lit. Sinon (festivalier, `humanBearer`), le jeton lu dans le QR est exigé dans l'en-tête
        `X-Payment-Request-Token` (paramètre `PaymentRequestToken`), jamais dans la chaîne de requête ni dans le
        chemin ; jeton absent ou faux, ou demande inconnue : `404` (réponse identique).
      security:
        - deviceMtls: []
          deviceToken: []
          deviceSignature: []
        - humanBearer: []
      parameters:
        - $ref: '#/components/parameters/PaymentRequestId'
        - name: wait
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 25
            default: 0
        - $ref: '#/components/parameters/PaymentRequestToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SignatureInputIfDevice'
        - $ref: '#/components/parameters/SignatureIfDevice'
        - $ref: '#/components/parameters/ContentDigestIfDevice'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Demande.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestObject'
              example:
                payment_request_id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                direction: MERCHANT_QR
                status: CONFIRMED
                amount: 4000
                currency: XOF
                merchant_name: Bar de l'organisateur
                qr_payload: null
                expires_at: '2026-12-11T20:06:00Z'
                transaction_id: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /payment-requests/{payment_request_id}/pay:
    post:
      tags: [Demandes de paiement QR]
      operationId: payPaymentRequest
      x-process: public
      summary: Payer un QR commerçant depuis l'app client
      description: |
        Le client présente le jeton lu dans le QR (preuve de présence) et choisit son portefeuille.
        Vérifications : `sha256(token) = nonce_hash`, statut `PENDING`, non expiré, portefeuille du client,
        devise de l'événement. Écrit `PURCHASE` (source `ONLINE`, clé = celle de la création de la demande)
        et passe la demande `CONFIRMED` dans la même transaction SQL.
        Mission 5b : la vente est attribuée au vendeur de la session de la demande (`channel` `MERCHANT_QR`) ; le
        terminal de la demande doit être `ACTIVE` et sa session de vendeur encore ouverte et non expirée. Demande
        inconnue, payée, annulée ou expirée, ou mauvais jeton : `409 PAYMENT_REQUEST_NOT_PENDING` (`CL037`),
        réponse unique, sans dire lequel des cas (FR-020).
      security:
        - humanBearer: []
      parameters:
        - $ref: '#/components/parameters/PaymentRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, wallet_id]
              properties:
                token:
                  type: string
                  writeOnly: true
                  description: Jeton lu dans le QR ; jamais renvoyé, journalisé ni audité (seule l'empreinte est gardée).
                  minLength: 12
                  maxLength: 64
                wallet_id:
                  type: string
                  format: uuid
            example:
              token: H4K9M2QX7TPB3NZ8
              wallet_id: a1b2c3d4-e5f6-4789-8abc-def012345678
      responses:
        '200':
          description: Paiement effectué.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /payment-requests/{payment_request_id}/cancel:
    post:
      tags: [Demandes de paiement QR]
      operationId: cancelPaymentRequest
      x-process: public
      summary: Annuler une demande en attente
      description: |
        Passe la demande `PENDING` en `CANCELLED`. Une demande qui n'est plus `PENDING` est refusée
        (`409 PAYMENT_REQUEST_NOT_PENDING`, `CL037`, sans dire si elle est payée, annulée ou expirée).
        Garde exclusive : si le certificat client (mTLS) ou l'en-tête `Signature` est présent, le chemin terminal
        complet est exigé (trois preuves), sans repli ; seul le terminal d'origine annule, Idempotency-Key =
        `<serial>:<seq>` (`<serial>` = celui du terminal authentifié, sinon `422 VALIDATION_FAILED`). Sinon
        (festivalier, `humanBearer`), le jeton de la demande est exigé dans l'en-tête `X-Payment-Request-Token`
        (paramètre `PaymentRequestToken`), jamais dans la chaîne de requête ni dans le chemin ; jeton absent ou
        faux, ou demande inconnue : `404` (réponse identique).
      security:
        - deviceMtls: []
          deviceToken: []
          deviceSignature: []
        - humanBearer: []
      parameters:
        - $ref: '#/components/parameters/PaymentRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PaymentRequestToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SignatureInputIfDevice'
        - $ref: '#/components/parameters/SignatureIfDevice'
        - $ref: '#/components/parameters/ContentDigestIfDevice'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Demande annulée.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # ---------------------------------------------------------------- App client
  /customer-auth/otp:
    post:
      tags: [App client]
      operationId: requestCustomerOtp
      summary: Demander un code à usage unique (SMS / WhatsApp)
      description: |
        Protection contre les abus (valeurs par défaut, réglables par la plateforme) : au plus 3 envois par
        numéro sur 15 min glissantes, et 10 demandes par adresse IP et par heure. Au-delà : `429 OTP_RATE_LIMITED`
        avec `Retry-After`. Un numéro bloqué après trop d'essais faux (voir `exchangeCustomerOtp`) reçoit aussi
        `429 OTP_RATE_LIMITED` jusqu'à la fin du blocage. La réponse `202` reste identique que le numéro soit
        connu ou non.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, operator_code]
              properties:
                phone:
                  type: string
                  pattern: '^\+[1-9][0-9]{6,14}$'
                operator_code:
                  type: string
                  description: Code public du prestataire (l'app est multi-prestataires ; fixe le tenant).
                channel:
                  type: string
                  enum: [AUTO, SMS, WHATSAPP]
                  default: AUTO
                  description: |
                    ADR-66. `AUTO` (défaut) : WhatsApp d'abord ; si la livraison WhatsApp n'est pas confirmée dans
                    `otp_whatsapp_timeout_seconds` (défaut 10 s) ou si le numéro n'a pas WhatsApp, le même code part par
                    SMS (fournisseur principal, puis fournisseur de repli si la livraison n'est pas confirmée dans
                    `otp_sms_failover_seconds`, défaut 20 s). `SMS` : SMS directement (bouton « Recevoir par SMS »
                    de l'app, toujours proposé). `WHATSAPP` : WhatsApp seulement. Un seul code valide par défi,
                    quel que soit le nombre de canaux utilisés.
            example:
              phone: '+221770000001'
              operator_code: presta-sn
              channel: SMS
      responses:
        '202':
          description: Code envoyé (réponse identique que le numéro soit connu ou non).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [otp_request_id, expires_in]
                properties:
                  otp_request_id:
                    type: string
                  expires_in:
                    type: integer
              example:
                otp_request_id: otp_4mZ7
                expires_in: 300
