                type: object
                required: [currency, spendable, media_status, recent]
                description: |
                  Réduit à ce que rend `public_balance_lookup` (décision du porteur du 14/10/2026) : une route sans
                  authentification n'expose ni la répartition payé/offert, ni l'identifiant, la source ou le libellé
                  d'une écriture. Bracelet à plusieurs devises : la première par ordre alphabétique de devise.
                properties:
