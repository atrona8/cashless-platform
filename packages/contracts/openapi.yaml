      summary: Consulter le solde d'un bracelet anonyme par son code imprimé (sans compte)
      description: |
        Lecture seule, sans authentification (ADR-42). Le festivalier scanne le QR ou saisit le code imprimé
        sur un bracelet qui n'est rattaché à aucun compte. Renvoie le solde disponible et les 10 derniers
        mouvements. Refusé (réponse identique à un code inconnu, `NOT_FOUND`) si le bracelet est rattaché à
        un compte : il faut alors se connecter. Ne consomme pas le code (il reste valable pour le rattachement).
        Limites : 20 consultations par code et par heure, 60 par adresse IP et par heure (`429 RATE_LIMITED`).
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_code]
              properties:
                claim_code:
                  type: string
            example:
              claim_code: K7QM-4XH9RT
      responses:
        '200':
          description: Solde et derniers mouvements.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [currency, balance, recent]
                properties:
                  currency:
                    type: string
                  balance:
                    $ref: '#/components/schemas/Balance'
                  media_status:
                    $ref: '#/components/schemas/MediaStatus'
                  recent:
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/WalletMovement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
