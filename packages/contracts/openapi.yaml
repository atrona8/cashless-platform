  /refund-requests/{refund_request_id}/holder-decision:
    post:
      tags: [App client]
      operationId: decideRefundRequestAsHolder
      summary: Le titulaire confirme ou bloque un remboursement vers un autre numéro (ADR-76)
      description: |
        Lien reçu sur le numéro vérifié du titulaire, avec un code à usage unique. `CONFIRM` : la demande passe
        `REQUESTED`. `BLOCK` : elle passe `BLOCKED` (finale) et une alerte est levée pour le back-office.
        Seulement depuis `AWAITING_HOLDER` avant `hold_until` (`409 CONFLICT_STATE` sinon). Code faux ou expiré :
        `422 OTP_INVALID` ; protection contre les abus comme `requestCustomerOtp`.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefundRequestId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, otp_request_id, code]
              properties:
                decision:
                  type: string
                  enum: [CONFIRM, BLOCK]
                otp_request_id:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
            example:
              decision: BLOCK
              otp_request_id: otp_01J9ZQ
              code: '482913'
      responses:
        '200':
          description: Décision enregistrée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
