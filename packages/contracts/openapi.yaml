    MediaPersonalizationRequest:
      type: object
      required: [batch_id, token_hash, nfc_uid, originality_signature, signature_ok, station_public_key]
      additionalProperties: false
      properties:
        batch_id:
          type: string
          format: uuid
        token_hash:
          type: string
          description: SHA-256 de l'identité de 16 octets écrite dans la puce (64 chiffres hexadécimaux). L'identité elle-même n'est jamais envoyée.
          pattern: '^[0-9a-fA-F]{64}$'
