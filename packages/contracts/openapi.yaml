  /events/{event_id}/device-sync-status:
    get:
      tags: [Hors ligne]
      operationId: getEventDeviceSyncStatus
      summary: Remontée des terminaux d'un événement avant le règlement (back-office)
      description: |
        Renvoie, pour chaque terminal de l'événement, s'il est à jour (`event_device_sync_status`, ADR-73) et la
        date limite de synchronisation (`event_sync_deadline` : fin de l'événement, ou passage en `CLOSING`,
        plus `event.sync_deadline_hours`, 72 h par défaut). Avant cette date, le passage à `SETTLING` est refusé
        (`409 CLOSING_CONDITION_NOT_MET`, `CL019`) tant qu'un terminal n'est pas à jour ; après, il est permis et
        les opérations arrivées ensuite suivent la règle des synchronisations tardives (ADR-49).
        Raisons : `NOT_SEEN_SINCE_CLOSING`, `SEQ_GAP`, `BATCH_IN_PROGRESS`. Exclus : terminaux révoqués et
        téléphones personnels.
      security:
        - humanBearer: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: État de remontée.
          content:
            application/json:
              schema:
                type: object
                required: [sync_deadline, devices]
                properties:
                  sync_deadline:
                    type: [string, 'null']
                    format: date-time
                  devices:
                    type: array
                    items:
                      type: object
                      required: [device_id, serial, caught_up]
                      properties:
                        device_id: {type: string, format: uuid}
                        serial: {type: string}
                        caught_up: {type: boolean}
                        reason:
                          type: [string, 'null']
                          enum: [NOT_SEEN_SINCE_CLOSING, SEQ_GAP, BATCH_IN_PROGRESS, null]
              example:
                sync_deadline: '2026-07-14T02:00:00Z'
                devices:
                  - {device_id: 7c0e1a52-0000-4000-8000-000000000001, serial: TPE-BAR-01, caught_up: true, reason: null}
                  - {device_id: 7c0e1a52-0000-4000-8000-000000000002, serial: TPE-FOOD-02, caught_up: false, reason: NOT_SEEN_SINCE_CLOSING}
        '401':
          $ref: '#/components/responses/Unauthorized'

