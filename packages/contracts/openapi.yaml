      tags: [Webhooks sortants]
      x-release: V2
      operationId: onPaymentIntentAuthorized
      summary: payment_intent.authorized (sortant, capture MANUAL)
      security: []
      parameters:
        - $ref: '#/components/parameters/OutboundSignature'
      requestBody:
