        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundEvent'
      responses:
        '200':
          description: Reçu.
  paymentIntentReversed:
    post:
      tags: [Webhooks sortants]
      x-release: V2
      operationId: onPaymentIntentReversed
      summary: payment_intent.reversed (sortant)
      security: []
      parameters:
        - $ref: '#/components/parameters/OutboundSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundEvent'
      responses:
        '200':
          description: Reçu.

  # ---------------------------------------------------------------- Personnes
  /operators/{operator_id}/users:
    get:
      tags: [Personnes]
      operationId: listUsers
      summary: Lister les personnes du personnel d'un prestataire
      description: |
        Personnes du prestataire du chemin, triées par date de création. Rôles : `PLATFORM_ADMIN`,
        `OPERATOR_ADMIN` du prestataire, `ORGANIZER_ADMIN` (limité aux personnes qui ont une attribution sur son
        organisateur ou ses événements, et à celles qu'il a créées).
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Page de personnes.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffUser'
                  next_cursor:
                    type:
                      - string
                      - 'null'
                  has_more:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Personnes]
      operationId: createUser
      summary: Créer une personne du personnel
      description: |
        Enregistre une personne connue du serveur d'identité (émetteur et sujet du jeton) dans le prestataire du
        chemin, sans rôle ; les rôles sont donnés ensuite par `grantRole`. (Émetteur, sujet) déjà connu :
        `409 CONFLICT_STATE`. Journalisé (`USER_CREATED`). Rôles : comme `listUsers`.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreate'
      responses:
        '201':
          description: Personne créée.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
            Location:
              description: '`/v1/operators/{operator_id}/users/{user_id}`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /operators/{operator_id}/users/{user_id}:
    get:
      tags: [Personnes]
      operationId: getUser
      summary: Consulter une personne et ses attributions actives
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Personne.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /operators/{operator_id}/users/{user_id}/disable:
    post:
      tags: [Personnes]
      operationId: disableUser
      summary: Désactiver une personne
      description: |
        Définitif : la personne ne peut plus s'authentifier (`401` dès la requête suivante) ; ses attributions sont
        conservées pour l'historique. Désactiver le dernier `PLATFORM_ADMIN` : `403 FORBIDDEN`. Déjà désactivée :
        `409 CONFLICT_STATE`. Journalisé (`USER_DISABLED`). Rôles : `PLATFORM_ADMIN`, `OPERATOR_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Personne désactivée.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /operators/{operator_id}/users/{user_id}/role-assignments:
    post:
      tags: [Personnes]
      operationId: grantRole
      summary: Attribuer un rôle sur une portée
      description: |
        Qui peut attribuer quoi : `PLATFORM_ADMIN` → `OPERATOR_ADMIN` (prestataire) ; `OPERATOR_ADMIN` →
        `OPERATOR_ADMIN`, `ORGANIZER_ADMIN`, `SUPERVISOR`, `CASHIER`, `MERCHANT_ADMIN` dans son prestataire ;
        `ORGANIZER_ADMIN` → `SUPERVISOR`, `CASHIER` sur son organisateur ou ses événements, `MERCHANT_ADMIN` sur les
        commerçants qui participent à ses événements. Jamais à soi-même (`403`). Droit insuffisant : `403`. Rôle et
        portée incompatibles, `VENDOR` ou `CUSTOMER` : `422 VALIDATION_FAILED`. Attribution active identique :
        `409 CONFLICT_STATE`. `PLATFORM_ADMIN` se donne par `createPlatformAdmin`. Journalisé (`ROLE_GRANTED`).
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleGrant'
      responses:
        '201':
          description: Attribution créée.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
            Location:
              description: '`/v1/operators/{operator_id}/users/{user_id}`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /operators/{operator_id}/role-assignments/{assignment_id}/revoke:
    post:
      tags: [Personnes]
      operationId: revokeRole
      summary: Retirer une attribution de rôle
      description: |
        Même droit que pour attribuer ce rôle sur cette portée ; jamais sa propre attribution (`403`). Déjà retirée :
        `409 CONFLICT_STATE`. Retirer le dernier `PLATFORM_ADMIN` : `403 FORBIDDEN`. Journalisé (`ROLE_REVOKED`).
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Attribution retirée.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /platform-admins:
    post:
      tags: [Personnes]
      operationId: createPlatformAdmin
      summary: Créer un administrateur de la plateforme
      description: |
        Crée une personne de la plateforme (sans prestataire) et son attribution `PLATFORM_ADMIN`. Réservé à un
        `PLATFORM_ADMIN`, vérifié en base sur l'attribution active de l'appelant. Le premier administrateur est
        créé par la commande d'amorçage (`bootstrap-admin`), hors API. (Émetteur, sujet) déjà connu :
        `409 CONFLICT_STATE`. Journalisé (`PLATFORM_ADMIN_CREATED`). Sans `Idempotency-Key` : une personne de la
        plateforme n'a pas de prestataire, auquel toute clé d'idempotence est rattachée ; un rejeu est sans effet,
        puisque (émetteur, sujet) est unique (`409 CONFLICT_STATE`).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreate'
      responses:
        '201':
          description: Administrateur de la plateforme créé.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    humanBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT OIDC (staff, back-office, client). Claims `sub`, `operator_id`, `roles`.
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'appareil (15 min), claims `sub = device_id`, `operator_id`, `serial`, `event_id`, `cnf`.
    deviceMtls:
      type: mutualTLS
      description: Certificat client X.509 délivré à l'enrôlement (clé Keystore non exportable).
    edgeMtls:
      type: mutualTLS
      description: Certificat client de la passerelle locale (`edge_gateway.public_key`).
    posClient:
      type: oauth2
      description: Client credentials des POS tiers (un client par intégration et par prestataire).
      flows:
        clientCredentials:
          tokenUrl: https://api.cashless.test/v1/oauth/token
          scopes:
            payment_intents:read: Lire les intentions de paiement
            payment_intents:write: Créer, capturer, annuler des intentions
            webhooks:read: Lire les abonnements webhooks
            webhooks:write: Gérer les abonnements webhooks
    pspHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        `t=<unix>,v1=<hex HMAC-SHA256(secret_psp, t + "." + corps_brut)>` (Wave : en-tête `Wave-Signature`,
        même format). Tolérance d'horodatage 300 s ; secret par configuration PSP (`psp_config_id` de l'URL),
        rotation avec deux secrets valides simultanément.

  headers:
    X-Request-Id:
      description: Identifiant de corrélation (repris de la requête, sinon généré).
      schema:
        type: string
        format: uuid
    Idempotency-Replayed:
      description: '`true` si la réponse est celle mémorisée pour une requête antérieure de même clé.'
      schema:
        type: boolean
    ETag:
      description: Version de la ressource.
      schema:
        type: string
    Retry-After:
      description: Secondes avant de réessayer.
      schema:
        type: integer

  parameters:
    ApprovalToken:
      name: X-Approval-Token
      in: header
      required: false
      description: |
        Jeton d'approbation sur place (guichet, ADR-74, SPECIFICATION §3.2). La seconde personne saisit son code
        personnel sur le même terminal ; le serveur d'identité (OIDC, authentification renforcée) délivre un JWT
        signé, valable 5 min, à usage unique (`jti` mémorisé jusqu'à l'expiration), lié à l'action :
        `sub` = valideur, `act` = operationId, `act_hash` = SHA-256 (hex) de la requête canonique
        (méthode, chemin, corps en JSON canonique JCS, RFC 8785 ; le jeton n'en fait pas partie).
        Le serveur vérifie signature, expiration, `jti` non réutilisé, `act` et `act_hash`, `sub` ≠ appelant et
        rôle du valideur ; le valideur transmis à la base est le `sub`. Obligatoire seulement quand l'opération
        l'exige (au-delà de `event.cash_refund_single_max`) : absent → `403 APPROVAL_REQUIRED` ; refusé
        (invalide, expiré, déjà utilisé, autre action, même personne) → `403 APPROVAL_INVALID`. Envoyé sans
        nécessité, il est vérifié puis consommé de la même façon.
      schema:
        type: string
        minLength: 16
        maxLength: 4096
    ApprovalRequestId:
      name: approval_request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperatorId:
      name: operator_id
      in: path
      required: true
      description: Prestataire visé ; celui de la personne, sauf pour un `PLATFORM_ADMIN` (sinon `404`).
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clé d'idempotence. Terminaux : `<device_serial>:<seq>` (seq ≥ 1, au moins 4 chiffres). Autres : UUID.
        Conservée au moins 30 jours (terminaux : pour toujours, c'est la clé du grand livre).
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      examples:
        terminal:
          value: TPE-FOOD-01:0001
        app:
          value: 5f0c7a8e-1d2b-4c3a-9e8f-7a6b5c4d3e2f
    AuthorityEpoch:
      name: X-Authority-Epoch
      in: header
      required: false
      description: |
        Époque d'autorité de débit connue du terminal. DOIT être envoyée sur toute opération de débit.
        Si elle diffère de l'époque courante du serveur qui répond, celui-ci refuse le débit
        (`409 STALE_AUTHORITY_EPOCH` ou `DEBIT_AUTHORITY_EDGE`) et renvoie l'époque courante.
      schema:
        type: integer
        format: int64
        minimum: 0
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identifiant de corrélation fourni par le client.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Curseur opaque renvoyé par la page précédente (`next_cursor`).
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WalletId:
      name: wallet_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LedgerId:
      name: ledger_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentIntentId:
      name: payment_intent_id
      in: path
      required: true
      schema:
        type: string
    PaymentRequestId:
      name: payment_request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefundRequestId:
      name: refund_request_id
      in: path
      required: true
      schema:
        type: string
    CashSessionId:
      name: cash_session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KycVerificationId:
      name: kyc_verification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HandoverId:
      name: handover_id
      in: path
      required: true
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Langue des messages lisibles (`title`, `detail` des erreurs, libellés). Valeurs `fr` ou `en` ;
        défaut `fr` (en-tête absent ou sans langue prise en charge). Sans effet sur les codes stables.
      schema:
        type: string
        default: fr
        examples: [fr, en, 'en;q=0.9, fr;q=0.8']
    OutboundSignature:
      name: X-Cashless-Signature
      in: header
      required: true
      schema:
        type: string
        example: t=1765569672,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd

  responses:
    BadRequest:
      description: Requête invalide (`VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`…).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/VALIDATION_FAILED
            title: Requête invalide
            status: 400
            code: VALIDATION_FAILED
            detail: 'amount : doit être un entier strictement positif'
            instance: /v1/payments
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
            errors:
              - pointer: /amount
                message: doit être un entier strictement positif
    Unauthorized:
      description: Authentification absente ou invalide (`UNAUTHENTICATED`, `WEBHOOK_SIGNATURE_INVALID`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/UNAUTHENTICATED
            title: Authentification requise
            status: 401
            code: UNAUTHENTICATED
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
    Forbidden:
      description: |
        Droits insuffisants ou appareil inactif (`FORBIDDEN`, `DEVICE_SUSPENDED`, `OFFLINE_NOT_ALLOWED`…), ou
        jeton d'approbation sur place absent (`APPROVAL_REQUIRED`) ou refusé (`APPROVAL_INVALID`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/DEVICE_SUSPENDED
            title: Terminal suspendu
            status: 403
            code: DEVICE_SUSPENDED
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
    NotFound:
      description: Objet introuvable (ou appartenant à un autre prestataire — réponse neutre).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/NOT_FOUND
            title: Objet introuvable
            status: 404
            code: NOT_FOUND
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
    Conflict:
      description: |
        Conflit d'état ou d'idempotence (`IDEMPOTENCY_KEY_REUSED`, `DEBIT_AUTHORITY_EDGE`,
        `DEBIT_AUTHORITY_MOVING`, `HANDOVER_INVALID_STATE`, `CHAIN_BROKEN`, `ALREADY_REVERSED`,
        `MEDIA_STATE_INVALID`, `SEQ_OUT_OF_RANGE`, `TAP_UNUSABLE`, `APPROVAL_INVALID` pour une demande
        d'approbation expirée ou déjà décidée, `LATE_CLAIM_INVALID` pour une réclamation tardive hors bornes…).
        `DEBIT_AUTHORITY_EDGE` et `DEBIT_AUTHORITY_MOVING` ne sont pas des refus définitifs : rejouer la même
        requête, avec la même clé, vers l'autorité indiquée ou suivante (sync_protocol.md §5.1, §9).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            edge:
              summary: Autorité de débit détenue par la passerelle
              value:
                type: https://docs.cashless.test/problems/DEBIT_AUTHORITY_EDGE
                title: Débit refusé par le central
                status: 409
                code: DEBIT_AUTHORITY_EDGE
                detail: Les débits de ce grand livre sont autorisés par la passerelle locale.
                request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
                retryable: true
                edge_base_url: https://edge.local:8443/v1
                authority_epoch: 5
            reused:
              summary: Clé rejouée avec un contenu différent
              value:
                type: https://docs.cashless.test/problems/IDEMPOTENCY_KEY_REUSED
                title: Clé d'idempotence déjà utilisée
                status: 409
                code: IDEMPOTENCY_KEY_REUSED
                detail: La clé TPE-BAR-01:0003 a déjà servi pour un autre contenu.
                request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
                retryable: false
    ApprovalRequestAccepted:
      description: |
        Opération à deux personnes du back-office (ADR-74) : demande d'approbation créée (`PENDING`), rien n'est
        encore exécuté. Une seconde personne l'approuve (`approveApprovalRequest`) ou la refuse
        (`rejectApprovalRequest`) avant `expires_at` (24 h). Un rejeu avec la même clé d'idempotence renvoie la
        même demande.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Idempotency-Replayed:
          $ref: '#/components/headers/Idempotency-Replayed'
        Location:
          description: '`/v1/approval-requests/{approval_request_id}`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalRequest'
          example:
            approval_request_id: 4b5c6d7e-8f90-4a1b-9c2d-3e4f5a6b7c8d
            action: WAIVE_SEQ_GAP
            target_id: 7c0e1a52-0000-4000-8000-000000000002
            payload:
              device_id: 7c0e1a52-0000-4000-8000-000000000002
              seq: 87
              reason: Terminal réinitialisé en usine après chute, journal local perdu.
            requested_by: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            requested_at: '2026-12-13T09:00:00Z'
            expires_at: '2026-12-14T09:00:00Z'
            status: PENDING
            decided_by: null
            decided_at: null
            decision_note: null
            executed_tx_id: null
            result: null
            failure_code: null
            failure_reason: null
    Unprocessable:
      description: Règle métier non satisfaite (`INSUFFICIENT_FUNDS`, `MEDIA_BLOCKED`, `WALLET_LIMIT_EXCEEDED`…).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/INSUFFICIENT_FUNDS
            title: Solde insuffisant
            status: 422
            code: INSUFFICIENT_FUNDS
            detail: Solde disponible 3000 XOF, montant demandé 6000 XOF.
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
            available_balance: 3000
            currency: XOF
    PayloadTooLarge:
      description: Lot trop volumineux (`BATCH_TOO_LARGE`) ; le découper.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Trop de requêtes (`RATE_LIMITED`, `OTP_RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Service ou PSP indisponible (`SERVICE_UNAVAILABLE`, `PSP_UNAVAILABLE`) ; réessayer avec la MÊME clé.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------------------ Communs
    Problem:
      type: object
      description: RFC 9457 Problem Details, avec extensions stables.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
          description: '`https://docs.cashless.test/problems/<code>`'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
          description: '`true` si réessayer à l''identique (même clé d''idempotence) peut réussir.'
        errors:
          type: array
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: JSON Pointer (RFC 6901) vers le champ fautif.
              message:
                type: string
      additionalProperties: true
    ProblemCode:
      type: string
      description: |
        Codes métier stables (ne jamais renommer ; en ajouter est une évolution compatible). La traduction
        SQLSTATE → code suit SPECIFICATION §5.7 (jamais le texte du message SQL). Sens de chaque code :
        - `VALIDATION_FAILED` (400, ou 422 pour une valeur bien formée mais non prise en charge) : requête ou donnée invalide, y compris tout refus `CL001` de la base.
        - `UNAUTHENTICATED` (401) : jeton ou certificat absent, expiré ou invalide.
        - `FORBIDDEN` (403) : rôle insuffisant (y compris le valideur d'une demande d'approbation), ou refus de la
          base faute de seconde personne distincte de l'auteur (`23514`).
        - `APPROVAL_REQUIRED` (403) : opération de guichet qui exige une seconde personne, sans en-tête
          `X-Approval-Token` (ADR-74).
        - `APPROVAL_INVALID` : seconde validation refusée (ADR-74). Règle : `403` pour un jeton d'approbation sur
          place (invalide, expiré, déjà utilisé, d'une autre action ou de la même personne que l'appelant, rôle
          du valideur insuffisant) ; `409` (`CL023`) pour une demande d'approbation du back-office (expirée, déjà
          décidée, ou décidée par son auteur). 403 = la preuve jointe à la requête ne vaut rien ; 409 = l'état
          de la demande enregistrée ne permet plus la décision.
        - `NOT_FOUND` (404) : objet inexistant ou d'un autre prestataire (réponse neutre).
        - `RATE_LIMITED` (429) : trop de requêtes ou d'essais ; voir `Retry-After`.
        - `INTERNAL_ERROR` (500) : erreur interne ; réessayer avec la même clé d'idempotence.
        - `SERVICE_UNAVAILABLE` (503) : service momentanément indisponible ; réessayer avec la même clé.
        - `IDEMPOTENCY_KEY_REQUIRED` (400) : écriture sans en-tête `Idempotency-Key`.
        - `IDEMPOTENCY_KEY_REUSED` (409, `CL002`) : même clé, contenu différent.
        - `IDEMPOTENCY_KEY_IN_PROGRESS` (409) : requête concurrente avec la même clé encore en cours.
        - `ENROLLMENT_CODE_INVALID` (422) : code d'enrôlement inconnu ou déjà utilisé.
        - `ENROLLMENT_CODE_EXPIRED` (422) : code d'enrôlement expiré.
        - `ATTESTATION_FAILED` (422) : attestation de clé Android non conforme (clé hors du matériel sécurisé,
          bootloader déverrouillé, application non signée ou modifiée). Pas de MDM (ADR-69).
        - `REFRESH_TOKEN_INVALID` (401) : jeton de rafraîchissement inconnu, déjà consommé (la famille est
          révoquée) ou preuve de possession invalide.
        - `DEVICE_SUSPENDED` (403) : terminal suspendu.
        - `DEVICE_REVOKED` (403) : terminal révoqué (SQLSTATE `42501`).
        - `DEVICE_NOT_ASSIGNED` (409) : terminal sans affectation (événement, point de vente) pour cette action.
        - `DEVICE_MODE_NOT_ALLOWED` (422) : mode d'application non permis ; en V1, tout usage de `PAIRED_TPE`
          ou de `payment_intent_id` (V2, ADR-43).
        - `CLOCK_SKEW_TOO_LARGE` (400) : horloge du terminal hors de la tolérance (`clock_tolerance_seconds`).
        - `CURRENCY_MISMATCH` (422) : devise différente de celle de l'événement.
        - `AMOUNT_OUT_OF_RANGE` (422) : montant hors des bornes permises pour l'opération.
        - `INSUFFICIENT_FUNDS` (422, `CL007`) : solde disponible insuffisant (refus en ligne définitif).
        - `WALLET_BLOCKED` (422) : portefeuille bloqué ou clos.
        - `WALLET_LIMIT_EXCEEDED` (422, `CL008`) : plafond de solde dépassé.
        - `MONTHLY_TOPUP_LIMIT_EXCEEDED` (422, `CL009`) : plafond mensuel de recharge dépassé.
        - `MEDIA_UNKNOWN` (404) : UID ou bracelet inconnu (chemin en ligne ; dans un lot :
          `MEDIA_NOT_IN_SNAPSHOT`).
        - `MEDIA_BLOCKED` (422) : bracelet `SUSPENDED` ou `BLACKLISTED`.
        - `MEDIA_NOT_ACTIVATED` (422) : bracelet `PERSONALIZED` ou `ISSUED`, pas encore rattaché.
        - `MEDIA_RETIRED` (422) : bracelet `RETIRED` ou `DESTROYED`.
        - `MEDIA_REPLACED` (422) : bracelet remplacé par un autre.
        - `MEDIA_RELEASED` (422) : bracelet restitué.
        - `MEDIA_UID_MISMATCH` (422) : identité lue incohérente avec l'UID enregistré.
        - `MEDIA_CLONE_SUSPECTED` (422) : compteur déjà vu ou identité retirée ; bracelet mis en liste noire.
        - `MEDIA_SIGNATURE_MISMATCH` (422) : signature d'originalité différente de celle de la personnalisation
          (résultat `SIGNATURE_MISMATCH`) ; bracelet mis en liste noire (ADR-59).
        - `MEDIA_SIGNATURE_MISSING` (422) : signature d'originalité absente alors que la puce en a une enregistrée
          (résultat `SIGNATURE_MISSING`) ; relire le bracelet. Pas de liste noire.
        - `MEDIA_STATE_INVALID` (409, `CL020`) : bracelet ou lot dans un état qui ne permet pas l'action
          (remplacement, restitution avec espèces dues, rendu d'espèces sans somme due, lot, caution).
        - `MEDIA_WRONG_EVENT` (422) : bracelet d'un lot d'un autre événement.
        - `MEDIA_BATCH_INACTIVE` (422) : lot du bracelet non `ACTIVE`.
        - `MEDIA_CLAIM_INVALID` (422) : code de rattachement inconnu ou déjà utilisé (réponse identique).
        - `TAP_EXPIRED` (422) : `tap_id` au-delà de `tap_replay_window_seconds` (défaut 120 s), contrôle de l'API
          avant écriture ; relire le bracelet.
        - `TAP_ALREADY_USED` (409) : `tap_id` déjà consommé par une autre opération, ou présenté par un autre
          terminal (contrôle de l'API avant écriture).
        - `TAP_UNUSABLE` (409, `CL022`) : refus de `consume_tap` : passage déjà utilisé par une autre écriture, ou
          écriture en ligne plus de `tap_replay_window_seconds` après la lecture ; relire le bracelet.
        - `ACTIVATION_MODE_NOT_ALLOWED` (422) : mode d'activation absent de `event.activation_modes`.
        - `ACCOUNT_REQUIRED` (422) : `identity_mode = ACCOUNT_REQUIRED` et aucun compte client fourni.
        - `DEPOSIT_OUTSTANDING` (409) : caution encore `HELD` ; la rendre avant la restitution.
        - `BALANCE_OUTSTANDING` (409) : portefeuille non soldé ; restitution impossible.
        - `DEPOSIT_PAYMENT_REQUIRED` (422) : caution `SEPARATE` sans moyen de paiement (`deposit_payment`).
        - `EVENT_CLOSING` (409, `CL004`) : grand livre en clôture ; recharges et ventes en ligne refusées.
        - `LEDGER_LOCKED` (409, `CL003`) : grand livre verrouillé.
        - `PERIOD_CLOSED` (409, `CL005`) : date dans une période close.
        - `DEBIT_AUTHORITY_EDGE` (409, `CL006`) : débits autorisés par la passerelle ; rejouer la même requête
          (même clé) vers `edge_base_url`. Pas un refus.
        - `DEBIT_AUTHORITY_MOVING` (409) : bascule d'autorité en cours (passerelle en `RELEASING`). Pas un
          refus définitif : garder la même clé, passer hors ligne si la politique le permet, puis rejouer vers
          la nouvelle autorité (sync_protocol.md §5.1, §9.3).
        - `STALE_AUTHORITY_EPOCH` (409, `CL015`) : époque d'autorité périmée ; l'émetteur cesse de débiter.
        - `HANDOVER_INVALID_STATE` (409, `CL013`) : action de bascule impossible dans l'état du handover.
        - `EDGE_NOT_CAUGHT_UP` (409, `CL014`) : passerelle en retard (filigrane non atteint, `edge_seq` manquants).
        - `REVERSAL_NOT_ALLOWED` (422) : transaction non annulable (type, auteur ou terminal différent).
        - `REVERSAL_WINDOW_EXPIRED` (409) : délai d'annulation dépassé.
        - `ALREADY_REVERSED` (409) : transaction déjà annulée.
        - `OFFLINE_NOT_ALLOWED` (403) : hors ligne désactivé pour ce terminal (seul nom de ce refus).
        - `SNAPSHOT_VERSION_UNKNOWN` (409) : version de snapshot inconnue pour ce grand livre ; demander un FULL.
        - `BATCH_IN_PROGRESS` (409, `CL010`) : un lot est déjà en cours pour ce terminal ; attendre son résultat.
        - `BATCH_TOO_LARGE` (413, `CL011`) : lot vide ou de plus de 500 opérations ou 1 Mio.
        - `BATCH_SIGNATURE_INVALID` (400) : signature de l'en-tête du lot invalide ; lot non traité.
        - `CHAIN_BROKEN` (409, `CL017`) : chaîne de hachage rompue (terminal ou passerelle) ; alerte, examen manuel.
        - `SEQ_OUT_OF_ORDER` (400 pour un lot de terminal non continu ; 409, `CL016`, pour un `edge_seq`
          qui n'est pas le suivant attendu).
        - `SEQ_GAP_NOT_FOUND` (409, `CL012`) : le numéro à lever n'est pas un trou connu.
        - `SEQ_OUT_OF_RANGE` (409, `CL021`) : numéro ou lot au-delà de `contiguous_acked_seq + 10 000`
          (`max_seq_jump`) ; refusé sans anomalie.
        - `PAYMENT_REQUEST_EXPIRED` (409) : demande de paiement QR expirée.
        - `PAYMENT_REQUEST_NOT_PENDING` (409) : demande de paiement QR déjà payée, annulée ou expirée.
        - `QR_TOKEN_INVALID` (422) : jeton de QR client inconnu, expiré ou déjà utilisé.
        - `PAYMENT_INTENT_INVALID_STATE` (409, V2) : intention dans un état qui ne permet pas l'action.
        - `PAYMENT_INTENT_EXPIRED` (409, V2) : intention expirée.
        - `PSP_UNAVAILABLE` (503) : PSP injoignable ; réessayer avec la même clé.
        - `PSP_NOT_CONFIGURED` (409) : aucune configuration PSP valide pour ce moyen et cet événement (S26b ou défaut de l'organisateur, titulaire = détenteur des fonds, ADR-72).
        - `PSP_REJECTED` (422) : paiement refusé par le PSP.
        - `WEBHOOK_SIGNATURE_INVALID` (401) : signature HMAC du webhook entrant invalide.
        - `WEBHOOK_TIMESTAMP_OUT_OF_TOLERANCE` (401) : horodatage du webhook hors tolérance (rejeu suspect).
        - `REFUND_NOT_ALLOWED` (422) : remboursement impossible (solde payé nul, destination non vérifiée…).
        - `REFUND_WINDOW_CLOSED` (422) : fenêtre de remboursement close.
        - `REFUND_ALREADY_OPEN` (409) : une demande de remboursement est déjà ouverte pour ce portefeuille.
        - `OTP_INVALID` (422) : code à usage unique faux, expiré ou déjà utilisé.
        - `CARD_DAILY_LIMIT` (422) : plafond de recharge par carte et par jour atteint (ADR-77).
        - `OTP_RATE_LIMITED` (429) : trop de demandes ou d'essais de code à usage unique (défauts : 3 envois par
          numéro sur 15 min, 10 demandes par IP et par heure, 5 essais par code puis blocage du numéro 30 min).
        - `CONFLICT_STATE` (409) : objet dans un état qui ne permet pas l'action (ex. demande de
          remboursement qui n'est pas `REQUESTED` à l'approbation).
        - `EVENT_TRANSITION_INVALID` (409, `CL018`) : passage de statut d'événement non prévu (ADR-51).
        - `CLOSING_CONDITION_NOT_MET` (409, `CL019`) : condition de clôture calculable non remplie ; le détail nomme la condition (ADR-51).
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_PROGRESS
        - ENROLLMENT_CODE_INVALID
        - ENROLLMENT_CODE_EXPIRED
        - ATTESTATION_FAILED
        - REFRESH_TOKEN_INVALID
        - DEVICE_SUSPENDED
        - DEVICE_REVOKED
        - DEVICE_NOT_ASSIGNED
        - DEVICE_MODE_NOT_ALLOWED
        - CLOCK_SKEW_TOO_LARGE
        - CURRENCY_MISMATCH
        - AMOUNT_OUT_OF_RANGE
        - INSUFFICIENT_FUNDS
        - WALLET_BLOCKED
        - WALLET_LIMIT_EXCEEDED
        - MONTHLY_TOPUP_LIMIT_EXCEEDED
        - MEDIA_UNKNOWN
        - MEDIA_BLOCKED
        - MEDIA_NOT_ACTIVATED
        - MEDIA_RETIRED
        - MEDIA_REPLACED
        - MEDIA_RELEASED
        - MEDIA_UID_MISMATCH
        - MEDIA_CLONE_SUSPECTED
        - MEDIA_SIGNATURE_MISMATCH
        - MEDIA_SIGNATURE_MISSING
        - MEDIA_STATE_INVALID
        - MEDIA_WRONG_EVENT
        - MEDIA_BATCH_INACTIVE
        - MEDIA_CLAIM_INVALID
        - TAP_EXPIRED
        - TAP_ALREADY_USED
        - TAP_UNUSABLE
        - ACTIVATION_MODE_NOT_ALLOWED
        - ACCOUNT_REQUIRED
        - DEPOSIT_OUTSTANDING
        - BALANCE_OUTSTANDING
        - DEPOSIT_PAYMENT_REQUIRED
        - EVENT_CLOSING
        - LEDGER_LOCKED
        - PERIOD_CLOSED
        - DEBIT_AUTHORITY_EDGE
        - DEBIT_AUTHORITY_MOVING
        - STALE_AUTHORITY_EPOCH
        - HANDOVER_INVALID_STATE
        - EDGE_NOT_CAUGHT_UP
        - REVERSAL_NOT_ALLOWED
        - REVERSAL_WINDOW_EXPIRED
        - ALREADY_REVERSED
        - OFFLINE_NOT_ALLOWED
        - SNAPSHOT_VERSION_UNKNOWN
        - BATCH_IN_PROGRESS
        - BATCH_TOO_LARGE
        - BATCH_SIGNATURE_INVALID
        - CHAIN_BROKEN
        - SEQ_OUT_OF_ORDER
        - SEQ_GAP_NOT_FOUND
        - SEQ_OUT_OF_RANGE
        - PAYMENT_REQUEST_EXPIRED
        - PAYMENT_REQUEST_NOT_PENDING
        - QR_TOKEN_INVALID
        - PAYMENT_INTENT_INVALID_STATE
        - PAYMENT_INTENT_EXPIRED
        - PSP_UNAVAILABLE
        - PSP_NOT_CONFIGURED
        - PSP_REJECTED
        - WEBHOOK_SIGNATURE_INVALID
        - WEBHOOK_TIMESTAMP_OUT_OF_TOLERANCE
        - REFUND_NOT_ALLOWED
        - REFUND_WINDOW_CLOSED
        - REFUND_ALREADY_OPEN
        - OTP_INVALID
        - OTP_RATE_LIMITED
        - CONFLICT_STATE
        - EVENT_TRANSITION_INVALID
        - CLOSING_CONDITION_NOT_MET
        - APPROVAL_REQUIRED
        - APPROVAL_INVALID
        - LATE_CLAIM_INVALID
        - CARD_DAILY_LIMIT
    PageMeta:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
    Amount:
      type: integer
      format: int64
      minimum: 1
      description: Montant strictement positif en unités mineures de la devise.
    SignedAmount:
      type: integer
      format: int64
      description: Montant signé en unités mineures.
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Code ISO 4217 (devise unique de l'événement).
      examples: [XOF]
    Hex32:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: 32 octets en hexadécimal minuscule.
    NfcUid:
      type: string
      pattern: '^[0-9a-f]{14}$'
      description: UID constructeur 7 octets en hexadécimal minuscule.
    Timestamp:
      type: string
      format: date-time
    TransactionType:
      type: string
      description: Liste fermée des types du grand livre (contrainte CHECK de journal_transaction.type ; voir SPECIFICATION.md).
      enum: [TOPUP, TOPUP_CASH, PROMO_CREDIT, PROMO_EXPIRY, ACTIVATION_FEE, DEPOSIT_TAKEN, DEPOSIT_REFUNDED,
             DEPOSIT_FORFEITED, PURCHASE, REVERSAL, PITCH_FEE, OPERATOR_FEE, PLATFORM_FEE, ANOMALY_RESOLUTION,
             CASH_CLOSE, CASH_DEPOSIT, PSP_SETTLEMENT, CHARGEBACK, WALLET_REFUND, BREAKAGE, PAYOUT_INITIATED,
             PAYOUT_CONFIRMED, PAYOUT_FAILED, ADJUSTMENT, MERCHANT_DEBT_TRANSFER, BREAKAGE_REVERSAL]
    TransactionSource:
      type: string
      enum: [ONLINE, OFFLINE_SYNC, EDGE_SYNC, PSP_WEBHOOK, BATCH, BACKOFFICE]
    Balance:
      type: object
      required: [spendable, paid, promo]
      properties:
        spendable:
          type: integer
          format: int64
          description: Solde disponible = paid + promo (wallet_spendable).
        paid:
          type: integer
          format: int64
          description: Crédits payés (WALLET_PAID), remboursables.
        promo:
          type: integer
          format: int64
          description: Crédits offerts (WALLET_PROMO), non remboursables.

    # ------------------------------------------------------------ Terminaux
    DeviceAppMode:
      type: string
      description: |
        Mode d'application du terminal. `PAIRED_TPE` (TPE associé à une caisse tierce) est **V2 (ADR-43)** :
        valeur conservée pour la compatibilité future, mais toute création de code d'enrôlement ou tout
        enrôlement avec cette valeur est refusé en V1 (`422 DEVICE_MODE_NOT_ALLOWED`) ; la base ne l'accepte pas.
      enum: [CATALOG_POS, KEYPAD_TPE, TOPUP_DESK, PAIRED_TPE]
    DeviceKind:
      type: string
      enum: [POS, TOPUP]
    DeviceStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, REVOKED]
    EnrollmentCodeCreate:
      type: object
      required: [app_mode, kind]
      properties:
        event_id:
          type: string
          format: uuid
        pos_id:
          type: string
          format: uuid
        station_name:
          type: string
        app_mode:
          $ref: '#/components/schemas/DeviceAppMode'
        kind:
          $ref: '#/components/schemas/DeviceKind'
        provided_by:
          type: string
          enum: [PLATFORM, OPERATOR, ORGANIZER, MERCHANT]
          default: OPERATOR
          description: Qui fournit le terminal ; désigne qui porte la perte d'une opération non conforme (ADR-58).
        expires_in_seconds:
          type: integer
          minimum: 300
          maximum: 604800
          default: 86400
    EnrollmentCode:
      type: object
      required: [enrollment_code_id, code, expires_at, app_mode]
      properties:
        enrollment_code_id:
          type: string
          format: uuid
        code:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        app_mode:
          $ref: '#/components/schemas/DeviceAppMode'
    DeviceEnrollmentRequest:
      type: object
      required: [enrollment_code, serial, os, app_version, signing_public_key, agreement_public_key, key_attestation_chain]
      properties:
        enrollment_code:
          type: string
        serial:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,64}$'
          description: Numéro de série logique du terminal (préfixe des clés d'idempotence).
        os:
          type: string
          enum: [ANDROID, IOS]
        app_version:
          type: string
        signing_public_key:
          type: string
          contentEncoding: base64
          description: Clé publique ECDSA P-256 (SubjectPublicKeyInfo DER) → `device.public_key`.
        agreement_public_key:
          type: string
          contentEncoding: base64
          description: Clé publique ECDH P-256 (SPKI DER) pour le chiffrement des PWD/PACK.
        key_attestation_chain:
          type: array
          minItems: 1
          items:
            type: string
            contentEncoding: base64
          description: 'Chaîne d''attestation Android Key Attestation (iOS : App Attest).'
        csr_pem:
          type: string
          description: CSR PKCS#10 signé par la clé de signature (pour obtenir un certificat mTLS).
    DeviceEnrollmentResponse:
      type: object
      required: [device_id, serial, access_token, token_type, expires_in, refresh_token, next_seq, server_time]
      properties:
        device_id:
          type: string
          format: uuid
        serial:
          type: string
        certificate_pem:
          type:
            - string
            - 'null'
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
        next_seq:
          type: integer
          format: int64
          minimum: 1
        server_time:
          $ref: '#/components/schemas/Timestamp'
    DeviceTokenRefreshRequest:
      type: object
      required: [serial, refresh_token, nonce, signature]
      properties:
        serial:
          type: string
        refresh_token:
          type: string
        nonce:
          type: string
          minLength: 16
        signature:
          type: string
          contentEncoding: base64
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
    OfflinePolicy:
      type: object
      description: Politique hors ligne EFFECTIVE (effective_offline_policy) ; 0 = interdit.
      required: [offline_enabled, max_per_sale, max_per_media_per_device, max_total_per_device, max_snapshot_age_seconds, cash_topup_offline, capped]
      properties:
        offline_enabled:
          type: boolean
        max_per_sale:
          type: integer
          format: int64
          minimum: 0
        max_per_media_per_device:
          type: integer
          format: int64
          minimum: 0
        max_total_per_device:
          type: integer
          format: int64
          minimum: 0
        max_snapshot_age_seconds:
          type: integer
          minimum: 0
          default: 900
          description: |
            Âge maximal du snapshot pour autoriser hors ligne (paramètre `max_snapshot_age`, défaut 900 s =
            15 min). Au-delà, le terminal refuse toute nouvelle opération hors ligne (sync_protocol.md §4.3).
        cash_topup_offline:
          type: boolean
        capped:
          type: boolean
          description: Vrai si le plafond prestataire a réduit une valeur demandée.
    DebitAuthority:
      type: object
      required: [ledger_id, authority, epoch, edge_gateway_id, edge_base_url]
      properties:
        ledger_id:
          type: string
          format: uuid
        authority:
          type: string
          enum: [CENTRAL, EDGE]
        epoch:
          type: integer
          format: int64
          description: Époque d'autorité, incrémentée à chaque bascule (jeton d'exclusion).
        edge_gateway_id:
          type:
            - string
            - 'null'
          format: uuid
        edge_base_url:
          type:
            - string
            - 'null'
          format: uri
    CatalogItem:
      type: object
      required: [product_id, name, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
        unit_price:
          $ref: '#/components/schemas/Amount'
        category:
          type: string
        vat_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
    DeviceConfig:
      type: object
      required: [config_id, device, event, offline_policy, snapshot_keys, debit_authority, seq, server_time, clock_tolerance_seconds, terminal_settings]
      properties:
        terminal_settings:
          type: object
          description: Réglages de fonctionnement de l'événement (ADR-61, SPECIFICATION §9.8), bornés par la base.
          required: [online_connect_timeout_ms, online_total_timeout_ms, online_retries, pending_sync_seconds, reconcile_sync_seconds, heartbeat_seconds, reversal_window_minutes, local_retention_days, tap_replay_window_seconds]
          properties:
            online_connect_timeout_ms: {type: integer, minimum: 1000, maximum: 5000, default: 2000}
            online_total_timeout_ms: {type: integer, minimum: 2000, maximum: 6000, default: 3000}
            online_retries: {type: integer, minimum: 0, maximum: 3, default: 2}
            pending_sync_seconds: {type: integer, minimum: 10, maximum: 300, default: 30}
            reconcile_sync_seconds: {type: integer, minimum: 60, maximum: 1800, default: 300}
            heartbeat_seconds: {type: integer, minimum: 30, maximum: 300, default: 60}
            reversal_window_minutes: {type: integer, minimum: 0, maximum: 60, default: 15}
            local_retention_days: {type: integer, minimum: 7, maximum: 30, default: 7}
            tap_replay_window_seconds: {type: integer, minimum: 0, maximum: 600, default: 120}
        config_id:
          type: integer
          format: int64
          description: |
            Identifiant de la configuration servie (`device_config_served.id`), stable tant que la politique
            effective, l'époque et le plancher de séquence ne changent pas. Le terminal le recopie dans chaque
            opération qu'il autorise hors ligne (`OfflineOperation.config_id`, champ d'état non chaîné, comme
            `snapshot_version`) : le serveur contrôle les plafonds de CETTE configuration (sync_protocol.md §7.2).
        device:
          type: object
          required: [device_id, serial, kind, app_mode, os, nfc_enabled, status]
          properties:
            device_id:
              type: string
              format: uuid
            serial:
              type: string
            kind:
              $ref: '#/components/schemas/DeviceKind'
            app_mode:
              $ref: '#/components/schemas/DeviceAppMode'
            os:
              type: string
              enum: [ANDROID, IOS]
            nfc_enabled:
              type: boolean
            status:
              $ref: '#/components/schemas/DeviceStatus'
            station_name:
              type:
                - string
                - 'null'
        event:
          type: object
          required: [event_id, name, currency, minor_units, timezone, status, activation_modes]
          properties:
            event_id:
              type: string
              format: uuid
            name:
              type: string
            currency:
              $ref: '#/components/schemas/Currency'
            minor_units:
              type: integer
              minimum: 0
              maximum: 3
            timezone:
              type: string
            status:
              type: string
              enum: [DRAFT, LIVE, CLOSING, RECONCILING, SETTLING, REFUND_WINDOW, CLOSED]
            activation_modes:
              type: array
              items:
                type: string
                enum: [DESK, SELF_APP, FIRST_TOPUP]
        pos:
          type:
            - object
            - 'null'
          properties:
            pos_id:
              type: string
              format: uuid
            name:
              type: string
            merchant_name:
              type: string
        catalog:
          type:
            - object
            - 'null'
          description: Présent pour CATALOG_POS ; absent (null) pour KEYPAD_TPE / TOPUP_DESK.
          properties:
            version:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/CatalogItem'
        offline_policy:
          $ref: '#/components/schemas/OfflinePolicy'
        snapshot_keys:
          type: array
          description: |
            Clés publiques valides pour vérifier les snapshots (rotation par `key_id`), au plus deux par
            signataire : le central (clé dans le KMS/HSM) et chaque passerelle (clé propre, hors KMS, dans son
            stockage matériel, `key_id` distinct) — sync_protocol.md §4.1.
          items:
            type: object
            required: [key_id, algorithm, public_key]
            properties:
              key_id:
                type: string
              algorithm:
                type: string
                enum: [ECDSA_P256_SHA256, Ed25519]
                description: '`ECDSA_P256_SHA256` par défaut ; Ed25519 si le KMS le permet (POINTS_OUVERTS OP-N13).'
              public_key:
                type: string
                contentEncoding: base64
              not_after:
                $ref: '#/components/schemas/Timestamp'
        debit_authority:
          $ref: '#/components/schemas/DebitAuthority'
        seq:
          type: object
          required: [next_seq_floor, contiguous_acked_seq]
          properties:
            next_seq_floor:
              type: integer
              format: int64
              description: Le terminal DOIT utiliser seq ≥ max(local + 1, next_seq_floor).
            contiguous_acked_seq:
              type: integer
              format: int64
        server_time:
          $ref: '#/components/schemas/Timestamp'
        clock_tolerance_seconds:
          type: integer
          default: 120
    HeartbeatRequest:
      type: object
      required: [device_time, last_local_seq, pending_operations]
      properties:
        device_time:
          $ref: '#/components/schemas/Timestamp'
        snapshot_version:
          type:
            - integer
            - 'null'
          format: int64
        last_local_seq:
          type: integer
          format: int64
        pending_operations:
          type: integer
        pending_exposure:
          type: integer
          format: int64
          description: Somme des débits hors ligne non acquittés.
        battery_percent:
          type: integer
          minimum: 0
          maximum: 100
        app_version:
          type: string
    HeartbeatResponse:
      type: object
      required: [server_time, config_etag, latest_snapshot_version, debit_authority, sync_requested]
      properties:
        server_time:
          $ref: '#/components/schemas/Timestamp'
        config_etag:
          type: string
        latest_snapshot_version:
          type:
            - integer
            - 'null'
          format: int64
        debit_authority:
          $ref: '#/components/schemas/DebitAuthority'
        sync_requested:
          type: boolean
          description: Le serveur demande l'envoi immédiat des opérations en attente.
    SeqStatus:
      type: object
      required: [device_serial, contiguous_acked_seq, max_seen_seq, missing_seqs, next_seq_floor]
      properties:
        device_serial:
          type: string
        contiguous_acked_seq:
          type: integer
          format: int64
        max_seen_seq:
          type: integer
          format: int64
        missing_seqs:
          type: array
          items:
            type: integer
            format: int64
        next_seq_floor:
          type: integer
          format: int64

    # ------------------------------------------------------------ Bracelets
    TapResultCode:
      type: string
      description: |
        Résultat de `register_tap` (champ `result`). `SIGNATURE_MISSING` n'existe qu'en ligne : hors ligne, une
        signature absente ouvre une anomalie `SIGNATURE_MISMATCH` et l'opération est gardée.
      enum: [OK, UNKNOWN, BLOCKED, UID_MISMATCH, SIGNATURE_MISMATCH, SIGNATURE_MISSING, CLONE_SUSPECTED, RETIRED, REPLACED, NOT_ACTIVATED, RELEASED, BATCH_INACTIVE, WRONG_EVENT]
    MediaStatus:
      type: string
      enum: [PERSONALIZED, ISSUED, ACTIVE, SUSPENDED, REPLACED, BLACKLISTED, RELEASED, RETIRED, DESTROYED]
    DepositStatus:
      type: string
      enum: [NONE, DUE, HELD, REFUNDED, FORFEITED]
    WalletStatus:
      type: string
      enum: [ACTIVE, BLOCKED, CLOSED]
    TapInput:
      type: object
      description: Lecture d'un bracelet MIFARE Ultralight EV1 (format B).
      required: [nfc_uid, token_hash, counter, key_index, pack_verified, occurred_at]
      properties:
        nfc_uid:
          $ref: '#/components/schemas/NfcUid'
        token_hash:
          $ref: '#/components/schemas/Hex32'
        counter:
          type: integer
          minimum: 0
          maximum: 16777215
          description: Valeur du compteur 24 bits lue par READ_CNT après INCR_CNT.
        key_index:
          type: integer
          minimum: 0
          maximum: 65535
        format_major:
          type: integer
          default: 1
        format_minor:
          type: integer
          default: 0
        pack_verified:
          type: boolean
          description: Le PACK renvoyé par le tag après PWD_AUTH correspond au PACK attendu. DOIT être true.
        originality_signature:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            Signature d'originalité NXP (READ_SIG, 32 octets), lue à chaque passage et vérifiée par le terminal
            (ADR-59). Le terminal DOIT l'envoyer. Le serveur la compare à celle de la personnalisation : différente
            → `SIGNATURE_MISMATCH` ; absente alors que la puce en a une → `SIGNATURE_MISSING` en ligne, anomalie
            `SIGNATURE_MISMATCH` hors ligne (opération gardée).
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    MediaAuthKeyRequest:
      type: object
      required: [nfc_uid, key_index]
      properties:
        nfc_uid:
          $ref: '#/components/schemas/NfcUid'
        key_index:
          type: integer
          minimum: 0
          maximum: 65535
    EncryptedBlob:
      type: object
      required: [nonce, ciphertext, tag]
      properties:
        alg:
          type: string
        epk:
          type: string
          description: Clé publique éphémère ECDH (point non compressé, base64url).
        nonce:
          type: string
          contentEncoding: base64
        ciphertext:
          type: string
          contentEncoding: base64
        tag:
          type: string
          contentEncoding: base64
    WrappedKey:
      type: object
      description: |
        Clé de contenu AES-256 (propre au snapshot) enveloppée pour la clé d'accord ECDH P-256 du terminal
        (ECDH-ES + HKDF-SHA256 + AES Key Wrap). Elle déchiffre les `pwd_pack_enc` des entrées.
      required: [alg, epk, wrapped_key]
      properties:
        alg:
          type: string
          const: ECDH-ES+HKDF-SHA256+A256KW
        epk:
          type: string
          description: Clé publique éphémère (base64url).
        wrapped_key:
          type: string
          contentEncoding: base64
    MediaAuthKey:
      type: object
      required: [nfc_uid, key_index, enc, ttl_seconds]
      properties:
        nfc_uid:
          $ref: '#/components/schemas/NfcUid'
        key_index:
          type: integer
        enc:
          $ref: '#/components/schemas/EncryptedBlob'
        ttl_seconds:
          type: integer
          description: Durée pendant laquelle le terminal peut garder le PWD en mémoire vive.
    WalletSummary:
      type: object
      required: [wallet_id, status, currency, spendable, paid, promo]
      properties:
        wallet_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WalletStatus'
        currency:
          $ref: '#/components/schemas/Currency'
        spendable:
          type: integer
          format: int64
        paid:
          type: integer
          format: int64
        promo:
          type: integer
          format: int64
    TapResponse:
      type: object
      required: [tap_id, result, tap_expires_at, media, wallet]
      properties:
        tap_id:
          type:
            - integer
            - 'null'
          format: int64
          description: media_tap.id ; null si la lecture n'a pas été enregistrée (UNKNOWN, RETIRED…).
        result:
          $ref: '#/components/schemas/TapResultCode'
        tap_expires_at:
          type:
            - string
            - 'null'
          format: date-time
        media:
          oneOf:
            - type: 'null'
            - type: object
              required: [media_id, status, deposit_status]
              properties:
                media_id:
                  type: string
                  format: uuid
                status:
                  $ref: '#/components/schemas/MediaStatus'
                batch_kind:
                  type: string
                  enum: [PUBLIC, STAFF, VIP]
                deposit_status:
                  $ref: '#/components/schemas/DepositStatus'
                deposit_held:
                  type: integer
                  format: int64
        wallet:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WalletSummary'
    Media:
      type: object
      required: [media_id, kind, status, key_index, deposit_status]
      properties:
        media_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [NFC_TAG, CARD, QR]
        chip_type:
          type: string
        nfc_uid:
          oneOf:
            - $ref: '#/components/schemas/NfcUid'
            - type: 'null'
        key_index:
          type: integer
        status:
          $ref: '#/components/schemas/MediaStatus'
        batch_id:
          type:
            - string
            - 'null'
          format: uuid
        batch_kind:
          type: string
          enum: [PUBLIC, STAFF, VIP]
        deposit_status:
          $ref: '#/components/schemas/DepositStatus'
        deposit_held:
          type: integer
          format: int64
        wallet_ids:
          type: array
          items:
            type: string
            format: uuid
        last_counter:
          type:
            - integer
            - 'null'
          format: int64
    MoneyMovement:
      type: object
      description: |
        Moyen d'encaissement / de restitution hors portefeuille. Pour un remboursement : jamais `CARD` en V1 ;
        mobile money vers un numéro autre que le numéro vérifié du titulaire : conditions d'ADR-76.
      required: [method]
      properties:
        method:
          type: string
          enum: [CASH, WAVE, ORANGE_MONEY, CARD]
        msisdn:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
    MediaActivationRequest:
      type: object
      required: [tap_id, channel, occurred_at]
      properties:
        tap_id:
          type: integer
          format: int64
        channel:
          type: string
          enum: [DESK, FIRST_TOPUP]
          description: SELF_APP passe par POST /me/media.
        wallet_id:
          type:
            - string
            - 'null'
          format: uuid
        customer_id:
          type:
            - string
            - 'null'
          format: uuid
        deposit_payment:
          oneOf:
            - $ref: '#/components/schemas/MoneyMovement'
            - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    DepositState:
      type: object
      required: [status, amount]
      properties:
        status:
          $ref: '#/components/schemas/DepositStatus'
        amount:
          type: integer
          format: int64
        mode:
          type:
            - string
            - 'null'
          enum: [FROM_BALANCE, SEPARATE, null]
        transaction_id:
          type:
            - string
            - 'null'
          format: uuid
    MediaActivationResponse:
      type: object
      required: [media_id, media_status, wallet, deposit]
      properties:
        media_id:
          type: string
          format: uuid
        media_status:
          $ref: '#/components/schemas/MediaStatus'
        wallet:
          $ref: '#/components/schemas/WalletSummary'
        deposit:
          $ref: '#/components/schemas/DepositState'
    DepositRequest:
      type: object
      properties:
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        payment:
          $ref: '#/components/schemas/MoneyMovement'
    MediaReleaseRequest:
      type: object
      description: Espèces uniquement (voir `releaseMedia`).
      properties:
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        cash_session_id:
          type: string
          format: uuid
          description: Session de caisse ouverte ; obligatoire si des espèces sont rendues.
        refund_deposit_by:
          $ref: '#/components/schemas/CashMovement'
        settle_balance:
          $ref: '#/components/schemas/CashMovement'
    MediaReleaseResponse:
      type: object
      required: [media_id, media_status]
      properties:
        media_id:
          type: string
          format: uuid
        media_status:
          $ref: '#/components/schemas/MediaStatus'
        deposit_refund_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
        promo_expiry_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Transaction `PROMO_EXPIRY` des crédits offerts restants (null s'il n'y en avait pas).
        balance_refund_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Transaction `WALLET_REFUND` du solde payé (null si le solde payé était nul).
        cash_to_hand_back:
          type: integer
          format: int64
          description: Montant total en espèces à remettre au festivalier.

    # ------------------------------------------------------------ Paiements
    SaleLine:
      type: object
      required: [quantity, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
        label:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Amount'
    PaymentRequestBody:
      type: object
      description: |
        Exactement un moyen parmi `tap_id`, `tap`, `customer_qr_token`, `payment_intent_id`. Si `lines`
        est présent, `amount` DOIT être égal à Σ quantity × unit_price.
        `payment_intent_id` est V2 (ADR-43) : en V1, le serveur le refuse (`422 DEVICE_MODE_NOT_ALLOWED`).
      required: [amount, currency, occurred_at]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        customer_qr_token:
          type: string
          minLength: 12
          maxLength: 64
        payment_intent_id:
          type: string
          description: '**V2 (ADR-43)** — intention d''un POS tiers présentée par un terminal `PAIRED_TPE`. Refusé en V1 (`422 DEVICE_MODE_NOT_ALLOWED`).'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
      oneOf:
        - required: [tap_id]
        - required: [tap]
        - required: [customer_qr_token]
        - required: [payment_intent_id]
    PaymentResult:
      type: object
      required: [transaction_id, idempotency_key, type, status, amount, currency, occurred_at, recorded_at, balance_after]
      properties:
        transaction_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          type: string
          enum: [SUCCEEDED]
        reverses_id:
          type:
            - string
            - 'null'
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        media_id:
          type:
            - string
            - 'null'
          format: uuid
        wallet_id:
          type: string
          format: uuid
        balance_after:
          $ref: '#/components/schemas/Balance'
        receipt_number:
          type: string
    ReversalRequest:
      type: object
      required: [reason, occurred_at]
      properties:
        reason:
          type: string
          enum: [INPUT_ERROR, CUSTOMER_CANCELLED, PRODUCT_UNAVAILABLE, DUPLICATE, OTHER]
        comment:
          type: string
          maxLength: 500
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        supervisor_pin_proof:
          type: string
          description: Preuve de validation superviseur au-delà de la fenêtre (jeton court signé).

    # ------------------------------------------------------------ Recharges
    CashTopupRequest:
      type: object
      required: [amount, currency, occurred_at]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        cash_tendered:
          type: integer
          format: int64
          description: Espèces remises (pour calcul du rendu, informatif).
        cash_session_id:
          type: string
          format: uuid
          description: Session de caisse ouverte de la station ; une recharge `TOPUP_CASH` est rattachée à une session (SPECIFICATION §5.3).
      oneOf:
        - required: [tap_id]
        - required: [tap]
    TopupResult:
      type: object
      required: [transaction_id, idempotency_key, type, status, amount, currency, wallet_id, balance_after]
      properties:
        transaction_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        type:
          type: string
          enum: [TOPUP_CASH, TOPUP]
        status:
          type: string
          enum: [SUCCEEDED]
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        wallet_id:
          type: string
          format: uuid
        balance_after:
          $ref: '#/components/schemas/Balance'
        deposit:
          oneOf:
            - $ref: '#/components/schemas/DepositState'
            - type: 'null'
    PspProvider:
      type: string
      description: |
        Moyen de paiement choisi par le payeur (ADR-70). WAVE et ORANGE_MONEY : intégrations directes. CARD :
        traité par le PSP carte que le prestataire a configuré pour l'organisateur (agrégateur local comme
        PayDunya, ou PSP international comme Stripe) ; refusé (`422 VALIDATION_FAILED`) si l'organisateur n'a
        aucun PSP carte actif.
      enum: [WAVE, ORANGE_MONEY, CARD]
    PspTopupRequest:
      type: object
      required: [amount, currency, provider]
      properties:
        wallet_id:
          type: string
          format: uuid
        tap_id:
          type: integer
          format: int64
          description: Au guichet (TOPUP_DESK) à la place de wallet_id.
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        provider:
          $ref: '#/components/schemas/PspProvider'
        payer_msisdn:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
        return_url:
          type: string
          format: uri
    PspTopup:
      type: object
      required: [topup_id, status, provider, amount, currency, wallet_id]
      properties:
        topup_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, EXPIRED, CANCELLED]
        provider:
          $ref: '#/components/schemas/PspProvider'
        psp_config_id:
          type: string
          format: uuid
          description: Configuration PSP (S26) utilisée ; son URL de webhook est `/webhooks/{provider}/{psp_config_id}`.
        provider_reference:
          type:
            - string
            - 'null'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        wallet_id:
          type: string
          format: uuid
        checkout_url:
          type:
            - string
            - 'null'
          format: uri
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        transaction_id:
          type:
            - string
            - 'null'
          format: uuid
        failure_reason:
          type: string
    PspWebhookEvent:
      type: object
      description: Corps natif du PSP (non normalisé) ; seuls `id` et `type` sont exigés ici.
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          additionalProperties: true
      additionalProperties: true

    # ------------------------------------------------------------ Hors ligne
    SnapshotEntry:
      type: object
      description: |
        Entrée du contenu (vue `offline_snapshot_rows`, sync_protocol.md §4.1) : une par rattachement ouvert.
        Le terminal applique les mêmes règles que le serveur : statut du bracelet, du lot et du portefeuille,
        événement du lot, compteur strictement supérieur à `last_counter`. Environ 120 octets par entrée
        (≈ 6 Mo pour 50 000 bracelets).
      required: [token_hash, nfc_uid, key_index, originality_sig_sha256, status, batch_event_id, batch_status, wallet_status, spendable, last_counter, pwd_pack_enc]
      properties:
        originality_sig_sha256:
          oneOf:
            - $ref: '#/components/schemas/Hex32'
            - type: 'null'
          description: |
            SHA-256 de la signature d'originalité enregistrée à la personnalisation (`media.originality_sig_sha256`) ;
            le terminal hors ligne compare la signature lue (ADR-59, sync_protocol.md §5.2-4). Null si aucune
            signature n'est enregistrée.
        token_hash:
          $ref: '#/components/schemas/Hex32'
        nfc_uid:
          oneOf:
            - $ref: '#/components/schemas/NfcUid'
            - type: 'null'
        key_index:
          type: integer
        status:
          $ref: '#/components/schemas/MediaStatus'
        batch_event_id:
          type:
            - string
            - 'null'
          format: uuid
        batch_status:
          type:
            - string
            - 'null'
          enum: [ORDERED, PERSONALIZED, DELIVERED, ACTIVE, SUSPENDED, CLOSED, null]
        wallet_status:
          allOf:
            - $ref: '#/components/schemas/WalletStatus'
          description: Statut du portefeuille rattaché ; hors ligne, une vente n'est autorisée que si `ACTIVE`.
        spendable:
          type: integer
          format: int64
          minimum: 0
        last_counter:
          type:
            - integer
            - 'null'
          format: int64
        pwd_pack_enc:
          oneOf:
            - $ref: '#/components/schemas/EncryptedBlob'
            - type: 'null'
          description: PWD||PACK chiffré (AES-256-GCM, clé de contenu `pwd_pack_key`) ; null si le bracelet n'est pas utilisable.
    SnapshotHeader:
      type: object
      description: |
        Partie signée. Signature (algorithme de la clé `key_id`, `ECDSA_P256_SHA256` par défaut) sur la
        sérialisation canonique JSON (RFC 8785, JCS) de cet objet entier (sync_protocol.md §4.1).
        `content_sha256` = SHA-256 de la sérialisation JCS de `{entries, removed_token_hashes}` (sans les
        champs chiffrés `pwd_pack_enc`, propres à chaque terminal). Un snapshot produit par la passerelle est
        signé par une clé propre à la passerelle (hors KMS, stockage matériel), de `key_id` distinct.
      required: [format, kind, operator_id, ledger_id, event_id, currency, version, base_version, generated_at, valid_until, entries, removed, content_sha256, authority_epoch, key_id]
      properties:
        format:
          type: string
          const: CASHLESS-SNAPSHOT/v1
        kind:
          type: string
          enum: [FULL, DELTA]
        operator_id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        currency:
          $ref: '#/components/schemas/Currency'
        version:
          type: integer
          format: int64
        base_version:
          type:
            - integer
            - 'null'
          format: int64
          description: Pour un DELTA, version à laquelle il s'applique ; `null` pour un FULL.
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        valid_until:
          $ref: '#/components/schemas/Timestamp'
        entries:
          type: integer
          minimum: 0
          description: Nombre d'entrées du contenu.
        removed:
          type: integer
          minimum: 0
          description: Nombre de retraits (`removed_token_hashes`) ; 0 pour un FULL.
        content_sha256:
          $ref: '#/components/schemas/Hex32'
        authority_epoch:
          type: integer
          format: int64
        key_id:
          type: string
    OfflineSnapshot:
      type: object
      required: [header, signature, entries]
      properties:
        header:
          $ref: '#/components/schemas/SnapshotHeader'
        signature:
          type: string
          contentEncoding: base64
        pwd_pack_key:
          $ref: '#/components/schemas/WrappedKey'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotEntry'
        removed_token_hashes:
          type: array
          items:
            $ref: '#/components/schemas/Hex32'
    OfflineOperationType:
      type: string
      description: |
        PURCHASE (vente), REVERSAL (annulation d'une vente), TOPUP_CASH (si `cash_topup_offline`),
        VOID (numéro consommé sans effet comptable : abandon, refus en ligne), ONLINE_REF (référence à une
        opération exclusivement en ligne — activation, caution, restitution, QR… — identifiée par son
        `online_operation` et son `content_sha256`). Le lot couvre TOUS les numéros, y compris ceux déjà
        confirmés en ligne (sync_protocol.md §6.1 et §3.4).
        ACTIVATION et DEPOSIT_CASH : uniquement dans un lot de la passerelle (`EdgeSyncOperation`, `authorized_mode =
        EDGE_ONLINE`), pour une activation ou une caution en espèces faite au guichet pendant `EDGE` (ADR-52) ;
        détail dans `edge_guichet`. Un terminal NE DOIT PAS les utiliser dans ses propres lots.
      enum: [PURCHASE, REVERSAL, TOPUP_CASH, VOID, ONLINE_REF, ACTIVATION, DEPOSIT_CASH]
    OfflineOperation:
      type: object
      required: [seq, type, occurred_at, chain_hash]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
        type:
          $ref: '#/components/schemas/OfflineOperationType'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        tap:
          $ref: '#/components/schemas/TapInput'
        snapshot_version:
          type: integer
          format: int64
          description: Version du snapshot utilisé pour autoriser (champ d'état, hors `content_sha256`).
        config_id:
          type: integer
          format: int64
          description: |
            `DeviceConfig.config_id` de la configuration détenue au moment de l'autorisation. Champ d'ÉTAT
            (comme `snapshot_version`), non chaîné : il n'entre pas dans `content_sha256`, car il est posé au
            passage hors ligne d'une entrée créée en ligne (sync_protocol.md §3.3). Obligatoire pour une
            opération autorisée hors ligne ; absent sinon. Une opération `online_status = CONFIRMED` sans
            `config_id` est exemptée des contrôles de conformité (sync_protocol.md §7.2, §7.3).
        local_available_before:
          type: integer
          format: int64
          description: Solde disponible calculé localement avant l'opération (contrôle).
        online_status:
          type: string
          enum: [NOT_ATTEMPTED, CONFIRMED, UNKNOWN, REJECTED]
          description: |
            Issue de la tentative en ligne faite avec la même clé : jamais tentée, confirmée (réponse 2xx),
            inconnue (délai dépassé / coupure), refusée (réponse 4xx métier).
        online_tap_id:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            `tap_id` reçu de `POST /taps` pour la lecture embarquée dans `tap`, s'il a été reçu. Champ d'état (non
            chaîné). Le serveur réutilise cette lecture si elle est du même terminal, du même bracelet, du même
            compteur et n'a servi à aucune écriture : pas de fausse copie quand le lot arrive après le délai de
            renvoi (ADR-50).
        online_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: transaction_id reçu en ligne (si CONFIRMED).
        online_operation:
          type: string
          description: Pour ONLINE_REF, operationId de l'appel en ligne (ex. activateMedia).
        content_sha256:
          $ref: '#/components/schemas/Hex32'
        reverses_seq:
          type: integer
          format: int64
          description: Pour REVERSAL, seq de la vente annulée (du même terminal).
        reverses_transaction_id:
          type: string
          format: uuid
          description: Pour REVERSAL d'une vente écrite en ligne.
        reason:
          type: string
        void_reason:
          type: string
          enum: [ABORTED_BY_OPERATOR, ONLINE_REJECTED, NFC_READ_FAILED, APP_CRASH_RECOVERY]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
        clock:
          type: object
          properties:
            monotonic_ms:
              type: integer
              format: int64
              description: Horloge monotone depuis le démarrage.
            boot_id:
              type: string
            offset_ms:
              type: integer
              format: int64
              description: Décalage estimé (heure serveur − heure terminal) lors du dernier contact.
        chain_hash:
          $ref: '#/components/schemas/Hex32'
    OfflineBatchHeader:
      type: object
      required: [batch_id, device_serial, ledger_id, authority_epoch, seq_from, seq_to, count, created_at, prev_chain_hash, last_chain_hash]
      properties:
        batch_id:
          type: string
          format: uuid
        device_serial:
          type: string
        ledger_id:
          type: string
          format: uuid
        authority_epoch:
          type: integer
          format: int64
        seq_from:
          type: integer
          format: int64
        seq_to:
          type: integer
          format: int64
        count:
          type: integer
          minimum: 1
          maximum: 500
        created_at:
          $ref: '#/components/schemas/Timestamp'
        device_time_at_send:
          $ref: '#/components/schemas/Timestamp'
        prev_chain_hash:
          $ref: '#/components/schemas/Hex32'
        last_chain_hash:
          $ref: '#/components/schemas/Hex32'
    OfflineBatch:
      type: object
      required: [header, operations, signature]
      properties:
        header:
          $ref: '#/components/schemas/OfflineBatchHeader'
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/OfflineOperation'
        signature:
          type: string
          contentEncoding: base64
          description: ECDSA P-256 (clé Keystore) sur JCS(header).
    OfflineOperationStatus:
      type: string
      enum: [ACCEPTED, DUPLICATE, ACCEPTED_WITH_SHORTFALL, REJECTED]
    OfflineRejectReason:
      type: string
      description: |
        Raison de rejet d'une opération de lot (sync_protocol.md §7.1, §7.2, §7.3). `MEDIA_NOT_IN_SNAPSHOT` :
        bracelet absent du snapshot utilisé, ou inconnu / non activé au serveur (`MEDIA_UNKNOWN` est réservé au
        chemin en ligne). `INSUFFICIENT_FUNDS_RETRY` : 4ᵉ `CL007` consécutif (débits concurrents) ; rien
        n'est écrit, `retryable = true`, le terminal renvoie l'opération dans un lot ultérieur.
        `SYNC_DEADLINE_PASSED` : synchronisation reçue alors que l'événement est en `SETTLING` ou au-delà (ADR-49) ;
        rien n'est écrit, `retryable = false` ; le commerçant reste garanti par une écriture du back-office.
        `PERIOD_CLOSED` et `LEDGER_LOCKED` ne sont pas des fautes du terminal (traitement manuel).
        `EDGE_REPLAY_FAILED` : lot de passerelle seulement ; rejeu impossible d'une `ACTIVATION` ou d'un
        `DEPOSIT_CASH` (`detail` donne le code de l'échec ; sync_protocol.md §9.6).
        `SEQ_OUT_OF_RANGE` n'est pas une raison par opération : le lot entier est refusé (`409`).
      enum:
        - IDEMPOTENCY_KEY_REUSED
        - MALFORMED_OPERATION
        - CURRENCY_MISMATCH
        - OFFLINE_NOT_ALLOWED
        - POLICY_LIMIT_EXCEEDED
        - SNAPSHOT_TOO_OLD
        - SNAPSHOT_VERSION_UNKNOWN
        - MEDIA_NOT_IN_SNAPSHOT
        - MEDIA_BLOCKED_IN_SNAPSHOT
        - MEDIA_WRONG_EVENT
        - PACK_NOT_VERIFIED
        - REVERSAL_TARGET_NOT_FOUND
        - ALREADY_REVERSED
        - PERIOD_CLOSED
        - LEDGER_LOCKED
        - WALLET_LIMIT_EXCEEDED
        - INSUFFICIENT_FUNDS_RETRY
        - SYNC_DEADLINE_PASSED
        - EDGE_REPLAY_FAILED
    ShortfallReason:
      type: string
      enum: [INSUFFICIENT_FUNDS, MEDIA_BLOCKED_AFTER_SNAPSHOT, MEDIA_CLONE_SUSPECTED, MEDIA_UID_MISMATCH, MEDIA_SIGNATURE_MISMATCH, WALLET_BLOCKED]
    OfflineOperationResult:
      type: object
      required: [seq, idempotency_key, status]
      properties:
        seq:
          type: integer
          format: int64
        idempotency_key:
          type: string
        status:
          $ref: '#/components/schemas/OfflineOperationStatus'
        transaction_id:
          type:
            - string
            - 'null'
          format: uuid
        effect:
          type: string
          enum: [LEDGER_WRITTEN, NONE]
          description: NONE pour VOID, ONLINE_REF non exécuté, REJECTED.
        charged_to_wallet:
          type: integer
          format: int64
        shortfall_amount:
          type: integer
          format: int64
        shortfall_reason:
          $ref: '#/components/schemas/ShortfallReason'
        anomaly_id:
          type: string
          format: uuid
        tap_result:
          $ref: '#/components/schemas/TapResultCode'
        reject_reason:
          $ref: '#/components/schemas/OfflineRejectReason'
        retryable:
          type: boolean
        detail:
          type: string
    OfflineBatchResult:
      type: object
      required: [batch_id, processed_at, results, contiguous_acked_seq, missing_seqs, server_time]
      properties:
        batch_id:
          type: string
          format: uuid
        processed_at:
          $ref: '#/components/schemas/Timestamp'
        results:
          type: array
          items:
            $ref: '#/components/schemas/OfflineOperationResult'
        contiguous_acked_seq:
          type: integer
          format: int64
        missing_seqs:
          type: array
          items:
            type: integer
            format: int64
        next_snapshot_version:
          type:
            - integer
            - 'null'
          format: int64
        abandoned:
          type: boolean
          default: false
          description: |
            Vrai si le lot a été abandonné (traitement interrompu plus de 15 min) : `results` ne contient que les
            opérations traitées ; renvoyer les autres dans un nouveau lot (sync_protocol.md §6.2-6).
        server_time:
          $ref: '#/components/schemas/Timestamp'
    EdgeSyncOperation:
      allOf:
        - $ref: '#/components/schemas/OfflineOperation'
        - type: object
          required: [edge_seq, device_serial, authorized_mode]
          properties:
            edge_seq:
              type: integer
              format: int64
            device_serial:
              type: string
            authorized_mode:
              type: string
              enum: [EDGE_ONLINE, DEVICE_OFFLINE]
              description: Autorisée en direct par la passerelle, ou relayée d'un lot hors ligne de terminal.
            device_batch_id:
              type: string
              format: uuid
              description: |
                Obligatoire si `authorized_mode = DEVICE_OFFLINE` : `header.batch_id` du lot d'origine du
                terminal, dont l'en-tête et la signature sont relayés dans `EdgeSyncBatch.device_batches`.
                Il n'y a pas de signature par opération : le terminal signe l'en-tête de son lot.
            edge_guichet:
              type: object
              description: |
                Obligatoire pour `type = ACTIVATION` ou `DEPOSIT_CASH` (ADR-52). Le central rejoue `activate_media`
                (avec `event_id`) ou `take_deposit` (mode `SEPARATE`, espèces de la station `cash_desk_account_id`).
                Rejeu impossible : `REJECTED` / `EDGE_REPLAY_FAILED` et espèces au compte d'attente (sync_protocol.md §9.6).
              required: [media_id]
              properties:
                media_id:
                  type: string
                  format: uuid
                wallet_id:
                  type: string
                  format: uuid
                  description: ACTIVATION — portefeuille rattaché (créé par la passerelle s'il est anonyme).
                event_id:
                  type: string
                  format: uuid
                channel:
                  type: string
                  enum: [DESK]
                deposit_amount:
                  type: integer
                  format: int64
                  description: DEPOSIT_CASH — montant de la caution encaissée en espèces.
                cash_desk_account_id:
                  type: string
                  format: uuid
            edge_decision:
              type: object
              description: |
                Décision de la passerelle (autorité) : le central écrit ces montants tels quels
                (répartition portefeuille / compte d'attente) et recalcule seulement frais et commissions.
              required: [status, charged_to_wallet, shortfall_amount]
              properties:
                status:
                  $ref: '#/components/schemas/OfflineOperationStatus'
                charged_to_wallet:
                  type: integer
                  format: int64
                shortfall_amount:
                  type: integer
                  format: int64
                shortfall_reason:
                  $ref: '#/components/schemas/ShortfallReason'
                reject_reason:
                  $ref: '#/components/schemas/OfflineRejectReason'
    EdgeSyncBatch:
      type: object
      description: |
        Lot EDGE_SYNC (sync_protocol.md §9.5). `batch_id` est la clé d'idempotence du lot. Les opérations
        relayées d'un lot hors ligne de terminal (`DEVICE_OFFLINE`) sont accompagnées de l'en-tête et de la
        signature d'ORIGINE de ce lot (`device_batches`) : le central vérifie la signature avec
        `device.public_key` (`BATCH_SIGNATURE_INVALID` sinon) et recalcule la chaîne du terminal jusqu'à
        `header.last_chain_hash` (`CHAIN_BROKEN` sinon).
      required: [batch_id, edge_gateway_id, ledger_id, epoch, edge_seq_from, edge_seq_to, prev_chain_hash, last_chain_hash, operations, signature]
      properties:
        batch_id:
          type: string
          format: uuid
        edge_gateway_id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        epoch:
          type: integer
          format: int64
        edge_seq_from:
          type: integer
          format: int64
        edge_seq_to:
          type: integer
          format: int64
        prev_chain_hash:
          $ref: '#/components/schemas/Hex32'
        last_chain_hash:
          $ref: '#/components/schemas/Hex32'
        operations:
          type: array
          minItems: 1
          maxItems: 500
          description: Au plus 500 opérations et 1 Mio par lot, dans l'ordre des `edge_seq`.
          items:
            $ref: '#/components/schemas/EdgeSyncOperation'
        device_batches:
          type: array
          description: |
            En-têtes et signatures d'origine des lots de terminaux relayés (une entrée par `device_batch_id`
            référencé par une opération `DEVICE_OFFLINE` du lot) ; absent ou vide s'il n'y en a pas.
          items:
            type: object
            required: [header, signature]
            properties:
              header:
                $ref: '#/components/schemas/OfflineBatchHeader'
              signature:
                type: string
                contentEncoding: base64
                description: Signature d'origine du terminal (ECDSA P-256) sur JCS(header), relayée telle quelle.
        signature:
          type: string
          contentEncoding: base64
      example:
        batch_id: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
        edge_gateway_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        ledger_id: 2c9a1f0e-3b4d-4e5f-8a7b-6c5d4e3f2a1b
        epoch: 5
        edge_seq_from: 4210
        edge_seq_to: 4212
        prev_chain_hash: 1b4f0e9851971998e732078544c96b36c3d01cedf7caa332359d6f1d83567014
        last_chain_hash: 60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752
        operations:
          - edge_seq: 4210
            device_serial: TPE-BAR-01
            authorized_mode: EDGE_ONLINE
            seq: 131
            type: PURCHASE
            occurred_at: '2026-12-12T21:00:00Z'
            amount: 3000
            currency: XOF
            tap:
              nfc_uid: 04a1b2c3d4e5f6
              token_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
              counter: 430
              key_index: 1
              pack_verified: true
              originality_signature: 3a7f0c9e5b2d4a6f8e1c3b5d7f9a0c2e4b6d8f0a1c3e5b7d9f0a2c4e6b8d0f1a
              occurred_at: '2026-12-12T20:59:59Z'
            edge_decision:
              status: ACCEPTED
              charged_to_wallet: 3000
              shortfall_amount: 0
            chain_hash: fd61a03af4f77d870fc21e05e7e80678095c92d808cfb3b5c279ee04c74aca13
          - edge_seq: 4211
            device_serial: TPE-BAR-01
            authorized_mode: EDGE_ONLINE
            seq: 132
            type: VOID
            occurred_at: '2026-12-12T21:01:00Z'
            void_reason: ONLINE_REJECTED
            edge_decision:
              status: ACCEPTED
              charged_to_wallet: 0
              shortfall_amount: 0
            chain_hash: 60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752
          - edge_seq: 4212
            device_serial: TPE-FOOD-02
            authorized_mode: DEVICE_OFFLINE
            device_batch_id: 5d6e7f80-91a2-4b3c-8d4e-5f6a7b8c9d0e
