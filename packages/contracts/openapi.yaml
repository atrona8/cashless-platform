      tags: [Événements]
      operationId: listParticipations
      summary: Lister les participations d'un événement
      description: |
        Commerçants inscrits à l'événement. Rôles : `OPERATOR_ADMIN`, `ORGANIZER_ADMIN`, `SUPERVISOR` de l'événement ;
        `MERCHANT_ADMIN` ne voit que la sienne.
      parameters:
