          type: string
          enum: [PENDING_DESK_CONFIRMATION]
        confirmation_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: À montrer à l'agent du guichet ; n'est renvoyé qu'au compte demandeur.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    MediaClaimRequest:
      type: object
      required: [claim_code]
      properties:
        claim_code:
          type: string
          description: Code imprimé (10 caractères de l'alphabet 23456789ABCDEFGHJKLMNPQRSTUVWXYZ) ; tirets, espaces et casse ignorés.
          examples: [K7QM-4XH9RT]
        wallet_id:
          type: string
          format: uuid
          description: Portefeuille existant du client à utiliser (sinon créé).
    RefundRequestStatus:
      type: string
      description: |
        Traitement manuel en V1 : `REQUESTED` → `PROCESSING` (approuvée par une seconde personne,
        `WALLET_REFUND` écrite, paiement hors système en cours) → `PAID` (confirmé) ou `FAILED` (échec
        enregistré, `WALLET_REFUND` contre-passée). `REQUESTED` → `REJECTED` (refus du back-office).
        `CANCELLED` : demande retirée avant approbation.
        Autre numéro (ADR-76) : `AWAITING_HOLDER` (le titulaire a reçu un code ; confirmation, blocage, ou passage
        automatique à `REQUESTED` à `hold_until`) ; `BLOCKED` (bloquée par le titulaire, finale).
      enum: [AWAITING_HOLDER, REQUESTED, PROCESSING, PAID, FAILED, REJECTED, CANCELLED, BLOCKED]
    RefundRequestCreate:
      type: object
      required: [wallet_id, destination]
      properties:
        wallet_id:
          type: string
          format: uuid
        destination:
          type: object
          required: [method]
          description: |
            Canaux de remboursement (ADR-53) : `WAVE` et `ORANGE_MONEY` vers le numéro vérifié du titulaire, ou un
            autre numéro avec `new_number_otp` (ADR-76) ;
            `BANK_TRANSFER` (avec `iban`) réservé aux demandes créées par le back-office. Le remboursement par carte
            n'existe pas en V1. Le remboursement en espèces se fait au guichet (pas de demande).
          properties:
            method:
              type: string
              enum: [WAVE, ORANGE_MONEY, BANK_TRANSFER]
            msisdn:
              type: string
              pattern: '^\+[1-9][0-9]{6,14}$'
            new_number_otp:
              type: object
              description: Obligatoire si `msisdn` n'est pas le numéro vérifié du titulaire (ADR-76).
              required: [otp_request_id, code]
              properties:
                otp_request_id:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
            iban:
              type: string
    RefundRequest:
      type: object
      required: [refund_request_id, wallet_id, status, currency, destination, created_at]
      properties:
        refund_request_id:
          type: string
        wallet_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RefundRequestStatus'
        estimated_amount:
          type: integer
          format: int64
        fee:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        destination:
          type: object
          properties:
            method:
              type: string
            msisdn:
              type: string
            iban:
              type: string
        transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Transaction `WALLET_REFUND` écrite à l'approbation.
        approved_by:
          type:
            - string
            - 'null'
          format: uuid
          description: Seconde personne ayant approuvé (≠ auteur).
        new_number:
          type: boolean
          description: Destination différente du numéro vérifié du titulaire (ADR-76).
        hold_until:
          type:
            - string
            - 'null'
          format: date-time
          description: Fin de l'attente de la décision du titulaire (`AWAITING_HOLDER`).
        extra_check_required:
          type: boolean
          description: "Montant au-delà de `event.refund_new_number_max` vers un autre numéro : vérification d'identité exigée avant approbation."
        external_reference:
          type:
            - string
            - 'null'
          description: Référence du paiement hors système (renseignée à la confirmation `PAID`).
        failure_reason:
          type:
            - string
            - 'null'
        reversal_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Contre-passation (`REVERSAL`) de `WALLET_REFUND` si le paiement a échoué.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        reject_reason:
          type: string
    StaffRole:
      type: string
      description: |
        Rôles du personnel (SPECIFICATION §3.2). `VENDOR` et `CUSTOMER` existent mais ne sont pas attribuables par
        `grantRole` dans cette version.
      enum: [PLATFORM_ADMIN, OPERATOR_ADMIN, ORGANIZER_ADMIN, SUPERVISOR, CASHIER, MERCHANT_ADMIN, VENDOR, CUSTOMER]
    RoleScopeType:
      type: string
      description: |
        Portée d'une attribution. Englobement : `PLATFORM` ⊃ `OPERATOR` ⊃ `ORGANIZER` ⊃ `EVENT` ; `OPERATOR` ⊃
        `MERCHANT` ; un événement englobe les commerçants qui y participent.
      enum: [PLATFORM, OPERATOR, ORGANIZER, EVENT, MERCHANT]
    RoleAssignment:
      type: object
      required: [assignment_id, role, scope_type, scope_id, granted_by, granted_at, revoked_at]
      properties:
        assignment_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/StaffRole'
        scope_type:
          $ref: '#/components/schemas/RoleScopeType'
        scope_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Objet de la portée ; `null` pour `PLATFORM`.
        granted_by:
          type:
            - string
            - 'null'
          format: uuid
          description: Personne qui a attribué le rôle ; `null` pour l'amorçage.
        granted_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
      example:
        assignment_id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
        role: CASHIER
        scope_type: EVENT
        scope_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        granted_by: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        granted_at: '2026-12-10T08:30:00Z'
        revoked_at: null
    RoleGrant:
      type: object
      required: [role, scope_type]
      description: Un champ `approved_by` ou tout autre champ inconnu est ignoré.
      properties:
        role:
          $ref: '#/components/schemas/StaffRole'
        scope_type:
          $ref: '#/components/schemas/RoleScopeType'
        scope_id:
          type:
            - string
            - 'null'
          format: uuid
      example:
        role: CASHIER
        scope_type: EVENT
        scope_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
    StaffUserCreate:
      type: object
      required: [issuer, subject, display_name]
      description: |
        Personne connue du serveur d'identité : `issuer` et `subject` sont les claims `iss` et `sub` de ses jetons.
        `email` ou `phone` (E.164) obligatoire. Tout champ inconnu est ignoré.
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 512
        subject:
          type: string
          minLength: 1
          maxLength: 255
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
      example:
        issuer: https://id.cashless.test
        subject: 6f1c2b8e-3d4a-4f5b-8c9d-0e1f2a3b4c5d
        display_name: Awa Ndiaye
        email: awa.ndiaye@festival.test
    StaffUser:
      type: object
      required: [user_id, operator_id, issuer, subject, display_name, status, created_at, disabled_at, role_assignments]
      properties:
        user_id:
          type: string
          format: uuid
        operator_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Prestataire ; `null` pour une personne de la plateforme.
        issuer:
          type: string
        subject:
          type: string
        email:
          type:
            - string
            - 'null'
        phone:
          type:
            - string
            - 'null'
        display_name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        disabled_at:
          type:
            - string
            - 'null'
          format: date-time
        role_assignments:
          type: array
          description: Attributions actives.
          items:
            $ref: '#/components/schemas/RoleAssignment'
      example:
        user_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        operator_id: 7c0e1a52-0000-4000-8000-000000000001
        issuer: https://id.cashless.test
        subject: 6f1c2b8e-3d4a-4f5b-8c9d-0e1f2a3b4c5d
        email: awa.ndiaye@festival.test
        phone: null
        display_name: Awa Ndiaye
        status: ACTIVE
        created_at: '2026-12-10T08:00:00Z'
        disabled_at: null
        role_assignments:
          - assignment_id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
            role: CASHIER
            scope_type: EVENT
            scope_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
            granted_by: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            granted_at: '2026-12-10T08:30:00Z'
            revoked_at: null
