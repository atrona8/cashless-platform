  /media/{media_id}/deposit:
    post:
      tags: [Bracelets]
      operationId: takeDeposit
      x-process: public
      summary: Encaisser la caution (take_deposit)
      description: |
        Transaction `DEPOSIT_TAKEN`. Mode `FROM_BALANCE` : prélevée sur `WALLET_PAID` si le solde suffit,
        sinon statut `DUE` (prélevée à la prochaine recharge). Mode `SEPARATE` : `payment.method` obligatoire
        (`CASH` → compte `CASH_DESK` de la station). Idempotent : si déjà `HELD`, renvoie l'état courant.
        Pendant `EDGE` (passerelle) : seul le mode `SEPARATE` avec `payment.method = CASH` est servi ;
        `FROM_BALANCE` → `409 DEBIT_AUTHORITY_EDGE` (ADR-52).
        Caution payée en espèces : la session de caisse `OPEN` du terminal reçoit l'écriture, sinon `409
        CONFLICT_STATE`. `cash_session_id` est facultatif ; fourni, il DOIT être la session ouverte du terminal
        (sinon `409 CONFLICT_STATE`). La réponse le renvoie.
      security:
        - deviceMtls: []
          deviceToken: []
          deviceSignature: []
          staffBearer: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceRequestId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
            example:
              tap_id: 918271
              payment:
                method: CASH
      responses:
        '200':
          description: État de la caution.
          headers:
            X-Request-Id:
