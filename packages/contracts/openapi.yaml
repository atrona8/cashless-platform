                payment_request_id: 8c9d0e1f-2a3b-4c4d-8e5f-6a7b8c9d0e1f
                token: CQ7M2K9XQ4TP
                qr_payload: CSHL1:CQ7M2K9XQ4TP
                expires_at: '2026-12-11T20:06:00Z'
