  /operators/{operator_id}/tag-keys/{key_index}/dek-rotations:
    post:
      tags: [Bracelets]
      operationId: requestDekRotation
      x-process: public
      summary: Demander la rotation de la clé de données d'une clé (à deux)
      description: |
        Demande d'approbation `TAG_DEK_ROTATE`. Approuvée : une nouvelle version de clé de données devient active, les autres
        ne servent plus qu'à déchiffrer, et tous les mots de passe de l'index sont rechiffrés par tranches sous la nouvelle
        version (§7.4) ; l'avancement se lit dans `listTagKeyJobs`. Refusée (`409`) si la clé n'est pas active ou si une
        rotation est déjà en cours. Rôle : `OPERATOR_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/KeyIndex'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '202':
          $ref: '#/components/responses/ApprovalRequestAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /operators/{operator_id}/tag-keys/{key_index}/retirement:
    post:
      tags: [Bracelets]
      operationId: requestTagKeyRetirement
      x-process: public
      summary: Demander le retrait d'une clé dédiée (à deux)
      description: |
        Demande d'approbation `TAG_KEY_RETIRE`. Possible seulement pour une clé dédiée dont tous les lots sont clos (`409`
        sinon). Approuvée : la clé et ses clés de données sont retirées, les mots de passe stockés effacés, les bracelets
        passent en fin de vie (`retire_dedicated_key`, §7.7) ; la clé est ensuite désactivée dans le service de clés par la
        commande d'administration, et la date de désactivation enregistrée. Rôle : `OPERATOR_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/KeyIndex'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '202':
          $ref: '#/components/responses/ApprovalRequestAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
