openapi: 3.1.0
info:
  title: API Cashless multi-tenant
  version: 1.0.0
  summary: API centrale (et sous-ensemble servi par la passerelle locale) du système cashless par bracelets NFC.
  description: |
    API de référence du système cashless multi-tenant (bracelets NFC MIFARE Ultralight EV1, QR, festivals).
    Elle est implémentée en NestJS (TypeScript) sur PostgreSQL ; le schéma de référence est `schema_grand_livre_cashless.sql`
    et le protocole hors ligne / passerelle est décrit dans `sync_protocol.md` (normatif).

    ## Conventions générales
    - **Multi-tenant** : le prestataire (`operator_id`) n'est JAMAIS passé en paramètre ; il est dérivé de la
      personne ou de l'appareil authentifié (JWT humain, jeton d'appareil, certificat mTLS, client POS). L'API
      positionne `app.operator_id` pour la Row Level Security avant toute requête. Un objet d'un autre prestataire
      répond `404 NOT_FOUND` (réponse neutre, identique à « n'existe pas »). Exception : les routes de gestion
      `/operators/{operator_id}/…` (tag `Personnes`) nomment le prestataire visé, pour qu'un `PLATFORM_ADMIN` (sans
      prestataire) puisse agir ; pour toute autre personne, ce prestataire DOIT être le sien (sinon `404`).
    - **Montants** : entiers en unités mineures (`int64`) + devise ISO 4217 ; une seule devise par événement.
      Un montant envoyé dans une autre devise que celle de l'événement est refusé (`CURRENCY_MISMATCH`).
    - **Horodatage** : RFC 3339 en UTC. `occurred_at` = heure réelle au terminal ; `recorded_at` = heure serveur.
    - **Idempotence** : toute opération qui écrit dans le grand livre ou crée un objet exige l'en-tête
      `Idempotency-Key`. Pour un terminal, la clé DOIT être `<device_serial>:<seq>` (seq sur au moins 4 chiffres,
      ex. `TPE-BAR-01:0003`) et devient telle quelle `journal_transaction.idempotency_key`. Pour les autres
      clients, la clé est libre (UUID recommandé) et le serveur la préfixe (`app:`, `pos:<client_id>:`, `bo:`).
      Un rejeu à l'identique renvoie la réponse d'origine avec `Idempotency-Replayed: true` ; un rejeu avec un
      contenu différent renvoie `409 IDEMPOTENCY_KEY_REUSED` ; une requête concurrente avec la même clé renvoie
      `409 IDEMPOTENCY_KEY_IN_PROGRESS`. Exception : la clé d'un lot (`POST /offline-batches`,
      `POST /edge/sync-batches`) est son `batch_id` (UUID v4, sync_protocol.md §6.1) ; chaque opération du lot
      garde sa propre clé `<serial>:<seq>`.
    - **Traçabilité** : `X-Request-Id` (UUID) est accepté en entrée, généré sinon, et toujours renvoyé. Sur une
      route de terminal, il est obligatoire : il fait partie des composants signés (`deviceSignature`).
    - **Langue** : `Accept-Language` (`fr`, `en` ; défaut `fr`) choisit la langue de `title` et `detail` des
      erreurs et des libellés renvoyés. Il n'a aucun effet sur les codes (`code`, statuts, énumérations).
    - **Erreurs** : RFC 9457 `application/problem+json`, avec un champ `code` stable (voir `ProblemCode`).
    - **Pagination** : par curseur opaque (`cursor`, `limit`) ; la réponse porte `next_cursor` et `has_more`.
    - **Passerelle locale** : les opérations marquées `x-edge-available: true` sont aussi servies, à l'identique,
      par la passerelle sur le LAN du site quand `ledger.debit_authority = EDGE`.
    - **Lecture du bracelet** : `POST /taps` renvoie un `tap_id` (`register_tap`). Une écriture consomme ce passage
      par `consume_tap` : un passage sert à UNE écriture (rejeu de la même écriture accepté). Passage déjà utilisé
      par une autre écriture ou par une demande de rattachement, ou écriture en ligne plus de
      `tap_replay_window_seconds` (défaut 120 s) après la lecture : `409 TAP_UNUSABLE` (`CL022`).
    - **Double validation** (ADR-74, SPECIFICATION §3.2) : le valideur vient toujours d'une authentification de la
      seconde personne, jamais du corps de la requête. Un champ `approved_by` reçu dans un corps est IGNORÉ.
      - Au guichet (immédiat) : jeton d'approbation sur place, en-tête `X-Approval-Token` (paramètre
        `ApprovalToken`). La seconde personne saisit son code personnel sur le même terminal ; le serveur
        d'identité (OIDC, authentification renforcée) délivre un jeton de 5 min, à usage unique (`jti`), lié à
        l'action (`act` = operationId, `act_hash` = SHA-256 de la requête canonique). Le valideur transmis à la
        base est le `sub` du jeton. Jeton absent quand il est requis : `403 APPROVAL_REQUIRED` ; jeton refusé :
        `403 APPROVAL_INVALID`. Opérations : `refundCashDue` et `releaseMedia` au-delà de
        `event.cash_refund_single_max`.
      - Au back-office (asynchrone) : demande puis approbation. L'appel d'une opération à deux personnes ne
        l'exécute pas : il crée une demande (`ApprovalRequest`, expiration 24 h, paramètres figés) et répond
        `202 Accepted`. Une seconde personne connectée, avec le rôle exigé par l'action, l'approuve
        (`approveApprovalRequest` : décision puis exécution unique, avec le `sub` de SA session comme valideur)
        ou la refuse (`rejectApprovalRequest`). Demande expirée, déjà décidée ou décidée par son auteur :
        `409 APPROVAL_INVALID` (`CL023`). Opérations : `waiveSeqGap`, `importDeviceJournal`,
        `revokeKycVerification`, `approveRefundRequest`, `postLateClaim`, `requestDebitAuthorityChange` avec
        `force = true`.
      - Règle des statuts : `403` quand la preuve jointe à la requête (le jeton) manque ou ne vaut rien ;
        `409` quand une demande enregistrée n'est plus dans un état qui permet la décision.
      - Empreinte de la requête liée au jeton sur place :
        `act_hash = hex(SHA-256(METHOD ‖ LF ‖ PATH ‖ LF ‖ JCS(body ?? null)))`, LF = saut de ligne (`\n`) ;
        `METHOD` en majuscules, `PATH` = chemin réel avec le préfixe `/v1`, sans chaîne de requête, corps en JSON canonique RFC 8785 (`null` si
        absent) ; l'en-tête du jeton n'entre pas dans le calcul.

    ## Statut de l'événement et écritures acceptées
    Résumé de ce que la base impose (`set_event_status`, `post_transaction`, `lock_settled_ledger`) ; le détail
    des types acceptés par statut est dans SPECIFICATION §12.1.
    - `DRAFT`, `LIVE` : grand livre `OPEN`. `BREAKAGE` n'est jamais accepté en `LIVE`. `BREAKAGE_REVERSAL` exige une
      casse antérieure sur le même portefeuille (bornes ADR-75, `409 LATE_CLAIM_INVALID`).
    - `CLOSING` à `REFUND_WINDOW` : grand livre `CLOSING` ; recharges et ventes de source `ONLINE` refusées
      (`409 EVENT_CLOSING`, `CL004`). À partir de `RECONCILING`, l'autorité de débit DOIT être `CENTRAL`
      (sinon `409 CLOSING_CONDITION_NOT_MET`, `CL019`).
    - `CLOSED` : la base exige que toutes les positions soient soldées, par partie (droit net) ou par compte sans
      titulaire, sauf les soldes restants autorisés : compte légal de casse, et, si la casse est `NONE`, soldes des
      festivaliers et espèces dues (`L-ESP-A-RENDRE`). Sans solde restant, le grand livre passe `LOCKED` dans la
      même transaction. Avec des soldes restants, il reste `CLOSING`, `locked_until` = date de clôture, et passe
      `LOCKED` par `lock_settled_ledger` quand tout est soldé.
    - Grand livre `LOCKED` : toute écriture est refusée (`409 LEDGER_LOCKED`, `CL003`), sauf les réclamations
      tardives (casse réversible, ADR-67) : `BREAKAGE_REVERSAL`, `ADJUSTMENT` et `WALLET_REFUND`, de source
      `BACKOFFICE`, à deux personnes, jusqu'à `ledger.late_claims_until` (voir `postLateClaim`).

    ## Sécurité
    - `humanBearer` : JWT (OIDC) pour les humains ; rôles de SPECIFICATION §3.2 : `PLATFORM_ADMIN`,
      `OPERATOR_ADMIN`, `ORGANIZER_ADMIN`, `SUPERVISOR`, `CASHIER`, `MERCHANT_ADMIN`, `VENDOR`, `CUSTOMER`, et
      `PERSONALIZER` (poste de personnalisation des bracelets, portée prestataire).
    - **Authentification des personnes** : le jeton prouve seulement l'identité (`iss`, `sub`, signature,
      audience, expiration). Le prestataire, le statut et les rôles (avec leur portée) sont tirés de la plateforme
      à chaque requête, jamais du jeton : un claim `roles` est ignoré ; un claim `operator_id`, s'il est présent,
      doit être celui de la personne (sinon `401`).
    - `deviceToken` : jeton d'appareil (JWT court, 15 min) délivré à l'enrôlement / au rafraîchissement,
      lié à la clé de l'appareil (claim `cnf`). `deviceMtls` : certificat client délivré à l'enrôlement.
      `deviceSignature` : signature de chaque requête par la clé de signature du terminal (RFC 9421, profil
      restreint).
    - **Trois preuves exigées ENSEMBLE** (ADR-107) : toute route de terminal exige, sur la même requête, le
      certificat client (`deviceMtls`), le jeton d'appareil lié (`deviceToken`) et la signature de la requête
      (`deviceSignature`) ; elle le déclare par UNE seule entrée `security` qui les réunit (deux entrées
      voudraient dire « ou »). Une route de guichet (terminal ET personne) ajoute `staffBearer` à cette même
      entrée : le jeton d'appareil reste dans `Authorization`, celui de la personne passe dans l'en-tête
      `X-Staff-Authorization: Bearer <JWT OIDC>`, vérifié exactement comme `humanBearer`. Cet en-tête n'est lu
      que sur les routes de guichet ; présent sur toute autre route, la requête est refusée (`401`). Ce texte remplace « un terminal utilise l'un OU l'autre » ; il contredit SPECIFICATION §10.3, dans
      le sens le plus sûr (renforcement consigné par ADR-107). Une preuve absente ou fausse : `401`
      (`UNAUTHENTICATED` ou `DEVICE_SIGNATURE_INVALID`), sans dire laquelle a échoué ; horloge du terminal hors
      tolérance : `400 CLOCK_SKEW_TOO_LARGE` avec l'heure du serveur dans l'en-tête `Date`. Exceptions :
      `enrollDevice` (aucune preuve : le terminal n'a pas encore d'identité) et `refreshDeviceToken` (certificat
      client et preuve de possession dans le corps ; le jeton d'appareil peut être expiré).
    - `posClient` : OAuth 2.0 client credentials pour les POS tiers (intentions de paiement).
    - `pspHmac` : signature HMAC-SHA256 des webhooks entrants des PSP.
    - `edgeMtls` : certificat client de la passerelle locale.
  contact:
    name: Équipe plateforme cashless
    email: api@cashless.test
  license:
    name: Propriétaire
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.cashless.test/v1
    description: API centrale
  - url: https://edge.local:8443/v1
    description: Passerelle locale (LAN du site), sous-ensemble x-edge-available
tags:
  - name: Terminaux
    description: Enrôlement (sans MDM, ADR-69), jetons d'appareil, configuration, battement de cœur, back-office des terminaux (liste, consultation, suspension, réactivation, révocation, codes d'enrôlement en cours).
  - name: Bracelets
    description: Lecture de bracelet (tap), clés d'authentification NFC, activation, caution, restitution.
  - name: Paiements
    description: Paiement en ligne par bracelet ou QR client, annulation (REVERSAL).
  - name: Recharges
    description: Recharge en espèces en caisse (TOPUP_CASH) et recharge PSP (TOPUP).
  - name: Webhooks PSP
    description: Notifications entrantes Wave, Orange Money, carte (source PSP_WEBHOOK).
  - name: Hors ligne
    description: Snapshot signé, lots d'opérations hors ligne, état des séquences.
  - name: Intentions de paiement
    description: '**V2 — hors périmètre V1 (ADR-43).** Intégration des POS tiers (création, capture, annulation, webhooks sortants).'
  - name: Demandes de paiement QR
    description: payment_request MERCHANT_QR et CUSTOMER_QR.
  - name: App client
    description: Authentification, portefeuilles, historique, rattachement de bracelet, remboursement.
  - name: Remboursements
    description: Traitement des demandes de remboursement et des réclamations tardives par le back-office.
  - name: Approbations
    description: Demandes d'approbation du back-office (deux personnes, ADR-74) — liste, consultation, approbation et exécution, refus.
  - name: Personnes
    description: Personnes du personnel, attributions de rôles par portée, administrateurs de la plateforme.
  - name: Guichet
    description: Sessions de caisse et identification des festivaliers (KYC) au guichet.
  - name: Passerelle
    description: Autorité de débit CENTRAL ↔ EDGE, réplication et resynchronisation de la passerelle.
  - name: Webhooks sortants
    description: '**V2 — hors périmètre V1 (ADR-43).** Abonnements des POS tiers aux événements.'
  - name: Plateforme
    description: Profils de législation, prestataires, contrats et redevances de la plateforme — réservé à `PLATFORM_ADMIN` (rôle de base de la plateforme, §2.2).
  - name: Organisation
    description: Organisateurs, commerçants et contrats prestataire–organisateur d'un prestataire.
  - name: Événements
    description: Événements, statuts (§12.1), participations des commerçants et points de vente.
  - name: Configuration
    description: Cascade de configuration versionnée (§4.2), configuration résolue, règles de frais (§5.6).
  - name: Vendeurs
    description: Vendeurs d'un commerçant (PIN de 6 chiffres vérifié par le serveur) et sessions de vendeur sur un terminal (mission 5b).
  - name: Catalogue
    description: Catalogue versionné d'un point de vente (catégories, articles, prix TTC, taux de taxe) et délégation de sa gestion au commerçant (mission 5b).

security:
  - humanBearer: []

paths:
  # ---------------------------------------------------------------- Terminaux
  /device-enrollment-codes:
    post:
      tags: [Terminaux]
      operationId: createDeviceEnrollmentCode
      summary: Créer un code d'enrôlement à usage unique
      description: |
        Réservé à `OPERATOR_ADMIN` (tout le prestataire) / `ORGANIZER_ADMIN` (événements de son organisateur).
        Pas de MDM (ADR-69) : le code est affiché en QR dans le
        back-office et scanné par l'app du terminal, ou saisi à la main. Usage unique, durée de vie courte (défaut 24 h,
        bornes 5 min à 7 jours), lié au prestataire, à un événement (obligatoire : tout terminal est affecté à un
        événement), et optionnellement à un point de vente.
        Code de 12 caractères (alphabet de 32 sans ambiguïté, 60 bits), affiché `XXXX-XXXX-XXXX` ; le serveur n'en
        garde qu'une empreinte HMAC-SHA256. Le code part une seule fois : un rejeu de la même clé d'idempotence ne le
        renvoie pas (route `transient`, refus au rejeu), et il n'apparaît dans aucun journal ni ligne d'audit.
        `personal_phone` est obligatoire, sans défaut (choix de l'administrateur) ; `true` impose
        `app_mode = KEYPAD_TPE` (sinon `422 DEVICE_MODE_NOT_ALLOWED`) et une politique effective sans hors ligne, sans
        recharge, remboursement ni caution.
        `app_mode = PAIRED_TPE` (V2, ADR-43) est refusé en V1 : `422 DEVICE_MODE_NOT_ALLOWED`. Durée hors bornes :
        `422 VALIDATION_FAILED`. Événement ou point de vente d'un autre prestataire, ou hors du périmètre de la
        personne : `404`.
        État de l'événement (OP-N74, FR-024) : événement `CLOSED` ou point de vente supprimé, ou, dès `CLOSING`,
        mode `CATALOG_POS` ou `KEYPAD_TPE` (le mode `TOPUP_DESK` reste permis jusqu'à `CLOSED`) :
        `422 ENROLLMENT_EVENT_CLOSED` (`CL031`), rien n'est écrit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCodeCreate'
            example:
              event_id: 7b1e4a52-8f0c-4c1d-9d3e-2a6b0f1c9e11
              pos_id: 0c6f0d7e-11aa-4b8b-9c3e-5d2f1a7b8c90
              app_mode: CATALOG_POS
              kind: POS
              personal_phone: false
              expires_in_seconds: 86400
      responses:
        '201':
          description: Code créé (affiché une seule fois).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCode'
              example:
                enrollment_code_id: 5a0c2c1e-0b9d-4b1e-8f7f-3f0e8d1d2c33
                code: K7PQ-4XZM-9RTA
                expires_at: '2026-12-10T08:00:00Z'
                app_mode: CATALOG_POS
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags: [Terminaux]
      operationId: listDeviceEnrollmentCodes
      summary: Lister les codes d'enrôlement en cours (back-office)
      description: |
        Codes non expirés et non utilisés du prestataire : portée (événement, point de vente, mode, téléphone
        personnel), auteur, création et expiration. Le code lui-même n'est jamais renvoyé (seule son empreinte est
        gardée). Rôles : `OPERATOR_ADMIN` (tout le prestataire) ; `ORGANIZER_ADMIN` (codes des événements de son
        organisateur). Pagination par curseur.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: event_id
          in: query
          required: false
          description: Codes de cet événement.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page de codes en cours.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnrollmentCodePage'
              example:
                data:
                  - enrollment_code_id: 5a0c2c1e-0b9d-4b1e-8f7f-3f0e8d1d2c33
                    event_id: 7b1e4a52-8f0c-4c1d-9d3e-2a6b0f1c9e11
                    pos_id: 0c6f0d7e-11aa-4b8b-9c3e-5d2f1a7b8c90
                    station_name: null
                    app_mode: CATALOG_POS
                    kind: POS
                    personal_phone: false
                    created_by: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    created_at: '2026-12-09T08:00:00Z'
                    expires_at: '2026-12-10T08:00:00Z'
                next_cursor: null
                has_more: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /device-enrollments:
    post:
      tags: [Terminaux]
      operationId: enrollDevice
      summary: Enrôler un terminal (code à usage unique → identité d'appareil)
      description: |
        Ordre imposé côté terminal : il scanne (ou saisit) le code d'enrôlement **avant** de générer ses clés, car
        les défis d'attestation dérivent du code. Il génère alors dans le matériel sécurisé (Android Keystore,
        StrongBox si disponible ; iOS Secure Enclave) une clé de signature ECDSA P-256 non exportable et une clé
        d'accord ECDH P-256 (chiffrement des PWD/PACK et du snapshot), puis envoie les clés publiques, les preuves
        d'attestation et un CSR PKCS#10 signé par la clé de signature.
        Défis (champs de longueur fixe ou préfixés par leur longueur ; `code` = code normalisé) :
        - Android (12 au moins, attestation KeyMint) : un défi par clé, fixé à sa génération
          (`setAttestationChallenge`). Clé d'accord : `A = SHA-256("cashless-enroll-v1/agree" ‖ code ‖ serial)` ;
          clé de signature : `S = SHA-256("cashless-enroll-v1/sign" ‖ code ‖ serial ‖ SPKI de la clé d'accord)`.
          `key_attestation_chain` atteste la clé de signature, `agreement_attestation_chain` la clé d'accord.
        - iOS (App Attest) : `clientDataHash = SHA-256("cashless-enroll-v1/ios" ‖ code ‖ serial ‖ SPKI signature ‖
          SPKI accord)` ; la clé App Attest est distincte des deux clés enregistrées.
        Le serveur vérifie dans cet ordre : corps ; clés (SPKI P-256, point sur la courbe) ; code (lecture seule) ;
        mode ; défis ; attestation (clé dans le matériel sécurisé, générée et non importée, bootloader verrouillé,
        application signée et intacte) ; CSR (clé = `signing_public_key`, signature valide). Puis, dans une seule
        transaction, il verrouille le code, revérifie usage et expiration, crée `device` (status `ACTIVE`, affectation
        et `personal_phone` repris du code), consomme le code et crée la famille de jetons. Il renvoie le certificat
        client (mTLS, toujours présent), un jeton d'appareil et un jeton de rafraîchissement.
        Un échec avant cette transaction ne consomme pas le code.
        `next_seq` indique le premier numéro de séquence utilisable (jamais inférieur à `last_seq + 1` du même
        `serial` dans le prestataire, voir sync_protocol.md §3).
        Pas de MDM (ADR-69) : un téléphone personnel (`device.personal_phone = true`) n'a jamais le hors ligne
        (`offline_enabled = false` dans sa politique effective).
        Refus : code inconnu ou déjà utilisé (`422 ENROLLMENT_CODE_INVALID`, réponse identique et en temps
        comparable), expiré (`422 ENROLLMENT_CODE_EXPIRED`), attestation ou CSR non conforme
        (`422 ATTESTATION_FAILED`, y compris Android antérieur à 12), mode d'application `PAIRED_TPE` (V2, ADR-43),
        `TOPUP_DESK` sur iOS, ou téléphone personnel hors `KEYPAD_TPE` (`422 DEVICE_MODE_NOT_ALLOWED`) ;
        `serial` d'un terminal non révoqué du même prestataire (`409 DEVICE_SERIAL_IN_USE`) ; événement du code
        `CLOSED` ou point de vente supprimé, ou, dès `CLOSING`, mode `CATALOG_POS` ou `KEYPAD_TPE` (OP-N74,
        FR-024 ; `TOPUP_DESK` permis jusqu'à `CLOSED`) : `422 ENROLLMENT_EVENT_CLOSED` (`CL031`), rien n'est écrit
        et le code n'est pas consommé.
        Limites : 10 essais par code et par heure, 30 essais par adresse et par heure ; au-delà `429 RATE_LIMITED`
        avec `Retry-After`. Chaque essai, réussi ou non, compte.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnrollmentRequest'
            example:
              enrollment_code: K7PQ-4XZM-9RTA
              serial: TPE-FOOD-02
              os: ANDROID
              app_version: 1.4.2
              signing_public_key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE4Zm2Lq9c0kqg8n1dXo3f0cC1mW3Qq1l3Zt6m2xY3fQ9m8u0X4bP0dL2c7aQ5eR9tY1uI3oP5aS7dF9gH1jK3lA==
              agreement_public_key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEq1l3Zt6m2xY3fQ9m8u0X4bP0dL2c7aQ5eR9tY1uI3oP5aS7dF9gH1jK3lA4Zm2Lq9c0kqg8n1dXo3f0cC1mW3Q==
              key_attestation_chain:
