  /operators/{operator_id}/fee-rules:
    get:
      tags: [Configuration]
      operationId: listFeeRules
      summary: Lister les règles de frais d'un prestataire
      description: |
        Règles des portées `OPERATOR_CONTRACT`, `EVENT` et `PARTICIPATION` (§5.6), en vigueur et fermées ; filtres
        facultatifs par portée. Les redevances de plateforme se lisent par `listPlatformFeeRules`. Rôles :
        `OPERATOR_ADMIN` ; `ORGANIZER_ADMIN` (portées de son organisateur).
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - name: scope_type
          in: query
          required: false
          description: 'Type de portée.'
          schema:
            $ref: '#/components/schemas/FeeRuleScopeType'
        - name: scope_id
          in: query
          required: false
          description: 'Objet de la portée (contrat, événement, participation).'
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Page de règles de frais.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeRule'
                  next_cursor:
                    type:
                      - string
                      - 'null'
                  has_more:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Configuration]
      operationId: createFeeRule
      summary: Créer une règle de frais
      description: |
        Rôle selon la portée : `OPERATOR_CONTRACT` (prestataire → organisateur) : `OPERATOR_ADMIN` ; `EVENT` et
        `PARTICIPATION` (organisateur → commerçant, frais festivalier) : `ORGANIZER_ADMIN` ; `PSP_CONFIGURATION`
        (frais PSP d'une configuration de paiement) : `OPERATOR_ADMIN`. `PLATFORM_CONTRACT` est
        refusée ici (`403`, `createPlatformFeeRule`). `tax_code` doit être une taxe du profil de législation de la
        portée. Règle en vigueur de même portée, payeur, bénéficiaire et assiette : `409 CONFLICT_STATE` (la
        remplacer). Événement visé `LIVE` : opération à deux personnes (`202`, action `FEE_RULE_CHANGE`). Journalisé
        (`FEE_RULE_CREATED`).
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeRuleCreate'
      responses:
        '201':
          description: Règle créée.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
            Location:
              description: '`/v1/operators/{operator_id}/fee-rules`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeRule'
        '202':
          $ref: '#/components/responses/ApprovalRequestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /operators/{operator_id}/fee-rules/{fee_rule_id}/replacements:
    post:
      tags: [Configuration]
      operationId: replaceFeeRule
      summary: Remplacer une règle de frais
      description: |
        Une règle ne se modifie jamais (§5.6) : dans une seule transaction, l'ancienne est fermée (`valid_to` = date
        d'effet de la nouvelle) et la nouvelle est créée (version + 1). Portée, payeur, bénéficiaire et assiette
        restent ceux de la règle remplacée (sinon `422`). Règle déjà fermée : `409 CONFLICT_STATE`. Même rôle que pour
        la créer ; une redevance de plateforme : `PLATFORM_ADMIN`. Événement visé `LIVE` : `202` (`FEE_RULE_CHANGE`).
        Journalisé (`FEE_RULE_REPLACED`, ancienne et nouvelle).
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/FeeRuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeRuleCreate'
      responses:
        '201':
          description: Nouvelle version de la règle.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
            Location:
              description: '`/v1/operators/{operator_id}/fee-rules`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeRule'
        '202':
          $ref: '#/components/responses/ApprovalRequestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /operators/{operator_id}/tag-keys:
    get:
      tags: [Bracelets]
      operationId: listTagKeys
      x-process: public
      summary: Lister les clés de bracelet d'un prestataire
      description: |
        Clés de dérivation du prestataire (`tag_key`, §7.3), par index. La référence de la clé dans le service de clés n'est
        rendue que tronquée ; aucune clé de données chiffrée n'est rendue. Rôle : `OPERATOR_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Page de clés.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagKey'
                  next_cursor:
                    type:
                      - string
                      - 'null'
                  has_more:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Bracelets]
      operationId: requestTagKey
      x-process: public
      summary: Demander une nouvelle clé de bracelet (à deux)
      description: |
        Crée une demande d'approbation (`TAG_KEY_CREATE`). Une fois approuvée par un second `OPERATOR_ADMIN`, un travail
        `CREATE_KEY` est inscrit ; la clé est créée dans le service de clés par la commande d'administration, lancée par
        l'exploitant : aucun service permanent ne peut créer une clé. Le nouvel index est le suivant du prestataire ; pour une
        clé partagée, la clé partagée active précédente ne sert plus qu'à déchiffrer (§7.3). Une clé dédiée (`DEDICATED`) est
        réservée à un événement du prestataire (§7.7). Rôle : `OPERATOR_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagKeyRequest'
      responses:
        '202':
          $ref: '#/components/responses/ApprovalRequestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

