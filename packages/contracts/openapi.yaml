    PageMeta:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
    Amount:
      type: integer
      format: int64
      minimum: 1
      description: Montant strictement positif en unités mineures de la devise.
    SignedAmount:
      type: integer
      format: int64
      description: Montant signé en unités mineures.
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Code ISO 4217 (devise unique de l'événement).
      examples: [XOF]
    Hex32:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: 32 octets en hexadécimal minuscule.
    NfcUid:
      type: string
      pattern: '^[0-9a-f]{14}$'
      description: UID constructeur 7 octets en hexadécimal minuscule.
    Timestamp:
      type: string
      format: date-time
    TransactionType:
      type: string
      description: Liste fermée des types du grand livre (contrainte CHECK de journal_transaction.type ; voir SPECIFICATION.md).
      enum: [TOPUP, TOPUP_CASH, PROMO_CREDIT, PROMO_EXPIRY, ACTIVATION_FEE, DEPOSIT_TAKEN, DEPOSIT_REFUNDED,
             DEPOSIT_FORFEITED, PURCHASE, REVERSAL, PITCH_FEE, OPERATOR_FEE, PLATFORM_FEE, ANOMALY_RESOLUTION,
             CASH_CLOSE, CASH_DEPOSIT, PSP_SETTLEMENT, CHARGEBACK, WALLET_REFUND, BREAKAGE, PAYOUT_INITIATED,
             PAYOUT_CONFIRMED, PAYOUT_FAILED, ADJUSTMENT, MERCHANT_DEBT_TRANSFER, BREAKAGE_REVERSAL]
    TransactionSource:
      type: string
      enum: [ONLINE, OFFLINE_SYNC, EDGE_SYNC, PSP_WEBHOOK, BATCH, BACKOFFICE]
    Balance:
      type: object
      required: [spendable, paid, promo]
      properties:
        spendable:
          type: integer
          format: int64
          description: Solde disponible = paid + promo (wallet_spendable).
        paid:
          type: integer
          format: int64
          description: Crédits payés (WALLET_PAID), remboursables.
        promo:
          type: integer
          format: int64
          description: Crédits offerts (WALLET_PROMO), non remboursables.

    # ------------------------------------------------------------ Terminaux
    DeviceAppMode:
      type: string
      description: |
        Mode d'application du terminal. `PAIRED_TPE` (TPE associé à une caisse tierce) est **V2 (ADR-43)** :
        valeur conservée pour la compatibilité future, mais toute création de code d'enrôlement ou tout
        enrôlement avec cette valeur est refusé en V1 (`422 DEVICE_MODE_NOT_ALLOWED`) ; la base ne l'accepte pas.
      enum: [CATALOG_POS, KEYPAD_TPE, TOPUP_DESK, PAIRED_TPE]
    DeviceKind:
      type: string
      enum: [POS, TOPUP]
    DeviceStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, REVOKED]
    DeviceAdmin:
      type: object
      description: |
        Terminal vu du back-office (nommé comme `MediaAdmin` : `Device` désigne déjà, dans les types Dart, l'objet
        `device` de `DeviceConfig`). Ne porte JAMAIS de clé publique (`public_key`), de clé d'accord
        (`agreement_public_key`), d'empreinte de certificat (`cert_sha256`) ni de jeton.
      required: [device_id, serial, kind, app_mode, os, personal_phone, nfc_enabled, status, status_reason, event_id, pos_id, station_name, app_version, attestation_kind, attestation_security_level, enrolled_at, last_seen_at, cert_not_after]
      properties:
        device_id:
          type: string
          format: uuid
        serial:
          type: string
        kind:
          $ref: '#/components/schemas/DeviceKind'
        app_mode:
          $ref: '#/components/schemas/DeviceAppMode'
        os:
          type: string
          enum: [ANDROID, IOS]
        personal_phone:
          type: boolean
        nfc_enabled:
          type: boolean
        provided_by:
          type: string
          enum: [PLATFORM, OPERATOR, ORGANIZER, MERCHANT]
        status:
          $ref: '#/components/schemas/DeviceStatus'
        status_reason:
          type: [string, 'null']
          description: Motif du dernier changement de statut.
        event_id:
          type: [string, 'null']
          format: uuid
        pos_id:
          type: [string, 'null']
          format: uuid
        station_name:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
          description: Version de l'app à l'enrôlement, mise à jour par le battement de cœur.
        attestation_kind:
          type: [string, 'null']
          enum: [ANDROID_KEY_ATTESTATION, IOS_APP_ATTEST, null]
          description: Preuve d'attestation vérifiée à l'enrôlement (`null` pour un terminal antérieur à la mission).
        attestation_security_level:
          type: [string, 'null']
          enum: [TRUSTED_ENVIRONMENT, STRONGBOX, null]
          description: 'Android : niveau de sécurité de la clé attestée ; iOS : `null`.'
        enrolled_at:
          type: [string, 'null']
          format: date-time
        last_seen_at:
          type: [string, 'null']
          format: date-time
        cert_not_after:
          type: [string, 'null']
          format: date-time
          description: Fin de validité du certificat client.
    DeviceStatusHistoryEntry:
      type: object
      description: Changement de statut d'un terminal (ajout seul).
      required: [from_status, to_status, reason, actor_id, at]
      properties:
        from_status:
          type: [string, 'null']
          enum: [ACTIVE, SUSPENDED, REVOKED, null]
          description: '`null` pour l''enrôlement.'
        to_status:
          $ref: '#/components/schemas/DeviceStatus'
        reason:
          type: [string, 'null']
        actor_id:
          type: [string, 'null']
          format: uuid
          description: Personne auteur du changement (`null` pour l'enrôlement).
        at:
          $ref: '#/components/schemas/Timestamp'
    DeviceAdminDetail:
      description: Terminal et historique de ses statuts (du plus récent au plus ancien).
      allOf:
        - $ref: '#/components/schemas/DeviceAdmin'
        - type: object
          required: [status_history]
          properties:
            status_history:
              type: array
              items:
                $ref: '#/components/schemas/DeviceStatusHistoryEntry'
    DevicePage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAdmin'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    DeviceStatusChangeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Motif du changement de statut (historique et audit).
    DeviceEnrollmentCodeSummary:
      type: object
      description: Code d'enrôlement en cours, vu du back-office. Ne porte JAMAIS le code ni son empreinte.
      required: [enrollment_code_id, event_id, pos_id, station_name, app_mode, kind, personal_phone, created_by, created_at, expires_at]
      properties:
        enrollment_code_id:
          type: string
          format: uuid
        event_id:
          type: [string, 'null']
          format: uuid
        pos_id:
          type: [string, 'null']
          format: uuid
        station_name:
          type: [string, 'null']
        app_mode:
          type: [string, 'null']
          enum: [CATALOG_POS, KEYPAD_TPE, TOPUP_DESK, null]
        kind:
          type: [string, 'null']
          enum: [POS, TOPUP, null]
        personal_phone:
          type: boolean
        created_by:
          type: string
          format: uuid
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    DeviceEnrollmentCodePage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceEnrollmentCodeSummary'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    EnrollmentCodeCreate:
      type: object
      description: |
        Création d'un code d'enrôlement (`createDeviceEnrollmentCode`). `event_id` est obligatoire : tout terminal
        est affecté à un événement (condition de `DeviceConfig`). `personal_phone` est obligatoire et sans défaut.
      required: [event_id, app_mode, kind, personal_phone]
      properties:
        event_id:
          type: string
          format: uuid
          description: Événement du terminal (même prestataire ; pour `ORGANIZER_ADMIN`, un événement de son organisateur).
        pos_id:
          type: string
          format: uuid
        station_name:
          type: string
        app_mode:
          $ref: '#/components/schemas/DeviceAppMode'
        kind:
          $ref: '#/components/schemas/DeviceKind'
        provided_by:
          type: string
          enum: [PLATFORM, OPERATOR, ORGANIZER, MERCHANT]
          default: OPERATOR
          description: Qui fournit le terminal ; désigne qui porte la perte d'une opération non conforme (ADR-58).
        personal_phone:
          type: boolean
          description: |
            Téléphone personnel (sans MDM) : choix obligatoire de l'administrateur, sans défaut (un défaut `false`
            donnerait le hors ligne par oubli). `true` impose `app_mode = KEYPAD_TPE` (sinon
            `422 DEVICE_MODE_NOT_ALLOWED`) et une politique effective sans hors ligne, sans recharge, remboursement
            ni caution. Le terminal ne le déclare jamais lui-même.
        expires_in_seconds:
          type: integer
          minimum: 300
          maximum: 604800
          default: 86400
          description: Durée de validité du code, de 5 min à 7 jours (défaut 24 h) ; hors bornes `422 VALIDATION_FAILED`.
    EnrollmentCode:
      type: object
      required: [enrollment_code_id, code, expires_at, app_mode]
      properties:
        enrollment_code_id:
          type: string
          format: uuid
        code:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        app_mode:
          $ref: '#/components/schemas/DeviceAppMode'
    DeviceEnrollmentRequest:
      type: object
      description: |
        Demande d'enrôlement. Le code est scanné AVANT la génération des clés : les défis d'attestation en dérivent
        (voir `enrollDevice`). Android : version 12 au moins, deux chaînes d'attestation (une par clé), défis
        `A` (clé d'accord) et `S` (clé de signature). iOS : objet App Attest dans `key_attestation_chain`, défi
        `clientDataHash` qui lie le code, le `serial` et les deux clés publiques.
      required: [enrollment_code, serial, os, app_version, signing_public_key, agreement_public_key, key_attestation_chain, csr_pem]
      if:
        properties:
          os:
            const: ANDROID
        required: [os]
      then:
        required: [agreement_attestation_chain]
      properties:
        enrollment_code:
          type: string
        serial:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,64}$'
          description: Numéro de série logique du terminal (préfixe des clés d'idempotence).
        os:
          type: string
          enum: [ANDROID, IOS]
        app_version:
          type: string
        signing_public_key:
          type: string
          contentEncoding: base64
          description: |
            Clé publique ECDSA P-256 : SubjectPublicKeyInfo DER canonique (point non compressé, 91 octets) →
            `device.public_key`. Le serveur réencode la clé et exige les mêmes octets ; les défis hachent ces
            octets tels quels.
        agreement_public_key:
          type: string
          contentEncoding: base64
          description: |
            Clé publique ECDH P-256 pour le chiffrement des PWD/PACK : SubjectPublicKeyInfo DER canonique (point
            non compressé, 91 octets), même forme sur Android et iOS. Le serveur réencode la clé et exige les
            mêmes octets ; les défis `S` (Android) et `clientDataHash` (iOS) hachent ces octets tels quels. Le
            serveur garde le point non compressé de 65 octets qu'ils contiennent (`device.agreement_public_key`).
        key_attestation_chain:
          type: array
          minItems: 1
          items:
            type: string
            contentEncoding: base64
          description: |
            Android : chaîne d'attestation de clé (KeyMint) de la clé de signature, feuille en tête, générée avec le
            défi `S`. iOS : objet d'attestation App Attest (défi `clientDataHash`).
        agreement_attestation_chain:
          type: array
          minItems: 1
          items:
            type: string
            contentEncoding: base64
          description: |
            Android (obligatoire quand `os = ANDROID`) : chaîne d'attestation de clé (KeyMint) de la clé d'accord,
            feuille en tête, générée avec le défi `A`. iOS : absent (la clé d'accord est liée par
            `clientDataHash`).
        csr_pem:
          type: string
          description: |
            CSR PKCS#10 (PEM) signé par la clé de signature, dont la clé publique est `signing_public_key` ; sinon
            `422 ATTESTATION_FAILED`. Obligatoire : le certificat client (mTLS) est l'une des trois preuves.
    DeviceEnrollmentResponse:
      type: object
      required: [device_id, serial, certificate_pem, access_token, token_type, expires_in, refresh_token, next_seq, server_time]
      properties:
        device_id:
          type: string
          format: uuid
        serial:
          type: string
        certificate_pem:
          type: string
          description: Certificat client X.509 (PEM) émis par l'autorité des terminaux, à présenter en mTLS.
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
        next_seq:
          type: integer
          format: int64
          minimum: 1
        server_time:
          $ref: '#/components/schemas/Timestamp'
    DeviceTokenRefreshRequest:
      type: object
      required: [serial, refresh_token, nonce, signature]
      description: |
        Bornes identiques à celles du serveur (`refresh.dto.ts`, ADR-118) : un champ hors de son motif est refusé
        en `400 VALIDATION_FAILED`. Aucun champ ne peut contenir l'octet nul : le découpage du message signé est
        unique.
      properties:
        serial:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,64}$'
        refresh_token:
          type: string
          description: Jeton de rafraîchissement reçu (`drt_` puis 256 bits en base64url), 16 à 128 caractères.
          pattern: '^[A-Za-z0-9_-]{16,128}$'
          minLength: 16
          maxLength: 128
        nonce:
          type: string
          description: Nonce choisi par le terminal, 16 à 64 caractères base64 ou base64url.
          pattern: '^[A-Za-z0-9+/=_-]{16,64}$'
          minLength: 16
          maxLength: 64
        signature:
          type: string
          contentEncoding: base64
          maxLength: 256
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          description: |
            Preuve de possession : signature ECDSA P-256 / SHA-256, par la clé de signature du terminal, de
            `"cashless-refresh-v1" ‖ 0x00 ‖ nonce ‖ 0x00 ‖ serial ‖ 0x00 ‖ refresh_token` (octets UTF-8), au
            format brut `r ‖ s` de 64 octets (`ieee-p1363`, comme la signature des requêtes), en base64 (88
            caractères). Une signature qui n'est pas du base64 : `400` ; d'une autre longueur, ou invalide :
            `401 REFRESH_TOKEN_INVALID`.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
    OfflinePolicy:
      type: object
      description: Politique hors ligne EFFECTIVE (effective_offline_policy) ; 0 = interdit.
      required: [offline_enabled, max_per_sale, max_per_media_per_device, max_total_per_device, max_snapshot_age_seconds, cash_topup_offline, capped]
      properties:
        offline_enabled:
          type: boolean
        max_per_sale:
          type: integer
          format: int64
          minimum: 0
        max_per_media_per_device:
          type: integer
          format: int64
          minimum: 0
        max_total_per_device:
          type: integer
          format: int64
          minimum: 0
        max_snapshot_age_seconds:
          type: integer
          minimum: 0
          default: 900
          description: |
            Âge maximal du snapshot pour autoriser hors ligne (paramètre `max_snapshot_age`, défaut 900 s =
            15 min). Au-delà, le terminal refuse toute nouvelle opération hors ligne (sync_protocol.md §4.3).
        cash_topup_offline:
          type: boolean
        capped:
          type: boolean
          description: Vrai si le plafond prestataire a réduit une valeur demandée.
    DebitAuthority:
      type: object
      required: [ledger_id, authority, epoch, edge_gateway_id, edge_base_url]
      properties:
        ledger_id:
          type: string
          format: uuid
        authority:
          type: string
          enum: [CENTRAL, EDGE]
        epoch:
          type: integer
          format: int64
          description: Époque d'autorité, incrémentée à chaque bascule (jeton d'exclusion).
        edge_gateway_id:
          type:
            - string
            - 'null'
          format: uuid
        edge_base_url:
          type:
            - string
            - 'null'
          format: uri
    CatalogItem:
      type: object
      required: [product_id, name, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
        unit_price:
          $ref: '#/components/schemas/Amount'
        category:
          type: string
        vat_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
    DeviceConfig:
      type: object
      required: [config_id, device, event, offline_policy, snapshot_keys, debit_authority, seq, server_time, clock_tolerance_seconds, terminal_settings]
      properties:
        terminal_settings:
          type: object
          description: Réglages de fonctionnement de l'événement (ADR-61, SPECIFICATION §9.8), bornés par la base.
          required: [online_connect_timeout_ms, online_total_timeout_ms, online_retries, pending_sync_seconds, reconcile_sync_seconds, heartbeat_seconds, reversal_window_minutes, local_retention_days, tap_replay_window_seconds]
          properties:
            online_connect_timeout_ms: {type: integer, minimum: 1000, maximum: 5000, default: 2000}
            online_total_timeout_ms: {type: integer, minimum: 2000, maximum: 6000, default: 3000}
            online_retries: {type: integer, minimum: 0, maximum: 3, default: 2}
            pending_sync_seconds: {type: integer, minimum: 10, maximum: 300, default: 30}
            reconcile_sync_seconds: {type: integer, minimum: 60, maximum: 1800, default: 300}
            heartbeat_seconds: {type: integer, minimum: 30, maximum: 300, default: 60}
            reversal_window_minutes: {type: integer, minimum: 0, maximum: 60, default: 15}
            local_retention_days: {type: integer, minimum: 7, maximum: 30, default: 7}
            tap_replay_window_seconds: {type: integer, minimum: 0, maximum: 600, default: 120}
        config_id:
          type: integer
          format: int64
          description: |
            Identifiant de la configuration servie (`device_config_served.id`), stable tant que la politique
            effective, l'époque et le plancher de séquence ne changent pas. Le terminal le recopie dans chaque
            opération qu'il autorise hors ligne (`OfflineOperation.config_id`, champ d'état non chaîné, comme
            `snapshot_version`) : le serveur contrôle les plafonds de CETTE configuration (sync_protocol.md §7.2).
        device:
          type: object
          required: [device_id, serial, kind, app_mode, os, nfc_enabled, status]
          properties:
            device_id:
              type: string
              format: uuid
            serial:
              type: string
            kind:
              $ref: '#/components/schemas/DeviceKind'
            app_mode:
              $ref: '#/components/schemas/DeviceAppMode'
            os:
              type: string
              enum: [ANDROID, IOS]
            nfc_enabled:
              type: boolean
            status:
              $ref: '#/components/schemas/DeviceStatus'
            station_name:
              type:
                - string
                - 'null'
        event:
          type: object
          required: [event_id, name, currency, minor_units, timezone, status, activation_modes]
          properties:
            event_id:
              type: string
              format: uuid
            name:
              type: string
            currency:
              $ref: '#/components/schemas/Currency'
            minor_units:
              type: integer
              minimum: 0
              maximum: 3
            timezone:
              type: string
            status:
              type: string
              enum: [DRAFT, LIVE, CLOSING, RECONCILING, SETTLING, REFUND_WINDOW, CLOSED]
            activation_modes:
              type: array
              items:
                type: string
                enum: [DESK, SELF_APP, FIRST_TOPUP]
        pos:
          type:
            - object
            - 'null'
          properties:
            pos_id:
              type: string
              format: uuid
            name:
              type: string
            merchant_name:
              type: string
        catalog:
          type:
            - object
            - 'null'
          description: |
            Présent pour CATALOG_POS ; absent (null) pour KEYPAD_TPE / TOPUP_DESK. `version` = dernière version du
            catalogue du point de vente du terminal, servie et mémorisée pour ce terminal (le contrôle des prix d'une
            vente admet la version courante et la dernière version servie) ; `items` = articles actifs de cette
            version, `name` et `category` dans la langue de `Accept-Language`. Terminal sans point de vente ou point
            de vente sans catalogue : `version` 0, `items: []`. Une nouvelle version change l'`ETag` de la
            configuration.
          properties:
            version:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/CatalogItem'
        offline_policy:
          $ref: '#/components/schemas/OfflinePolicy'
        snapshot_keys:
          type: array
          description: |
            Clés publiques valides pour vérifier les snapshots (rotation par `key_id`), au plus deux par
            signataire : le central (clé dans le KMS/HSM) et chaque passerelle (clé propre, hors KMS, dans son
            stockage matériel, `key_id` distinct) — sync_protocol.md §4.1.
          items:
            type: object
            required: [key_id, algorithm, public_key]
            properties:
              key_id:
                type: string
              algorithm:
                type: string
                enum: [ECDSA_P256_SHA256, Ed25519]
                description: '`ECDSA_P256_SHA256` par défaut ; Ed25519 si le KMS le permet (POINTS_OUVERTS OP-N13).'
              public_key:
                type: string
                contentEncoding: base64
              not_after:
                $ref: '#/components/schemas/Timestamp'
        debit_authority:
          $ref: '#/components/schemas/DebitAuthority'
        seq:
          type: object
          required: [next_seq_floor, contiguous_acked_seq]
          properties:
            next_seq_floor:
              type: integer
              format: int64
              description: Le terminal DOIT utiliser seq ≥ max(local + 1, next_seq_floor).
            contiguous_acked_seq:
              type: integer
              format: int64
        server_time:
          $ref: '#/components/schemas/Timestamp'
        clock_tolerance_seconds:
          type: integer
          default: 120
    HeartbeatRequest:
      type: object
      required: [device_time, last_local_seq, pending_operations]
      properties:
        device_time:
          $ref: '#/components/schemas/Timestamp'
        snapshot_version:
          type:
            - integer
            - 'null'
          format: int64
        last_local_seq:
          type: integer
          format: int64
        pending_operations:
          type: integer
        pending_exposure:
          type: integer
          format: int64
          description: Somme des débits hors ligne non acquittés.
        battery_percent:
          type: integer
          minimum: 0
          maximum: 100
        app_version:
          type: string
    HeartbeatResponse:
      type: object
      required: [server_time, config_etag, latest_snapshot_version, debit_authority, sync_requested]
      properties:
        server_time:
          $ref: '#/components/schemas/Timestamp'
        config_etag:
          type: string
        latest_snapshot_version:
          type:
            - integer
            - 'null'
          format: int64
        debit_authority:
          $ref: '#/components/schemas/DebitAuthority'
        sync_requested:
          type: boolean
          description: Le serveur demande l'envoi immédiat des opérations en attente.
    SeqStatus:
      type: object
      required: [device_serial, contiguous_acked_seq, max_seen_seq, missing_seqs, next_seq_floor]
      properties:
        device_serial:
          type: string
        contiguous_acked_seq:
          type: integer
          format: int64
        max_seen_seq:
          type: integer
          format: int64
        missing_seqs:
          type: array
          items:
            type: integer
            format: int64
        next_seq_floor:
          type: integer
          format: int64

    # ------------------------------------------------------------ Bracelets
    TapResultCode:
      type: string
      description: |
        Résultat de `register_tap` (champ `result`). `SIGNATURE_MISSING` n'existe qu'en ligne : hors ligne, une
        signature absente ouvre une anomalie `SIGNATURE_MISMATCH` et l'opération est gardée.
      enum: [OK, UNKNOWN, BLOCKED, UID_MISMATCH, SIGNATURE_MISMATCH, SIGNATURE_MISSING, CLONE_SUSPECTED, RETIRED, REPLACED, NOT_ACTIVATED, RELEASED, BATCH_INACTIVE, WRONG_EVENT]
    MediaStatus:
      type: string
      enum: [PERSONALIZED, ISSUED, ACTIVE, SUSPENDED, REPLACED, BLACKLISTED, RELEASED, RETIRED, DESTROYED]
    DepositStatus:
      type: string
      enum: [NONE, DUE, HELD, REFUNDED, FORFEITED]
    WalletStatus:
      type: string
      enum: [ACTIVE, BLOCKED, CLOSED]
    TapInput:
      type: object
      description: Lecture d'un bracelet MIFARE Ultralight EV1 (format B).
      required: [nfc_uid, token_hash, counter, key_index, pack_verified, occurred_at]
      properties:
        nfc_uid:
          $ref: '#/components/schemas/NfcUid'
        token_hash:
          $ref: '#/components/schemas/Hex32'
        counter:
          type: integer
          minimum: 0
          maximum: 16777215
          description: Valeur du compteur 24 bits lue par READ_CNT après INCR_CNT.
        key_index:
          type: integer
          minimum: 0
          maximum: 65535
        format_major:
          type: integer
          default: 1
        format_minor:
          type: integer
          default: 0
        pack_verified:
          type: boolean
          description: Le PACK renvoyé par le tag après PWD_AUTH correspond au PACK attendu. DOIT être true.
        originality_signature:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            Signature d'originalité NXP (READ_SIG, 32 octets), lue à chaque passage et vérifiée par le terminal
            (ADR-59). Le terminal DOIT l'envoyer. Le serveur la compare à celle de la personnalisation : différente
            → `SIGNATURE_MISMATCH` ; absente alors que la puce en a une → `SIGNATURE_MISSING` en ligne, anomalie
            `SIGNATURE_MISMATCH` hors ligne (opération gardée).
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    MediaAuthKeyRequest:
      type: object
      required: [nfc_uid, key_index]
      properties:
        nfc_uid:
          $ref: '#/components/schemas/NfcUid'
        key_index:
          type: integer
          minimum: 0
          maximum: 65535
    EncryptedBlob:
      type: object
      required: [nonce, ciphertext, tag]
      properties:
        alg:
          type: string
        epk:
          type: string
          description: Clé publique éphémère ECDH (point non compressé, base64url).
        nonce:
          type: string
          contentEncoding: base64
        ciphertext:
          type: string
          contentEncoding: base64
        tag:
          type: string
          contentEncoding: base64
    WrappedKey:
      type: object
      description: |
        Clé de contenu AES-256 (propre au snapshot) enveloppée pour la clé d'accord ECDH P-256 du terminal
        (ECDH-ES + HKDF-SHA256 + AES Key Wrap). Elle déchiffre les `pwd_pack_enc` des entrées.
      required: [alg, epk, wrapped_key]
      properties:
        alg:
          type: string
          const: ECDH-ES+HKDF-SHA256+A256KW
        epk:
          type: string
          description: Clé publique éphémère (base64url).
        wrapped_key:
          type: string
          contentEncoding: base64
    MediaAuthKey:
      type: object
      required: [nfc_uid, key_index, enc, ttl_seconds]
      properties:
        nfc_uid:
          $ref: '#/components/schemas/NfcUid'
        key_index:
          type: integer
        enc:
          $ref: '#/components/schemas/EncryptedBlob'
        ttl_seconds:
          type: integer
          description: Durée pendant laquelle le terminal peut garder le PWD en mémoire vive.
    WalletSummary:
      type: object
      required: [wallet_id, status, currency, spendable, paid, promo]
      properties:
        wallet_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WalletStatus'
        currency:
          $ref: '#/components/schemas/Currency'
        spendable:
          type: integer
          format: int64
        paid:
          type: integer
          format: int64
        promo:
          type: integer
          format: int64
    TapResponse:
      type: object
      required: [tap_id, result, tap_expires_at, media, wallet]
      properties:
        tap_id:
          type:
            - integer
            - 'null'
          format: int64
          description: media_tap.id ; null si la lecture n'a pas été enregistrée (UNKNOWN, RETIRED…).
        result:
          $ref: '#/components/schemas/TapResultCode'
        tap_expires_at:
          type:
            - string
            - 'null'
          format: date-time
        media:
          oneOf:
            - type: 'null'
            - type: object
              required: [media_id, status, deposit_status]
              properties:
                media_id:
                  type: string
                  format: uuid
                status:
                  $ref: '#/components/schemas/MediaStatus'
                batch_kind:
                  type: string
                  enum: [PUBLIC, STAFF, VIP]
                deposit_status:
                  $ref: '#/components/schemas/DepositStatus'
                deposit_held:
                  type: integer
                  format: int64
        wallet:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WalletSummary'
    Media:
      type: object
      required: [media_id, kind, status, key_index, deposit_status]
      properties:
        media_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [NFC_TAG, CARD, QR]
        chip_type:
          type: string
        nfc_uid:
          oneOf:
            - $ref: '#/components/schemas/NfcUid'
            - type: 'null'
        key_index:
          type: integer
        status:
          $ref: '#/components/schemas/MediaStatus'
        batch_id:
          type:
            - string
            - 'null'
          format: uuid
        batch_kind:
          type: string
          enum: [PUBLIC, STAFF, VIP]
        deposit_status:
          $ref: '#/components/schemas/DepositStatus'
        deposit_held:
          type: integer
          format: int64
        wallet_ids:
          type: array
          items:
            type: string
            format: uuid
        last_counter:
          type:
            - integer
            - 'null'
          format: int64
    MoneyMovement:
      type: object
      description: |
        Moyen d'encaissement / de restitution hors portefeuille. Pour un remboursement : jamais `CARD` en V1 ;
        mobile money vers un numéro autre que le numéro vérifié du titulaire : conditions d'ADR-76.
      required: [method]
      properties:
        method:
          type: string
          enum: [CASH, WAVE, ORANGE_MONEY, CARD]
        msisdn:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
    MediaActivationRequest:
      type: object
      required: [tap, channel, occurred_at]
      properties:
        tap:
          allOf:
            - $ref: '#/components/schemas/TapInput'
          description: |
            Lecture du bracelet à activer, embarquée dans la demande. Un bracelet jamais activé n'a pas de `tap_id` :
            `register_tap` répond `NOT_ACTIVATED` sans enregistrer de lecture (§7.6). L'activation porte donc toujours
            sa lecture ; le serveur vérifie que l'UID et la signature d'originalité sont ceux de la personnalisation.
        tap_id:
          type: integer
          format: int64
          deprecated: true
          description: Sans effet pour une activation (voir `tap`) ; une demande qui ne porte que `tap_id` est refusée (`422`).
        channel:
          type: string
          enum: [DESK, FIRST_TOPUP]
          description: SELF_APP passe par POST /me/media.
        wallet_id:
          type:
            - string
            - 'null'
          format: uuid
        customer_id:
          type:
            - string
            - 'null'
          format: uuid
        deposit_payment:
          oneOf:
            - $ref: '#/components/schemas/MoneyMovement'
            - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    DepositState:
      type: object
      required: [status, amount]
      properties:
        status:
          $ref: '#/components/schemas/DepositStatus'
        amount:
          type: integer
          format: int64
        mode:
          type:
            - string
            - 'null'
          enum: [FROM_BALANCE, SEPARATE, null]
        transaction_id:
          type:
            - string
            - 'null'
          format: uuid
        cash_session_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Session de caisse qui a reçu l'écriture (espèces) ; null sinon.
    MediaActivationResponse:
      type: object
      required: [media_id, media_status, wallet, deposit]
      properties:
        media_id:
          type: string
          format: uuid
        media_status:
          $ref: '#/components/schemas/MediaStatus'
        wallet:
          $ref: '#/components/schemas/WalletSummary'
        deposit:
          $ref: '#/components/schemas/DepositState'
    DepositRequest:
      type: object
      properties:
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        payment:
          $ref: '#/components/schemas/MoneyMovement'
        cash_session_id:
          type: string
          format: uuid
          description: |
            Facultatif. Espèces : la session `OPEN` du terminal ; fourni, il DOIT être celle-là (sinon
            `409 CONFLICT_STATE`).
    MediaReleaseRequest:
      type: object
      description: Espèces uniquement (voir `releaseMedia`).
      properties:
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        cash_session_id:
          type: string
          format: uuid
          description: |
            Facultatif. Session de caisse ouverte du terminal, qui reçoit les espèces rendues ; fourni, il DOIT
            être celle-là (sinon `409 CONFLICT_STATE`).
        refund_deposit_by:
          $ref: '#/components/schemas/CashMovement'
        settle_balance:
          $ref: '#/components/schemas/CashMovement'
    MediaReleaseResponse:
      type: object
      required: [media_id, media_status]
      properties:
        media_id:
          type: string
          format: uuid
        media_status:
          $ref: '#/components/schemas/MediaStatus'
        deposit_refund_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
        promo_expiry_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Transaction `PROMO_EXPIRY` des crédits offerts restants (null s'il n'y en avait pas).
        balance_refund_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Transaction `WALLET_REFUND` du solde payé (null si le solde payé était nul).
        cash_to_hand_back:
          type: integer
          format: int64
          description: Montant total en espèces à remettre au festivalier.
        cash_session_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Session de caisse qui a reçu les écritures en espèces ; null si aucune espèce n'a été rendue.

    # ------------------------------------------------------------ Paiements
    SaleLine:
      type: object
      description: |
        Ligne d'une vente envoyée par le terminal. Depuis une caisse `CATALOG_POS`, `product_id` est requis (article
        du catalogue servi) ; prix et taux sont contrôlés contre la version courante ou la dernière version servie à
        ce terminal (`422 SALE_LINES_INVALID`). Libellé, prix et taux enregistrés sont ceux du catalogue, jamais
        ceux du corps. `label` est réservé aux relevés : il n'est pas lu pour une vente au catalogue.
      required: [quantity, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
          description: Article du catalogue (`CatalogItem.product_id`) ; requis depuis une caisse `CATALOG_POS`.
        label:
          type: string
          description: Réservé aux relevés ; ignoré pour une vente au catalogue.
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Amount'
    PaymentRequestBody:
      type: object
      description: |
        Exactement un moyen parmi `tap_id`, `tap`, `customer_qr_token`, `payment_intent_id`. Si `lines`
        est présent, `amount` DOIT être égal à Σ quantity × unit_price.
        `payment_intent_id` est V2 (ADR-43) : en V1, le serveur le refuse (`422 DEVICE_MODE_NOT_ALLOWED`).
        `vendor_session_id` est requis depuis un terminal (session de vendeur ouverte, `openVendorSession`).
        `lines` : obligatoire depuis une caisse `CATALOG_POS`, interdit depuis un `KEYPAD_TPE`.
      required: [amount, currency, occurred_at]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        vendor_session_id:
          type: string
          format: uuid
          description: |
            Session de vendeur ouverte sur ce terminal. Requise depuis un terminal : absente, close, expirée,
            d'un autre terminal ou autre que la session ouverte, ou vendeur désactivé ou bloqué →
            `409 VENDOR_SESSION_INVALID`. Le vendeur de la vente est celui de la session, jamais un champ du corps.
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        customer_qr_token:
          type: string
          minLength: 12
          maxLength: 64
        payment_intent_id:
          type: string
          description: '**V2 (ADR-43)** — intention d''un POS tiers présentée par un terminal `PAIRED_TPE`. Refusé en V1 (`422 DEVICE_MODE_NOT_ALLOWED`).'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
      oneOf:
        - required: [tap_id]
        - required: [tap]
        - required: [customer_qr_token]
        - required: [payment_intent_id]
    PaymentResult:
      type: object
      required: [transaction_id, idempotency_key, type, status, amount, currency, occurred_at, recorded_at, balance_after]
      properties:
        transaction_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          type: string
          enum: [SUCCEEDED]
        reverses_id:
          type:
            - string
            - 'null'
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        media_id:
          type:
            - string
            - 'null'
          format: uuid
        wallet_id:
          type: string
          format: uuid
        balance_after:
          $ref: '#/components/schemas/Balance'
        receipt_number:
          type: string
        vendor:
          $ref: '#/components/schemas/SaleVendor'
        lines:
          type: array
          description: Lignes enregistrées de la vente (copiées du catalogue) ; absent sans lignes.
          items:
            $ref: '#/components/schemas/SaleLineResult'
        channel:
          type: string
          enum: [NFC, MERCHANT_QR, CUSTOMER_QR]
          description: Canal de la vente (bracelet, QR commerçant, QR client) ; absent hors vente.
    SaleVendor:
      type: object
      description: |
        Vendeur auquel le serveur a attribué la vente ou l'annulation (d'après la session de vendeur). Ni PIN, ni
        empreinte, ni compteur d'échecs. Absent pour une opération sans vendeur (recharge, remboursement).
      required: [vendor_id, display_name]
      properties:
        vendor_id:
          type: string
          format: uuid
        display_name:
          type: string
    SaleLineResult:
      type: object
      description: |
        Ligne enregistrée d'une vente : libellé (dans la langue de `Accept-Language`), prix et taux copiés de la
        version du catalogue retenue ; `line_total` = `quantity` × `unit_price`.
      required: [product_id, label, quantity, unit_price, vat_rate_bps, line_total, catalog_version]
      properties:
        product_id:
          type: string
          format: uuid
        label:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Amount'
        vat_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
        line_total:
          $ref: '#/components/schemas/Amount'
        catalog_version:
          type: integer
          minimum: 1
    ReversalRequest:
      type: object
      description: |
        `vendor_session_id` est requis depuis un terminal (annulation par le vendeur de la vente ou avec un
        `SUPERVISOR`) ; il est sans objet au back-office (`humanBearer`), d'où son absence de `required`.
      required: [reason, occurred_at]
      properties:
        reason:
          type: string
          enum: [INPUT_ERROR, CUSTOMER_CANCELLED, PRODUCT_UNAVAILABLE, DUPLICATE, OTHER]
        comment:
          type: string
          maxLength: 500
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        vendor_session_id:
          type: string
          format: uuid
          description: |
            Session de vendeur ouverte sur ce terminal ; requise depuis un terminal (sinon
            `409 VENDOR_SESSION_INVALID`).
        supervisor_pin_proof:
          type: string
          description: |
            Refusé : présent → `422 VALIDATION_FAILED`, rien n'est écrit. La preuve du `SUPERVISOR` passe par
            l'en-tête `X-Approval-Token` seulement (paramètre `ApprovalToken`) : dans le corps, elle rendrait
            l'empreinte de la requête (`act_hash`) circulaire.

    # ------------------------------------------------------------ Vendeurs (mission 5b)
    VendorStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    Vendor:
      type: object
      description: |
        Vendeur d'un commerçant (lecture de la vue `vendor_public`). Ne contient jamais le PIN, son empreinte ni le
        compteur d'échecs : `locked` dit seulement si le vendeur est bloqué (5 PIN faux, levé par un nouveau PIN).
      required: [vendor_id, merchant_id, display_name, status, locked]
      properties:
        vendor_id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        display_name:
          type: string
        status:
          $ref: '#/components/schemas/VendorStatus'
        locked:
          type: boolean
    VendorPage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    VendorCreate:
      type: object
      required: [display_name, pin]
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        pin:
          type: string
          writeOnly: true
          pattern: '^[0-9]{6}$'
          description: |
            PIN du vendeur : exactement 6 chiffres. Jamais renvoyé, journalisé ni audité ; le serveur n'en garde
            que l'empreinte argon2id. Mal formé : `422 VALIDATION_FAILED`, sans écho de la valeur.
    VendorPinChange:
      type: object
      required: [pin]
      additionalProperties: false
      properties:
        pin:
          type: string
          writeOnly: true
          pattern: '^[0-9]{6}$'
          description: |
            PIN du vendeur : exactement 6 chiffres. Jamais renvoyé, journalisé ni audité ; le serveur n'en garde
            que l'empreinte argon2id. Mal formé : `422 VALIDATION_FAILED`, sans écho de la valeur.
    VendorStatusChange:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/VendorStatus'
    VendorSessionOpen:
      type: object
      required: [vendor_id, pin]
      additionalProperties: false
      properties:
        vendor_id:
          type: string
          format: uuid
        pin:
          type: string
          writeOnly: true
          pattern: '^[0-9]{6}$'
          description: |
            PIN du vendeur : exactement 6 chiffres. Jamais renvoyé, journalisé ni audité ; le serveur n'en garde
            que l'empreinte argon2id. Mal formé : `422 VALIDATION_FAILED`, sans écho de la valeur.
    VendorSession:
      type: object
      description: Session de vendeur ouverte sur ce terminal (identifiant non secret, 12 h au plus).
      required: [vendor_session_id, vendor_id, vendor_display_name, expires_at]
      properties:
        vendor_session_id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
        vendor_display_name:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    TerminalVendor:
      type: object
      description: Vendeur proposé à l'écran de connexion du terminal ; rien d'autre que l'identifiant et le nom.
      required: [vendor_id, display_name]
      properties:
        vendor_id:
          type: string
          format: uuid
        display_name:
          type: string
    TerminalVendorList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TerminalVendor'

    # ------------------------------------------------------------ Catalogue (mission 5b)
    CatalogLabel:
      type: string
      minLength: 1
      maxLength: 120
    CatalogCategory:
      type: object
      required: [category_id, label_fr, label_en, position, active]
      properties:
        category_id:
          type: string
          format: uuid
        label_fr:
          $ref: '#/components/schemas/CatalogLabel'
        label_en:
          $ref: '#/components/schemas/CatalogLabel'
        position:
          type: integer
          minimum: 0
          description: Ordre d'affichage (croissant).
        active:
          type: boolean
    CatalogCategoryCreate:
      type: object
      required: [label_fr, label_en]
      additionalProperties: false
      properties:
        label_fr:
          $ref: '#/components/schemas/CatalogLabel'
        label_en:
          $ref: '#/components/schemas/CatalogLabel'
        position:
          type: integer
          minimum: 0
          description: Ordre d'affichage ; à défaut, après la dernière catégorie.
    CatalogCategoryUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        label_fr:
          $ref: '#/components/schemas/CatalogLabel'
        label_en:
          $ref: '#/components/schemas/CatalogLabel'
        position:
          type: integer
          minimum: 0
        active:
          type: boolean
    CatalogItemAdmin:
      type: object
      description: Article du catalogue courant (back-office).
      required: [item_id, category_id, label_fr, label_en, unit_price, vat_rate_bps, active]
      properties:
        item_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        label_fr:
          $ref: '#/components/schemas/CatalogLabel'
        label_en:
          $ref: '#/components/schemas/CatalogLabel'
        unit_price:
          $ref: '#/components/schemas/Amount'
        vat_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
        active:
          type: boolean
    CatalogItemCreate:
      type: object
      required: [label_fr, label_en, unit_price, vat_rate_bps]
      additionalProperties: false
      properties:
        label_fr:
          $ref: '#/components/schemas/CatalogLabel'
        label_en:
          $ref: '#/components/schemas/CatalogLabel'
        unit_price:
          $ref: '#/components/schemas/Amount'
        vat_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
    CatalogItemUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        category_id:
          type: string
          format: uuid
        label_fr:
          $ref: '#/components/schemas/CatalogLabel'
        label_en:
          $ref: '#/components/schemas/CatalogLabel'
        unit_price:
          $ref: '#/components/schemas/Amount'
        vat_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
        active:
          type: boolean
    CatalogCategoryResult:
      type: object
      description: Catégorie écrite et numéro de la version du catalogue créée par l'écriture.
      required: [category, catalog_version]
      properties:
        category:
          $ref: '#/components/schemas/CatalogCategory'
        catalog_version:
          type: integer
          minimum: 1
    CatalogItemResult:
      type: object
      description: Article écrit et numéro de la version du catalogue créée par l'écriture.
      required: [item, catalog_version]
      properties:
        item:
          $ref: '#/components/schemas/CatalogItemAdmin'
        catalog_version:
          type: integer
          minimum: 1
    Catalog:
      type: object
      description: Catalogue courant d'un point de vente ; `version` 0 tant qu'aucune écriture n'a eu lieu.
      required: [pos_id, version, merchant_manages, categories, items]
      properties:
        pos_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
        merchant_manages:
          type: boolean
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCategory'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItemAdmin'
    CatalogVersionItem:
      type: object
      description: Article d'une version immuable du catalogue (copie à la création de la version).
      required: [item_id, category_id, label_fr, label_en, unit_price, vat_rate_bps]
      properties:
        item_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        label_fr:
          type: string
        label_en:
          type: string
        unit_price:
          $ref: '#/components/schemas/Amount'
        vat_rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
    CatalogVersion:
      type: object
      required: [pos_id, version, created_at, items]
      properties:
        pos_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogVersionItem'
    CatalogPolicy:
      type: object
      description: Délégation de la gestion du catalogue d'un point de vente au commerçant (réglée par l'organisateur).
      required: [merchant_manages]
      additionalProperties: false
      properties:
        pos_id:
          type: string
          format: uuid
          readOnly: true
        merchant_manages:
          type: boolean

    # ------------------------------------------------------------ Recharges
    CashTopupRequest:
      type: object
      required: [amount, currency, occurred_at]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        cash_tendered:
          type: integer
          format: int64
          description: Espèces remises (pour calcul du rendu, informatif).
        cash_session_id:
          type: string
          format: uuid
          description: |
            Facultatif. Une recharge `TOPUP_CASH` est rattachée à la session `OPEN` du terminal (SPECIFICATION
            §5.3) ; fourni, il DOIT être celle-là (sinon `409 CONFLICT_STATE`).
      oneOf:
        - required: [tap_id]
        - required: [tap]
    TopupResult:
      type: object
      required: [transaction_id, idempotency_key, type, status, amount, currency, wallet_id, balance_after]
      properties:
        transaction_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        type:
          type: string
          enum: [TOPUP_CASH, TOPUP]
        status:
          type: string
          enum: [SUCCEEDED]
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        wallet_id:
          type: string
          format: uuid
        balance_after:
          $ref: '#/components/schemas/Balance'
        cash_session_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Session de caisse de la recharge (`TOPUP_CASH`) ; null pour une recharge PSP.
        deposit:
          oneOf:
            - $ref: '#/components/schemas/DepositState'
            - type: 'null'
    PspProvider:
      type: string
      description: |
        Moyen de paiement choisi par le payeur (ADR-70). WAVE et ORANGE_MONEY : intégrations directes. CARD :
        traité par le PSP carte que le prestataire a configuré pour l'organisateur (agrégateur local comme
        PayDunya, ou PSP international comme Stripe) ; refusé (`422 VALIDATION_FAILED`) si l'organisateur n'a
        aucun PSP carte actif.
      enum: [WAVE, ORANGE_MONEY, CARD]
    PspTopupRequest:
      type: object
      required: [amount, currency, provider]
      properties:
        wallet_id:
          type: string
          format: uuid
        tap_id:
          type: integer
          format: int64
          description: Au guichet (TOPUP_DESK) à la place de wallet_id.
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        provider:
          $ref: '#/components/schemas/PspProvider'
          description: |
            Moyen de paiement (valeur = méthode, `method` du modèle de données) ; le fournisseur est résolu par
            la configuration PSP. Le nom du champ est conservé pour ne pas rompre les applications.
        payer_msisdn:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
        return_url:
          type: string
          format: uri
    PspTopup:
      type: object
      required: [topup_id, status, provider, amount, currency, wallet_id]
      properties:
        topup_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, EXPIRED, CANCELLED]
        provider:
          $ref: '#/components/schemas/PspProvider'
        psp_config_id:
          type: string
          format: uuid
          description: Configuration PSP (S26) utilisée ; son URL de webhook est `/webhooks/{provider}/{psp_config_id}`.
        provider_reference:
          type:
            - string
            - 'null'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        wallet_id:
          type: string
          format: uuid
        checkout_url:
          type:
            - string
            - 'null'
          format: uri
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        transaction_id:
          type:
            - string
            - 'null'
          format: uuid
        failure_reason:
          type: string
          description: |
            Motif de l'échec, chaîne libre (l'ensemble fermé est arrêté par la livraison de la recharge PSP).
            Valeurs indicatives : `THREE_DS`, `NO_FINGERPRINT`, `CARD_DAILY_LIMIT`, `LEDGER_STATUS`, `CANCELLED`.
    PspConfigurationProvider:
      type: string
      description: |
        Fournisseur d'une configuration PSP (`psp_configuration.provider`) : `WAVE` et `ORANGE_MONEY`
        (intégrations directes), `PAYDUNYA` (agrégateur local) et `STRIPE` (PSP international) pour la carte.
        Ne pas confondre avec `PspProvider`, qui porte le MOYEN de paiement (`WAVE`, `ORANGE_MONEY`, `CARD`).
      enum: [WAVE, ORANGE_MONEY, PAYDUNYA, STRIPE]
    PspConfigurationCreate:
      type: object
      required: [method, provider, holder_party_id, secret_ref]
      additionalProperties: false
      properties:
        method:
          $ref: '#/components/schemas/PspProvider'
        provider:
          $ref: '#/components/schemas/PspConfigurationProvider'
        holder_party_id:
          type: string
          format: uuid
          description: Titulaire des fonds reçus par cette configuration (doit être le détenteur des fonds du grand livre).
        secret_ref:
          type: string
          pattern: '^psp/[0-9a-fA-F-]{36}/[A-Za-z0-9._-]+$'
          description: |
            RÉFÉRENCE du secret dans le coffre (`psp/<uuid>/<nom>`), jamais le secret lui-même : une valeur qui
            ressemble à un secret est refusée `422 VALIDATION_FAILED`.
        is_default:
          type: boolean
          default: false
          description: Configuration par défaut de l'organisateur pour ce moyen (une seule `ACTIVE`).
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_until:
          type:
            - string
            - 'null'
          format: date-time
    PspConfiguration:
      type: object
      required: [psp_config_id, organizer_id, method, provider, holder_party_id, status, is_default, version,
                 created_by, created_at]
      properties:
        psp_config_id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/PspProvider'
        provider:
          $ref: '#/components/schemas/PspConfigurationProvider'
        holder_party_id:
          type: string
          format: uuid
        secret_ref:
          type:
            - string
            - 'null'
          description: |
            Référence du secret (jamais le secret). Rendue au seul `OPERATOR_ADMIN` du prestataire ; `null` ou
            absente pour tout autre rôle (`ORGANIZER_ADMIN` compris).
        compliance_ref:
          type:
            - string
            - 'null'
          description: Référence de conformité fournie à l'activation ; null avant.
        status:
          type: string
          enum: [DRAFT, ACTIVE, SUSPENDED]
        is_default:
          type: boolean
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_until:
          type:
            - string
            - 'null'
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        created_by:
          type: string
          format: uuid
        approved_by:
          type:
            - string
            - 'null'
          format: uuid
        created_at:
          $ref: '#/components/schemas/Timestamp'
    EventPspSelection:
      type: object
      description: Choix de la configuration PSP d'un moyen pour un événement (`event_psp_selection`).
      required: [event_id, method, psp_config_id, selected_by, selected_at]
      properties:
        event_id:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/PspProvider'
        psp_config_id:
          type: string
          format: uuid
        selected_by:
          type: string
          format: uuid
        approved_by:
          type:
            - string
            - 'null'
          format: uuid
          description: Seconde personne, pour un choix fait pendant `LIVE` ; null sinon.
        selected_at:
          $ref: '#/components/schemas/Timestamp'
    PspWebhookEvent:
      type: object
      description: Corps natif du PSP (non normalisé) ; seuls `id` et `type` sont exigés ici.
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          additionalProperties: true
      additionalProperties: true

    # ------------------------------------------------------------ Hors ligne
    SnapshotEntry:
      type: object
      description: |
        Entrée du contenu (vue `offline_snapshot_rows`, sync_protocol.md §4.1) : une par rattachement ouvert.
        Le terminal applique les mêmes règles que le serveur : statut du bracelet, du lot et du portefeuille,
        événement du lot, compteur strictement supérieur à `last_counter`. Environ 120 octets par entrée
        (≈ 6 Mo pour 50 000 bracelets).
      required: [token_hash, nfc_uid, key_index, originality_sig_sha256, status, batch_event_id, batch_status, wallet_status, spendable, last_counter, pwd_pack_enc]
      properties:
        originality_sig_sha256:
          oneOf:
            - $ref: '#/components/schemas/Hex32'
            - type: 'null'
          description: |
            SHA-256 de la signature d'originalité enregistrée à la personnalisation (`media.originality_sig_sha256`) ;
            le terminal hors ligne compare la signature lue (ADR-59, sync_protocol.md §5.2-4). Null si aucune
            signature n'est enregistrée.
        token_hash:
          $ref: '#/components/schemas/Hex32'
        nfc_uid:
          oneOf:
            - $ref: '#/components/schemas/NfcUid'
            - type: 'null'
        key_index:
          type: integer
        status:
          $ref: '#/components/schemas/MediaStatus'
        batch_event_id:
          type:
            - string
            - 'null'
          format: uuid
        batch_status:
          type:
            - string
            - 'null'
          enum: [ORDERED, PERSONALIZED, DELIVERED, ACTIVE, SUSPENDED, CLOSED, null]
        wallet_status:
          allOf:
            - $ref: '#/components/schemas/WalletStatus'
          description: Statut du portefeuille rattaché ; hors ligne, une vente n'est autorisée que si `ACTIVE`.
        spendable:
          type: integer
          format: int64
          minimum: 0
        last_counter:
          type:
            - integer
            - 'null'
          format: int64
        pwd_pack_enc:
          oneOf:
            - $ref: '#/components/schemas/EncryptedBlob'
            - type: 'null'
          description: PWD||PACK chiffré (AES-256-GCM, clé de contenu `pwd_pack_key`) ; null si le bracelet n'est pas utilisable.
    SnapshotHeader:
      type: object
      description: |
        Partie signée. Signature (algorithme de la clé `key_id`, `ECDSA_P256_SHA256` par défaut) sur la
        sérialisation canonique JSON (RFC 8785, JCS) de cet objet entier (sync_protocol.md §4.1).
        `content_sha256` = SHA-256 de la sérialisation JCS de `{entries, removed_token_hashes}` (sans les
        champs chiffrés `pwd_pack_enc`, propres à chaque terminal). Un snapshot produit par la passerelle est
        signé par une clé propre à la passerelle (hors KMS, stockage matériel), de `key_id` distinct.
      required: [format, kind, operator_id, ledger_id, event_id, currency, version, base_version, generated_at, valid_until, entries, removed, content_sha256, authority_epoch, key_id]
      properties:
        format:
          type: string
          const: CASHLESS-SNAPSHOT/v1
        kind:
          type: string
          enum: [FULL, DELTA]
        operator_id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        currency:
          $ref: '#/components/schemas/Currency'
        version:
          type: integer
          format: int64
        base_version:
          type:
            - integer
            - 'null'
          format: int64
          description: Pour un DELTA, version à laquelle il s'applique ; `null` pour un FULL.
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        valid_until:
          $ref: '#/components/schemas/Timestamp'
        entries:
          type: integer
          minimum: 0
          description: Nombre d'entrées du contenu.
        removed:
          type: integer
          minimum: 0
          description: Nombre de retraits (`removed_token_hashes`) ; 0 pour un FULL.
        content_sha256:
          $ref: '#/components/schemas/Hex32'
        authority_epoch:
          type: integer
          format: int64
        key_id:
          type: string
    OfflineSnapshot:
      type: object
      required: [header, signature, entries]
      properties:
        header:
          $ref: '#/components/schemas/SnapshotHeader'
        signature:
          type: string
          contentEncoding: base64
        pwd_pack_key:
          $ref: '#/components/schemas/WrappedKey'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotEntry'
        removed_token_hashes:
          type: array
          items:
            $ref: '#/components/schemas/Hex32'
    OfflineOperationType:
      type: string
      description: |
        PURCHASE (vente), REVERSAL (annulation d'une vente), TOPUP_CASH (si `cash_topup_offline`),
        VOID (numéro consommé sans effet comptable : abandon, refus en ligne), ONLINE_REF (référence à une
        opération exclusivement en ligne — activation, caution, restitution, QR… — identifiée par son
        `online_operation` et son `content_sha256`). Le lot couvre TOUS les numéros, y compris ceux déjà
        confirmés en ligne (sync_protocol.md §6.1 et §3.4).
        ACTIVATION et DEPOSIT_CASH : uniquement dans un lot de la passerelle (`EdgeSyncOperation`, `authorized_mode =
        EDGE_ONLINE`), pour une activation ou une caution en espèces faite au guichet pendant `EDGE` (ADR-52) ;
        détail dans `edge_guichet`. Un terminal NE DOIT PAS les utiliser dans ses propres lots.
      enum: [PURCHASE, REVERSAL, TOPUP_CASH, VOID, ONLINE_REF, ACTIVATION, DEPOSIT_CASH]
    OfflineOperation:
      type: object
      required: [seq, type, occurred_at, chain_hash]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
        type:
          $ref: '#/components/schemas/OfflineOperationType'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        tap:
          $ref: '#/components/schemas/TapInput'
        snapshot_version:
          type: integer
          format: int64
          description: Version du snapshot utilisé pour autoriser (champ d'état, hors `content_sha256`).
        config_id:
          type: integer
          format: int64
          description: |
            `DeviceConfig.config_id` de la configuration détenue au moment de l'autorisation. Champ d'ÉTAT
            (comme `snapshot_version`), non chaîné : il n'entre pas dans `content_sha256`, car il est posé au
            passage hors ligne d'une entrée créée en ligne (sync_protocol.md §3.3). Obligatoire pour une
            opération autorisée hors ligne ; absent sinon. Une opération `online_status = CONFIRMED` sans
            `config_id` est exemptée des contrôles de conformité (sync_protocol.md §7.2, §7.3).
        local_available_before:
          type: integer
          format: int64
          description: Solde disponible calculé localement avant l'opération (contrôle).
        online_status:
          type: string
          enum: [NOT_ATTEMPTED, CONFIRMED, UNKNOWN, REJECTED]
          description: |
            Issue de la tentative en ligne faite avec la même clé : jamais tentée, confirmée (réponse 2xx),
            inconnue (délai dépassé / coupure), refusée (réponse 4xx métier).
        online_tap_id:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            `tap_id` reçu de `POST /taps` pour la lecture embarquée dans `tap`, s'il a été reçu. Champ d'état (non
            chaîné). Le serveur réutilise cette lecture si elle est du même terminal, du même bracelet, du même
            compteur et n'a servi à aucune écriture : pas de fausse copie quand le lot arrive après le délai de
            renvoi (ADR-50).
        online_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
          description: transaction_id reçu en ligne (si CONFIRMED).
        online_operation:
          type: string
          description: Pour ONLINE_REF, operationId de l'appel en ligne (ex. activateMedia).
        content_sha256:
          $ref: '#/components/schemas/Hex32'
        reverses_seq:
          type: integer
          format: int64
          description: Pour REVERSAL, seq de la vente annulée (du même terminal).
        reverses_transaction_id:
          type: string
          format: uuid
          description: Pour REVERSAL d'une vente écrite en ligne.
        reason:
          type: string
        void_reason:
          type: string
          enum: [ABORTED_BY_OPERATOR, ONLINE_REJECTED, NFC_READ_FAILED, APP_CRASH_RECOVERY]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
        clock:
          type: object
          properties:
            monotonic_ms:
              type: integer
              format: int64
              description: Horloge monotone depuis le démarrage.
            boot_id:
              type: string
            offset_ms:
              type: integer
              format: int64
              description: Décalage estimé (heure serveur − heure terminal) lors du dernier contact.
        chain_hash:
          $ref: '#/components/schemas/Hex32'
    OfflineBatchHeader:
      type: object
      required: [batch_id, device_serial, ledger_id, authority_epoch, seq_from, seq_to, count, created_at, prev_chain_hash, last_chain_hash]
      properties:
        batch_id:
          type: string
          format: uuid
        device_serial:
          type: string
        ledger_id:
          type: string
          format: uuid
        authority_epoch:
          type: integer
          format: int64
        seq_from:
          type: integer
          format: int64
        seq_to:
          type: integer
          format: int64
        count:
          type: integer
          minimum: 1
          maximum: 500
        created_at:
          $ref: '#/components/schemas/Timestamp'
        device_time_at_send:
          $ref: '#/components/schemas/Timestamp'
        prev_chain_hash:
          $ref: '#/components/schemas/Hex32'
        last_chain_hash:
          $ref: '#/components/schemas/Hex32'
    OfflineBatch:
      type: object
      required: [header, operations, signature]
      properties:
        header:
          $ref: '#/components/schemas/OfflineBatchHeader'
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/OfflineOperation'
        signature:
          type: string
          contentEncoding: base64
          description: ECDSA P-256 (clé Keystore) sur JCS(header).
    OfflineOperationStatus:
      type: string
      enum: [ACCEPTED, DUPLICATE, ACCEPTED_WITH_SHORTFALL, REJECTED]
    OfflineRejectReason:
      type: string
      description: |
        Raison de rejet d'une opération de lot (sync_protocol.md §7.1, §7.2, §7.3). `MEDIA_NOT_IN_SNAPSHOT` :
        bracelet absent du snapshot utilisé, ou inconnu / non activé au serveur (`MEDIA_UNKNOWN` est réservé au
        chemin en ligne). `INSUFFICIENT_FUNDS_RETRY` : 4ᵉ `CL007` consécutif (débits concurrents) ; rien
        n'est écrit, `retryable = true`, le terminal renvoie l'opération dans un lot ultérieur.
        `SYNC_DEADLINE_PASSED` : synchronisation reçue alors que l'événement est en `SETTLING` ou au-delà (ADR-49) ;
        rien n'est écrit, `retryable = false` ; le commerçant reste garanti par une écriture du back-office.
        `PERIOD_CLOSED` et `LEDGER_LOCKED` ne sont pas des fautes du terminal (traitement manuel).
        `EDGE_REPLAY_FAILED` : lot de passerelle seulement ; rejeu impossible d'une `ACTIVATION` ou d'un
        `DEPOSIT_CASH` (`detail` donne le code de l'échec ; sync_protocol.md §9.6).
        `SEQ_OUT_OF_RANGE` n'est pas une raison par opération : le lot entier est refusé (`409`).
      enum:
        - IDEMPOTENCY_KEY_REUSED
        - MALFORMED_OPERATION
        - CURRENCY_MISMATCH
        - OFFLINE_NOT_ALLOWED
        - POLICY_LIMIT_EXCEEDED
        - SNAPSHOT_TOO_OLD
        - SNAPSHOT_VERSION_UNKNOWN
        - MEDIA_NOT_IN_SNAPSHOT
        - MEDIA_BLOCKED_IN_SNAPSHOT
        - MEDIA_WRONG_EVENT
        - PACK_NOT_VERIFIED
        - REVERSAL_TARGET_NOT_FOUND
        - ALREADY_REVERSED
        - PERIOD_CLOSED
        - LEDGER_LOCKED
        - WALLET_LIMIT_EXCEEDED
        - INSUFFICIENT_FUNDS_RETRY
        - SYNC_DEADLINE_PASSED
        - EDGE_REPLAY_FAILED
    ShortfallReason:
      type: string
      enum: [INSUFFICIENT_FUNDS, MEDIA_BLOCKED_AFTER_SNAPSHOT, MEDIA_CLONE_SUSPECTED, MEDIA_UID_MISMATCH, MEDIA_SIGNATURE_MISMATCH, WALLET_BLOCKED]
    OfflineOperationResult:
      type: object
      required: [seq, idempotency_key, status]
      properties:
        seq:
          type: integer
          format: int64
        idempotency_key:
          type: string
        status:
          $ref: '#/components/schemas/OfflineOperationStatus'
        transaction_id:
          type:
            - string
            - 'null'
          format: uuid
        effect:
          type: string
          enum: [LEDGER_WRITTEN, NONE]
          description: NONE pour VOID, ONLINE_REF non exécuté, REJECTED.
        charged_to_wallet:
          type: integer
          format: int64
        shortfall_amount:
          type: integer
          format: int64
        shortfall_reason:
          $ref: '#/components/schemas/ShortfallReason'
        anomaly_id:
          type: string
          format: uuid
        tap_result:
          $ref: '#/components/schemas/TapResultCode'
        reject_reason:
          $ref: '#/components/schemas/OfflineRejectReason'
        retryable:
          type: boolean
        detail:
          type: string
    OfflineBatchResult:
      type: object
      required: [batch_id, processed_at, results, contiguous_acked_seq, missing_seqs, server_time]
      properties:
        batch_id:
          type: string
          format: uuid
        processed_at:
          $ref: '#/components/schemas/Timestamp'
        results:
          type: array
          items:
            $ref: '#/components/schemas/OfflineOperationResult'
        contiguous_acked_seq:
          type: integer
          format: int64
        missing_seqs:
          type: array
          items:
            type: integer
            format: int64
        next_snapshot_version:
          type:
            - integer
            - 'null'
          format: int64
        abandoned:
          type: boolean
          default: false
          description: |
            Vrai si le lot a été abandonné (traitement interrompu plus de 15 min) : `results` ne contient que les
            opérations traitées ; renvoyer les autres dans un nouveau lot (sync_protocol.md §6.2-6).
        server_time:
          $ref: '#/components/schemas/Timestamp'
    EdgeSyncOperation:
      allOf:
        - $ref: '#/components/schemas/OfflineOperation'
        - type: object
          required: [edge_seq, device_serial, authorized_mode]
          properties:
            edge_seq:
              type: integer
              format: int64
            device_serial:
              type: string
            authorized_mode:
              type: string
              enum: [EDGE_ONLINE, DEVICE_OFFLINE]
              description: Autorisée en direct par la passerelle, ou relayée d'un lot hors ligne de terminal.
            device_batch_id:
              type: string
              format: uuid
              description: |
                Obligatoire si `authorized_mode = DEVICE_OFFLINE` : `header.batch_id` du lot d'origine du
                terminal, dont l'en-tête et la signature sont relayés dans `EdgeSyncBatch.device_batches`.
                Il n'y a pas de signature par opération : le terminal signe l'en-tête de son lot.
            edge_guichet:
              type: object
              description: |
                Obligatoire pour `type = ACTIVATION` ou `DEPOSIT_CASH` (ADR-52). Le central rejoue `activate_media`
                (avec `event_id`) ou `take_deposit` (mode `SEPARATE`, espèces de la station `cash_desk_account_id`).
                Rejeu impossible : `REJECTED` / `EDGE_REPLAY_FAILED` et espèces au compte d'attente (sync_protocol.md §9.6).
              required: [media_id]
              properties:
                media_id:
                  type: string
                  format: uuid
                wallet_id:
                  type: string
                  format: uuid
                  description: ACTIVATION — portefeuille rattaché (créé par la passerelle s'il est anonyme).
                event_id:
                  type: string
                  format: uuid
                channel:
                  type: string
                  enum: [DESK]
                deposit_amount:
                  type: integer
                  format: int64
                  description: DEPOSIT_CASH — montant de la caution encaissée en espèces.
                cash_desk_account_id:
                  type: string
                  format: uuid
            edge_decision:
              type: object
              description: |
                Décision de la passerelle (autorité) : le central écrit ces montants tels quels
                (répartition portefeuille / compte d'attente) et recalcule seulement frais et commissions.
              required: [status, charged_to_wallet, shortfall_amount]
              properties:
                status:
                  $ref: '#/components/schemas/OfflineOperationStatus'
                charged_to_wallet:
                  type: integer
                  format: int64
                shortfall_amount:
                  type: integer
                  format: int64
                shortfall_reason:
                  $ref: '#/components/schemas/ShortfallReason'
                reject_reason:
                  $ref: '#/components/schemas/OfflineRejectReason'
    EdgeSyncBatch:
      type: object
      description: |
        Lot EDGE_SYNC (sync_protocol.md §9.5). `batch_id` est la clé d'idempotence du lot. Les opérations
        relayées d'un lot hors ligne de terminal (`DEVICE_OFFLINE`) sont accompagnées de l'en-tête et de la
        signature d'ORIGINE de ce lot (`device_batches`) : le central vérifie la signature avec
        `device.public_key` (`BATCH_SIGNATURE_INVALID` sinon) et recalcule la chaîne du terminal jusqu'à
        `header.last_chain_hash` (`CHAIN_BROKEN` sinon).
      required: [batch_id, edge_gateway_id, ledger_id, epoch, edge_seq_from, edge_seq_to, prev_chain_hash, last_chain_hash, operations, signature]
      properties:
        batch_id:
          type: string
          format: uuid
        edge_gateway_id:
          type: string
          format: uuid
        ledger_id:
          type: string
          format: uuid
        epoch:
          type: integer
          format: int64
        edge_seq_from:
          type: integer
          format: int64
        edge_seq_to:
          type: integer
          format: int64
        prev_chain_hash:
          $ref: '#/components/schemas/Hex32'
        last_chain_hash:
          $ref: '#/components/schemas/Hex32'
        operations:
          type: array
          minItems: 1
          maxItems: 500
          description: Au plus 500 opérations et 1 Mio par lot, dans l'ordre des `edge_seq`.
          items:
            $ref: '#/components/schemas/EdgeSyncOperation'
        device_batches:
          type: array
          description: |
            En-têtes et signatures d'origine des lots de terminaux relayés (une entrée par `device_batch_id`
            référencé par une opération `DEVICE_OFFLINE` du lot) ; absent ou vide s'il n'y en a pas.
          items:
            type: object
            required: [header, signature]
            properties:
              header:
                $ref: '#/components/schemas/OfflineBatchHeader'
              signature:
                type: string
                contentEncoding: base64
                description: Signature d'origine du terminal (ECDSA P-256) sur JCS(header), relayée telle quelle.
        signature:
          type: string
          contentEncoding: base64
      example:
        batch_id: 7e8f9a0b-1c2d-4e3f-8a4b-5c6d7e8f9a0b
