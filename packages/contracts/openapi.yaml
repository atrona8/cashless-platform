    DebitAuthorityChangeRequest:
      type: object
      required: [target, reason]
      properties:
        target:
          type: string
          enum: [EDGE, CENTRAL]
        edge_gateway_id:
          type: string
          format: uuid
        reason:
          type: string
        force:
          type: boolean
          default: false
          description: '`true` : reprise forcée, à deux personnes ; crée une demande d''approbation `FORCE_CENTRAL_AUTHORITY` (ADR-74).'
        gateway_confirmed_offline:
          type: boolean
          description: Obligatoire (true) si force = true.
    Handover:
      type: object
      required: [handover_id, direction, state, epoch, requested_at]
      properties:
        handover_id:
          type: string
        direction:
          type: string
          enum: [TO_EDGE, TO_CENTRAL]
        state:
          type: string
          description: |
            TO_EDGE : GRANTED → ACTIVE. TO_CENTRAL : RELEASE_REQUESTED → RELEASING → COMPLETED.
            `RELEASING` est posé par l'API à la réception de `POST /edge/handovers/{handover_id}/release`,
            avant toute vérification (sync_protocol.md §9.3, étape 5).
            FORCED : reprise forcée par le central. FAILED : abandon.
          enum: [GRANTED, ACTIVE, RELEASE_REQUESTED, RELEASING, COMPLETED, FORCED, FAILED]
        epoch:
          type: integer
          format: int64
        central_watermark_posting_id:
          type: integer
          format: int64
        final_edge_seq:
          type: integer
          format: int64
        missing_edge_seqs:
          type: array
          items:
            type: integer
            format: int64
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
    DebitAuthorityState:
      allOf:
        - $ref: '#/components/schemas/DebitAuthority'
        - type: object
          required: [handover]
          properties:
            handover:
              oneOf:
                - $ref: '#/components/schemas/Handover'
                - type: 'null'
    ReplicationPage:
      type: object
      required: [ledger_id, epoch, from_posting_id, to_posting_id, wallets, media, has_more]
      properties:
        ledger_id:
          type: string
          format: uuid
        epoch:
          type: integer
          format: int64
        from_posting_id:
          type: integer
          format: int64
        to_posting_id:
          type: integer
          format: int64
        wallets:
          type: array
          items:
            type: object
            required: [wallet_id, status, paid, promo]
            properties:
              wallet_id:
                type: string
                format: uuid
              status:
                $ref: '#/components/schemas/WalletStatus'
              paid:
                type: integer
                format: int64
              promo:
                type: integer
                format: int64
        media:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotEntry'
        has_more:
          type: boolean

    # ------------------------------------------------------------ Guichet
    CashMovement:
      type: object
      description: Rendu en espèces depuis la caisse de la session de caisse indiquée par la requête.
      required: [method]
      properties:
        method:
          type: string
          const: CASH
    CashDueRefundRequest:
      type: object
      description: |
        Pas de champ montant. Le serveur le calcule (anomalies `CASH_TOPUP_OVER_LIMIT` ouvertes du bracelet).
        `cash_session_id` est facultatif : le compte crédité est la caisse du terminal, dont la session doit être
        `OPEN` (`409 CONFLICT_STATE` sinon) ; fourni, il DOIT être cette session.
      properties:
        tap_id:
          type: integer
          format: int64
        tap:
          $ref: '#/components/schemas/TapInput'
        cash_session_id:
          type: string
          format: uuid
          description: Session de caisse ouverte du terminal ; son compte de caisse est crédité.
      oneOf:
        - required: [tap_id]
        - required: [tap]
    CashDueRefundResult:
      type: object
      required: [transaction_id, idempotency_key, media_id, amount, currency, resolved_anomaly_ids]
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Transaction `WALLET_REFUND` (débit `L-ESP-A-RENDRE`, crédit caisse).
        idempotency_key:
          type: string
        media_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        resolved_anomaly_ids:
          type: array
          items:
            type: string
            format: uuid
        approved_by:
          type:
            - string
            - 'null'
          format: uuid
          description: Valideur (`sub` du jeton d'approbation sur place), ou null sous le plafond.
        cash_session_id:
          type: string
          format: uuid
          description: Session de caisse dont le compte a été crédité.
    CashSession:
      type: object
      description: |
        Session de caisse d'un terminal `TOPUP_DESK` (`cash_session`). Seuls les états `OPEN` et `CLOSED` existent
        dans le contrat. `expected_amount` et `difference` ne sont rendus qu'APRÈS la fermeture, et seulement à
        un `SUPERVISOR` ou un `ORGANIZER_ADMIN` de l'événement ; ils sont `null` sinon, y compris dans les
        réponses d'`openCashSession`, de `countCashSession` et pour un `CASHIER`.
      required: [cash_session_id, cash_account_id, status, opened_by, opened_at]
      properties:
        cash_session_id:
          type: string
          format: uuid
        cash_account_id:
          type: string
          format: uuid
        device_id:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum: [OPEN, CLOSED]
        opened_by:
          type: string
          format: uuid
        opened_at:
          $ref: '#/components/schemas/Timestamp'
        last_count:
          oneOf:
            - type: 'null'
            - type: object
              required: [counted_amount, counted_at, counted_by]
              properties:
                counted_amount:
                  type: integer
                  format: int64
                counted_at:
                  $ref: '#/components/schemas/Timestamp'
                counted_by:
                  type: string
                  format: uuid
        closed_at:
          type:
            - string
            - 'null'
          format: date-time
        closed_by:
          type:
            - string
            - 'null'
          format: uuid
          description: Personne qui a fermé la session ; null tant qu'elle est `OPEN`.
        counted_amount:
          type:
            - integer
            - 'null'
          format: int64
          description: Montant compté retenu, figé à la fermeture ; null tant que la session est `OPEN`.
        expected_amount:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            Théorique (solde de la caisse) à la fermeture. Rendu seulement après fermeture et seulement à un
            `SUPERVISOR` ou `ORGANIZER_ADMIN` de l'événement ; null sinon.
        cash_close_transaction_id:
          type:
            - string
            - 'null'
          format: uuid
        difference:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            Compté − théorique à la fermeture (négatif = manque) ; renvoyé seulement après fermeture et seulement
            à un `SUPERVISOR` ou `ORGANIZER_ADMIN` de l'événement ; null sinon.
        cash_diff_anomaly_id:
          type:
            - string
            - 'null'
          format: uuid
    KycVerificationCreate:
      type: object
      required: [id_type, id_country, id_last4, id_expires_on]
      properties:
        customer_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
          description: Portefeuille présenté au guichet ; son client est identifié.
        id_type:
          type: string
          enum: [NATIONAL_ID, PASSPORT, RESIDENCE_PERMIT, DRIVING_LICENCE, OTHER]
        id_country:
          type: string
          pattern: '^[A-Z]{2}$'
        id_last4:
          type: string
          pattern: '^[0-9A-Z]{1,4}$'
          description: 4 derniers caractères du numéro seulement.
        id_expires_on:
          type: string
          format: date
      oneOf:
        - required: [customer_id]
        - required: [wallet_id]
    KycVerification:
      type: object
      required: [kyc_verification_id, customer_id, method, agent_id, id_type, id_country, id_last4, id_expires_on, status, verified_at]
      properties:
        kyc_verification_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        wallet_id:
          type:
            - string
            - 'null'
          format: uuid
        method:
          type: string
          enum: [DESK, ONLINE]
          description: '`ONLINE` réservé (V2).'
        agent_id:
          type: string
          format: uuid
        id_type:
          type: string
        id_country:
          type: string
        id_last4:
          type: string
        id_expires_on:
          type: string
          format: date
        status:
          type: string
          enum: [VERIFIED, REVOKED]
        verified_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_by:
          type:
            - string
            - 'null'
          format: uuid
        revoked_reason:
          type:
            - string
            - 'null'
    LateClaimRequest:
      type: object
      required: [wallet_id, amount, currency, proof, destination, reason]
      properties:
        wallet_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        proof:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [MEDIA_TAP, CUSTOMER_ACCOUNT]
            tap_id:
              type: integer
              format: int64
              description: Obligatoire si `kind = MEDIA_TAP`.
        destination:
          type: object
          required: [method]
          properties:
            method:
              type: string
              enum: [CASH, WAVE, ORANGE_MONEY, BANK_TRANSFER]
            msisdn:
              type: string
              pattern: '^\+[1-9][0-9]{6,14}$'
            iban:
              type: string
        reason:
          type: string
          minLength: 10
    LateClaimResult:
      type: object
      required: [ledger_id, wallet_id, amount, currency, breakage_reversal_transaction_id, wallet_refund_transaction_id, approved_by]
      properties:
        ledger_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        breakage_reversal_transaction_id:
          type: string
          format: uuid
        wallet_refund_transaction_id:
          type: string
          format: uuid
        approved_by:
          type: string
          format: uuid
          description: Valideur (`decided_by` de la demande d'approbation).
    DeviceJournalImport:
      type: object
      required: [batches, reason]
      properties:
        batches:
          type: array
          minItems: 1
          description: Lots exportés par l'application du terminal, dans l'ordre des numéros, signatures d'origine.
          items:
            $ref: '#/components/schemas/OfflineBatch'
        reason:
          type: string
          minLength: 10
    DeviceJournalImportResult:
      type: object
      description: Résultat de `importDeviceJournal`, renvoyé dans `ApprovalRequest.result` à l'exécution.
      required: [device_id, results]
      properties:
        device_id:
          type: string
          format: uuid
        results:
          type: array
          items:
            $ref: '#/components/schemas/OfflineBatchResult'

    # ------------------------------------------------------------ Demandes d'approbation (ADR-74)
    ApprovalAction:
      type: string
      description: |
        Action d'une demande d'approbation (`approval_request.action`, liste fermée du schéma). Correspondance :
        `WAIVE_SEQ_GAP` → `waiveSeqGap` ; `DEVICE_JOURNAL_IMPORT` → `importDeviceJournal` ; `KYC_REVOCATION` →
        `revokeKycVerification` ; `WALLET_REFUND` → `approveRefundRequest` ; `LATE_CLAIM` → `postLateClaim` ;
        `FORCE_CENTRAL_AUTHORITY` → `requestDebitAuthorityChange` (`force = true`). `ADJUSTMENT`,
        `ANOMALY_RESOLUTION`, `REINSTATE_MEDIA`, `PAYOUT` : opérations
        du back-office à ajouter au contrat (SPECIFICATION §10.4), qui suivent le même flux.
        Configuration (deux personnes du même rôle) : `EVENT_GO_LIVE` → `transitionEventStatus` (vers `LIVE`) ;
        `EVENT_SETTINGS_CHANGE` et `EVENT_OPERATOR_SETTINGS_CHANGE` → `updateEvent` (événement `LIVE`, réglages de
        l'organisateur ou du prestataire) ; `PARTICIPATION_CHANGE` → `createParticipation`, `updateParticipation`
        (événement `LIVE`) ; `FEE_RULE_CHANGE` → `createFeeRule`, `replaceFeeRule` (événement `LIVE`) ;
        `CONTRACT_VERSION` → `createOrganizerContractVersion`. Niveau plateforme (demande sans prestataire, décidée
        par un autre `PLATFORM_ADMIN`) : `PLATFORM_CONTRACT_VERSION` → `createPlatformContractVersion` ;
        `JURISDICTION_LIMITS_CHANGE` → `createJurisdictionProfileVersion` (plafond réglementaire modifié).
        Bracelets : `TAG_KEY_CREATE` → `requestTagKey` ; `TAG_DEK_ROTATE` → `requestDekRotation` ; `TAG_KEY_RETIRE` →
        `requestTagKeyRetirement` ; `REINSTATE_MEDIA` → `requestMediaReinstatement`.
        Recharges et caisses (deux personnes, auteur et valideur distincts) : `CASH_DEPOSIT` → `requestCashDeposit`
        (charge `{ledger_id, amount, bank_reference}`) ; `WALLET_UNBLOCK` → `requestWalletUnblock` (charge
        `{wallet_id}`) ; `LATE_CHARGEBACK` → `requestLateChargeback` ; `PSP_CONFIGURATION` →
        `requestPspConfigurationChange` (charge `{psp_config_id, compliance_ref}` pour l'activation,
        `{psp_config_id, status: SUSPENDED}` pour la suspension) ; `EVENT_PSP_SELECTION` → `setEventPspSelection`
        (événement `LIVE`).
        Paiements : `SALE_REVERSAL` → `reversePayment` (back-office, deux personnes, source `BACKOFFICE` ; demandée
        par un `SUPERVISOR` ou un `ORGANIZER_ADMIN` de l'événement de la vente, approuvée par une seconde personne).
      enum: [LATE_CLAIM, ADJUSTMENT, ANOMALY_RESOLUTION, WAIVE_SEQ_GAP, FORCE_CENTRAL_AUTHORITY, REINSTATE_MEDIA, PAYOUT, DEVICE_JOURNAL_IMPORT, KYC_REVOCATION, PSP_CONFIGURATION, EVENT_PSP_SELECTION, WALLET_REFUND, LATE_CHARGEBACK,
             WALLET_UNBLOCK, CASH_DEPOSIT,
             EVENT_GO_LIVE, EVENT_SETTINGS_CHANGE, EVENT_OPERATOR_SETTINGS_CHANGE, PARTICIPATION_CHANGE, FEE_RULE_CHANGE,
             CONTRACT_VERSION, PLATFORM_CONTRACT_VERSION, JURISDICTION_LIMITS_CHANGE,
             TAG_KEY_CREATE, TAG_DEK_ROTATE, TAG_KEY_RETIRE, SALE_REVERSAL]
    ApprovalRequestStatus:
      type: string
      description: |
        `PENDING` → `APPROVED` | `REJECTED` | `EXPIRED` ; `APPROVED` → `EXECUTED` | `FAILED` (garde de la base).
        `APPROVED` est un état de passage : `approveApprovalRequest` exécute l'action dans la foulée.
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, EXECUTED, FAILED]
    ApprovalRequest:
      type: object
      description: |
        Demande d'approbation du back-office (`approval_request`, schéma section 18h). Le contenu (`action`,
        `target_id`, `payload`, auteur, dates) est figé à la création. `payload` contient les paramètres exacts de
        l'opération (chemin et corps), et la clé d'idempotence de l'appel qui a créé la demande, réutilisée pour
        les écritures de l'exécution : l'action n'est écrite qu'une fois.
      required: [approval_request_id, action, payload, requested_by, requested_at, expires_at, status]
      properties:
        approval_request_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/ApprovalAction'
        target_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Objet visé (terminal, identification, grand livre, demande de remboursement…).
        payload:
          type: object
          additionalProperties: true
          description: Paramètres exacts de l'action, figés.
        requested_by:
          type: string
          format: uuid
          description: Auteur (`sub` de la session qui a créé la demande).
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: '`requested_at` + 24 h.'
        status:
          $ref: '#/components/schemas/ApprovalRequestStatus'
        decided_by:
          type:
            - string
            - 'null'
          format: uuid
          description: Valideur (`sub` de la session de la seconde personne), toujours ≠ `requested_by`.
        decided_at:
          type:
            - string
            - 'null'
          format: date-time
        decision_note:
          type:
            - string
            - 'null'
        executed_tx_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Transaction écrite par l'exécution, s'il y en a une.
        result:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: |
            Si `EXECUTED` : réponse de l'opération exécutée (`SeqStatus`, `DeviceJournalImportResult`,
            `KycVerification`, `RefundRequest`, `LateClaimResult`, `DebitAuthorityState` selon l'action).
        failure_code:
          oneOf:
            - $ref: '#/components/schemas/ProblemCode'
            - type: 'null'
          description: "Si `FAILED` : code du refus à l'exécution."
        failure_reason:
          type:
            - string
            - 'null'
          description: "Si `FAILED` : raison lisible."
    ApprovalDecision:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
    ApprovalRejection:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 5
          maxLength: 2000

    # ------------------------------------------------------------ Intentions de paiement
    PaymentIntentStatus:
      type: string
      enum: [REQUIRES_PAYMENT, AUTHORIZED, SUCCEEDED, CANCELLED, EXPIRED, FAILED]
    PaymentIntentCreate:
      type: object
      required: [amount, currency, pos_id]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        pos_id:
