  /topups/psp/{topup_id}/cancel:
    post:
      tags: [Recharges]
      operationId: cancelPspTopup
      summary: Annuler une recharge PSP en attente
      description: |
        Réservé au demandeur : le festivalier qui l'a initiée, ou le guichet (même terminal et même personne).
        La recharge passe `PENDING` → `CANCELLED` SEULEMENT si le PSP confirme l'annulation ; sinon
        `409 CONFLICT_STATE` (recharge déjà terminée, ou annulation non confirmée). Un succès notifié ensuite par
        le PSP est traité comme non crédité (motif `CANCELLED`, anomalie `PSP_TOPUP_NOT_CREDITED`). Recharge d'une
        autre personne ou d'un autre prestataire : `404`.
      security:
        - deviceMtls: []
          deviceToken: []
          deviceSignature: []
          staffBearer: []
        - humanBearer: []
      parameters:
