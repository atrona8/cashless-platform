                status: SUCCEEDED
                provider: WAVE
                provider_reference: WV-88121
                amount: 20000
                currency: XOF
                wallet_id: a1b2c3d4-e5f6-4789-8abc-def012345678
                checkout_url: null
                expires_at: '2026-12-01T10:27:00Z'
                transaction_id: 1f2a3b4c-5d6e-4f7a-8b9c-0d1e2f3a4b5c
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
