    EventStatus:
      type: string
      description: Statut d'un événement (§12.1). Ne change que par `transitionEventStatus`.
      enum: [DRAFT, LIVE, CLOSING, RECONCILING, SETTLING, REFUND_WINDOW, CLOSED]
    JurisdictionProfile:
      type: object
      description: |
        Version d'un profil de législation (`jurisdiction_profile`, §4.1) : règles d'un pays qui bornent la
        configuration. Jamais modifiée ; une nouvelle version la remplace à sa date d'effet. Montants en unités
        mineures de la devise du pays.
      required: [profile_id, country_code, version, valid_from, breakage_destination, late_claim_years, rules, provisional_fields]
      properties:
        profile_id:
          type: string
          format: uuid
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
        version:
          type: integer
          minimum: 1
        valid_from:
          type: string
          format: date
        min_refund_window_days:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Délai minimal de remboursement après la fin de l'événement ; `null` = pas d'obligation.
        breakage_destination:
          type: string
          enum: [ORGANIZER, OPERATOR, LEGAL_ACCOUNT, NONE]
          description: Destination des soldes non réclamés (§5.5).
        max_wallet_balance:
          type:
            - integer
            - 'null'
          format: int64
          description: Plafond de solde d'un client identifié ; `null` = aucun.
        kyc_threshold:
          type:
            - integer
            - 'null'
          format: int64
        unidentified_max_balance:
          type:
            - integer
            - 'null'
          format: int64
        unidentified_monthly_limit:
          type:
            - integer
            - 'null'
          format: int64
        identified_monthly_limit:
          type:
            - integer
            - 'null'
          format: int64
        late_claim_years:
          type: integer
          minimum: 0
          maximum: 10
          description: Années de réclamation tardive après la clôture (ADR-67) ; 0 = casse définitive.
        rules:
          type: object
          additionalProperties: true
          description: Taxes (`taxes`), arrondis et autres règles du pays.
        provisional_fields:
          type: array
          description: Champs dont la valeur est un défaut provisoire de §17.2, à confirmer ; vide si tout a été saisi.
          items:
            type: object
            required: [field, confirm_by]
            properties:
              field:
                type: string
              confirm_by:
                type: string
                description: Personne qui doit confirmer la valeur (juriste, expert-comptable, porteur).
    JurisdictionProfileCreate:
      type: object
      description: |
        Contenu d'une version de profil. `country_code` est obligatoire à la création du profil d'un pays et ignoré
        pour une nouvelle version (pays du profil du chemin). Un champ omis prend son défaut provisoire (§17.2).
      required: [valid_from]
      additionalProperties: false
      properties:
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
        valid_from:
          type: string
          format: date
        min_refund_window_days:
          type:
            - integer
            - 'null'
          minimum: 0
        breakage_destination:
          type: string
          enum: [ORGANIZER, OPERATOR, LEGAL_ACCOUNT, NONE]
        max_wallet_balance:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        kyc_threshold:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        unidentified_max_balance:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        unidentified_monthly_limit:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        identified_monthly_limit:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        late_claim_years:
          type: integer
          minimum: 0
          maximum: 10
        rules:
          type: object
          additionalProperties: true
