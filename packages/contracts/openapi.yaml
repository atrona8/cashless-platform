                pwd_pack_key:
                  alg: ECDH-ES+HKDF-SHA256+A256KW
                  epk: BGx1...base64url
                  wrapped_key: 2b3c...base64url
                entries:
                  - token_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
