openapi: 3.1.0
info:
  title: API Cashless multi-tenant
  version: 1.0.0
  summary: API centrale (et sous-ensemble servi par la passerelle locale) du système cashless par bracelets NFC.
  description: |
    API de référence du système cashless multi-tenant (bracelets NFC MIFARE Ultralight EV1, QR, festivals).
    Elle est implémentée en NestJS (TypeScript) sur PostgreSQL ; le schéma de référence est `schema_grand_livre_cashless.sql`
    et le protocole hors ligne / passerelle est décrit dans `sync_protocol.md` (normatif).

    ## Conventions générales
    - **Multi-tenant** : le prestataire (`operator_id`) n'est JAMAIS passé en paramètre ; il est dérivé de la
      personne ou de l'appareil authentifié (JWT humain, jeton d'appareil, certificat mTLS, client POS). L'API
      positionne `app.operator_id` pour la Row Level Security avant toute requête. Un objet d'un autre prestataire
      répond `404 NOT_FOUND` (réponse neutre, identique à « n'existe pas »). Exception : les routes de gestion
      `/operators/{operator_id}/…` (tag `Personnes`) nomment le prestataire visé, pour qu'un `PLATFORM_ADMIN` (sans
      prestataire) puisse agir ; pour toute autre personne, ce prestataire DOIT être le sien (sinon `404`).
    - **Montants** : entiers en unités mineures (`int64`) + devise ISO 4217 ; une seule devise par événement.
      Un montant envoyé dans une autre devise que celle de l'événement est refusé (`CURRENCY_MISMATCH`).
    - **Horodatage** : RFC 3339 en UTC. `occurred_at` = heure réelle au terminal ; `recorded_at` = heure serveur.
    - **Idempotence** : toute opération qui écrit dans le grand livre ou crée un objet exige l'en-tête
      `Idempotency-Key`. Pour un terminal, la clé DOIT être `<device_serial>:<seq>` (seq sur au moins 4 chiffres,
      ex. `TPE-BAR-01:0003`) et devient telle quelle `journal_transaction.idempotency_key`. Pour les autres
      clients, la clé est libre (UUID recommandé) et le serveur la préfixe (`app:`, `pos:<client_id>:`, `bo:`).
      Un rejeu à l'identique renvoie la réponse d'origine avec `Idempotency-Replayed: true` ; un rejeu avec un
      contenu différent renvoie `409 IDEMPOTENCY_KEY_REUSED` ; une requête concurrente avec la même clé renvoie
      `409 IDEMPOTENCY_KEY_IN_PROGRESS`. Exception : la clé d'un lot (`POST /offline-batches`,
      `POST /edge/sync-batches`) est son `batch_id` (UUID v4, sync_protocol.md §6.1) ; chaque opération du lot
      garde sa propre clé `<serial>:<seq>`.
    - **Traçabilité** : `X-Request-Id` (UUID) est accepté en entrée, généré sinon, et toujours renvoyé.
    - **Langue** : `Accept-Language` (`fr`, `en` ; défaut `fr`) choisit la langue de `title` et `detail` des
      erreurs et des libellés renvoyés. Il n'a aucun effet sur les codes (`code`, statuts, énumérations).
    - **Erreurs** : RFC 9457 `application/problem+json`, avec un champ `code` stable (voir `ProblemCode`).
    - **Pagination** : par curseur opaque (`cursor`, `limit`) ; la réponse porte `next_cursor` et `has_more`.
    - **Passerelle locale** : les opérations marquées `x-edge-available: true` sont aussi servies, à l'identique,
      par la passerelle sur le LAN du site quand `ledger.debit_authority = EDGE`.
    - **Lecture du bracelet** : `POST /taps` renvoie un `tap_id` (`register_tap`). Une écriture consomme ce passage
      par `consume_tap` : un passage sert à UNE écriture (rejeu de la même écriture accepté). Passage déjà utilisé
      par une autre écriture, ou écriture en ligne plus de `tap_replay_window_seconds` (défaut 120 s) après la
      lecture : `409 TAP_UNUSABLE` (`CL022`).
    - **Double validation** (ADR-74, SPECIFICATION §3.2) : le valideur vient toujours d'une authentification de la
      seconde personne, jamais du corps de la requête. Un champ `approved_by` reçu dans un corps est IGNORÉ.
      - Au guichet (immédiat) : jeton d'approbation sur place, en-tête `X-Approval-Token` (paramètre
        `ApprovalToken`). La seconde personne saisit son code personnel sur le même terminal ; le serveur
        d'identité (OIDC, authentification renforcée) délivre un jeton de 5 min, à usage unique (`jti`), lié à
        l'action (`act` = operationId, `act_hash` = SHA-256 de la requête canonique). Le valideur transmis à la
        base est le `sub` du jeton. Jeton absent quand il est requis : `403 APPROVAL_REQUIRED` ; jeton refusé :
        `403 APPROVAL_INVALID`. Opérations : `refundCashDue` et `releaseMedia` au-delà de
        `event.cash_refund_single_max`.
      - Au back-office (asynchrone) : demande puis approbation. L'appel d'une opération à deux personnes ne
        l'exécute pas : il crée une demande (`ApprovalRequest`, expiration 24 h, paramètres figés) et répond
        `202 Accepted`. Une seconde personne connectée, avec le rôle exigé par l'action, l'approuve
        (`approveApprovalRequest` : décision puis exécution unique, avec le `sub` de SA session comme valideur)
        ou la refuse (`rejectApprovalRequest`). Demande expirée, déjà décidée ou décidée par son auteur :
        `409 APPROVAL_INVALID` (`CL023`). Opérations : `waiveSeqGap`, `importDeviceJournal`,
        `revokeKycVerification`, `approveRefundRequest`, `postLateClaim`, `requestDebitAuthorityChange` avec
        `force = true`.
      - Règle des statuts : `403` quand la preuve jointe à la requête (le jeton) manque ou ne vaut rien ;
        `409` quand une demande enregistrée n'est plus dans un état qui permet la décision.
      - Empreinte de la requête liée au jeton sur place :
        `act_hash = hex(SHA-256(METHOD ‖ LF ‖ PATH ‖ LF ‖ JCS(body ?? null)))`, LF = saut de ligne (`\n`) ;
        `METHOD` en majuscules, `PATH` = chemin réel avec le préfixe `/v1`, sans chaîne de requête, corps en JSON canonique RFC 8785 (`null` si
        absent) ; l'en-tête du jeton n'entre pas dans le calcul.

    ## Statut de l'événement et écritures acceptées
    Résumé de ce que la base impose (`set_event_status`, `post_transaction`, `lock_settled_ledger`) ; le détail
    des types acceptés par statut est dans SPECIFICATION §12.1.
    - `DRAFT`, `LIVE` : grand livre `OPEN`. `BREAKAGE` n'est jamais accepté en `LIVE`. `BREAKAGE_REVERSAL` exige une
      casse antérieure sur le même portefeuille (bornes ADR-75, `409 LATE_CLAIM_INVALID`).
    - `CLOSING` à `REFUND_WINDOW` : grand livre `CLOSING` ; recharges et ventes de source `ONLINE` refusées
      (`409 EVENT_CLOSING`, `CL004`). À partir de `RECONCILING`, l'autorité de débit DOIT être `CENTRAL`
      (sinon `409 CLOSING_CONDITION_NOT_MET`, `CL019`).
    - `CLOSED` : la base exige que toutes les positions soient soldées, par partie (droit net) ou par compte sans
      titulaire, sauf les soldes restants autorisés : compte légal de casse, et, si la casse est `NONE`, soldes des
      festivaliers et espèces dues (`L-ESP-A-RENDRE`). Sans solde restant, le grand livre passe `LOCKED` dans la
      même transaction. Avec des soldes restants, il reste `CLOSING`, `locked_until` = date de clôture, et passe
      `LOCKED` par `lock_settled_ledger` quand tout est soldé.
    - Grand livre `LOCKED` : toute écriture est refusée (`409 LEDGER_LOCKED`, `CL003`), sauf les réclamations
      tardives (casse réversible, ADR-67) : `BREAKAGE_REVERSAL`, `ADJUSTMENT` et `WALLET_REFUND`, de source
      `BACKOFFICE`, à deux personnes, jusqu'à `ledger.late_claims_until` (voir `postLateClaim`).

    ## Sécurité
    - `humanBearer` : JWT (OIDC) pour les humains ; rôles de SPECIFICATION §3.2 : `PLATFORM_ADMIN`,
      `OPERATOR_ADMIN`, `ORGANIZER_ADMIN`, `SUPERVISOR`, `CASHIER`, `MERCHANT_ADMIN`, `VENDOR`, `CUSTOMER`.
    - **Authentification des personnes** : le jeton prouve seulement l'identité (`iss`, `sub`, signature,
      audience, expiration). Le prestataire, le statut et les rôles (avec leur portée) sont tirés de la plateforme
      à chaque requête, jamais du jeton : un claim `roles` est ignoré ; un claim `operator_id`, s'il est présent,
      doit être celui de la personne (sinon `401`).
    - `deviceToken` : jeton d'appareil (JWT court, 15 min) délivré à l'enrôlement / au rafraîchissement,
      lié à la clé de l'appareil (claim `cnf`). `deviceMtls` : certificat client délivré à l'enrôlement.
      Un terminal utilise l'un OU l'autre ; en production, mTLS + jeton lié est RECOMMANDÉ.
    - `posClient` : OAuth 2.0 client credentials pour les POS tiers (intentions de paiement).
    - `pspHmac` : signature HMAC-SHA256 des webhooks entrants des PSP.
    - `edgeMtls` : certificat client de la passerelle locale.
  contact:
    name: Équipe plateforme cashless
    email: api@cashless.test
  license:
    name: Propriétaire
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.cashless.test/v1
    description: API centrale
  - url: https://edge.local:8443/v1
    description: Passerelle locale (LAN du site), sous-ensemble x-edge-available
tags:
  - name: Terminaux
    description: Enrôlement (sans MDM, ADR-69), jetons d'appareil, configuration, battement de cœur.
  - name: Bracelets
    description: Lecture de bracelet (tap), clés d'authentification NFC, activation, caution, restitution.
  - name: Paiements
    description: Paiement en ligne par bracelet ou QR client, annulation (REVERSAL).
  - name: Recharges
    description: Recharge en espèces en caisse (TOPUP_CASH) et recharge PSP (TOPUP).
  - name: Webhooks PSP
    description: Notifications entrantes Wave, Orange Money, carte (source PSP_WEBHOOK).
  - name: Hors ligne
    description: Snapshot signé, lots d'opérations hors ligne, état des séquences.
  - name: Intentions de paiement
    description: '**V2 — hors périmètre V1 (ADR-43).** Intégration des POS tiers (création, capture, annulation, webhooks sortants).'
  - name: Demandes de paiement QR
    description: payment_request MERCHANT_QR et CUSTOMER_QR.
  - name: App client
    description: Authentification, portefeuilles, historique, rattachement de bracelet, remboursement.
  - name: Remboursements
    description: Traitement des demandes de remboursement et des réclamations tardives par le back-office.
  - name: Approbations
    description: Demandes d'approbation du back-office (deux personnes, ADR-74) — liste, consultation, approbation et exécution, refus.
  - name: Personnes
    description: Personnes du personnel, attributions de rôles par portée, administrateurs de la plateforme.
  - name: Guichet
    description: Sessions de caisse et identification des festivaliers (KYC) au guichet.
  - name: Passerelle
    description: Autorité de débit CENTRAL ↔ EDGE, réplication et resynchronisation de la passerelle.
  - name: Webhooks sortants
    description: '**V2 — hors périmètre V1 (ADR-43).** Abonnements des POS tiers aux événements.'

security:
  - humanBearer: []

paths:
  # ---------------------------------------------------------------- Terminaux
  /device-enrollment-codes:
    post:
      tags: [Terminaux]
      operationId: createDeviceEnrollmentCode
      summary: Créer un code d'enrôlement à usage unique
      description: |
        Réservé à `OPERATOR_ADMIN` / `ORGANIZER_ADMIN`. Pas de MDM (ADR-69) : le code est affiché en QR dans le
        back-office et scanné par l'app du terminal, ou saisi à la main. Usage unique, durée de vie courte (défaut 24 h), lié au prestataire et
        optionnellement à un événement, un point de vente et un mode d'application.
        `app_mode = PAIRED_TPE` (V2, ADR-43) est refusé en V1 : `422 DEVICE_MODE_NOT_ALLOWED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCodeCreate'
            example:
              event_id: 7b1e4a52-8f0c-4c1d-9d3e-2a6b0f1c9e11
              pos_id: 0c6f0d7e-11aa-4b8b-9c3e-5d2f1a7b8c90
              app_mode: CATALOG_POS
              kind: POS
              expires_in_seconds: 86400
      responses:
        '201':
          description: Code créé (affiché une seule fois).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCode'
              example:
                enrollment_code_id: 5a0c2c1e-0b9d-4b1e-8f7f-3f0e8d1d2c33
                code: K7PQ-4XZM-9RTA
                expires_at: '2026-12-10T08:00:00Z'
                app_mode: CATALOG_POS
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /device-enrollments:
    post:
      tags: [Terminaux]
      operationId: enrollDevice
      summary: Enrôler un terminal (code à usage unique → identité d'appareil)
      description: |
        Le terminal génère dans l'Android Keystore (StrongBox si disponible) une clé de signature ECDSA P-256
        non exportable et une clé d'accord ECDH P-256 (chiffrement des PWD/PACK et du snapshot), puis envoie
        les clés publiques, la chaîne d'attestation de clé et un CSR. Le serveur vérifie le code (usage unique),
        l'attestation (clé dans le matériel sécurisé, bootloader verrouillé, application signée et intacte), crée ou met à jour
        `device` (serial, public_key, status ACTIVE), et renvoie un certificat client
        (mTLS), un jeton d'appareil et un jeton de rafraîchissement.
        `next_seq` indique le premier numéro de séquence utilisable (jamais inférieur à `device.last_seq + 1`,
        voir sync_protocol.md §3).
        Pas de MDM (ADR-69) : un téléphone personnel (`device.personal_phone = true`) n'a jamais le hors ligne
        (`offline_enabled = false` dans sa politique effective).
        Refus : code inconnu ou déjà utilisé (`422 ENROLLMENT_CODE_INVALID`), expiré (`422 ENROLLMENT_CODE_EXPIRED`),
        attestation non conforme (`422 ATTESTATION_FAILED`), mode d'application `PAIRED_TPE` (V2, ADR-43)
        ou non permis pour ce type de terminal (`422 DEVICE_MODE_NOT_ALLOWED`).
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnrollmentRequest'
            example:
              enrollment_code: K7PQ-4XZM-9RTA
              serial: TPE-FOOD-02
              os: ANDROID
              app_version: 1.4.2
              signing_public_key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE4Zm2Lq9c0kqg8n1dXo3f0cC1mW3Qq1l3Zt6m2xY3fQ9m8u0X4bP0dL2c7aQ5eR9tY1uI3oP5aS7dF9gH1jK3lA==
              agreement_public_key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEq1l3Zt6m2xY3fQ9m8u0X4bP0dL2c7aQ5eR9tY1uI3oP5aS7dF9gH1jK3lA4Zm2Lq9c0kqg8n1dXo3f0cC1mW3Q==
              key_attestation_chain:
                - MIIC...leaf
                - MIIC...intermediate
              csr_pem: "-----BEGIN CERTIFICATE REQUEST-----\nMIIB...\n-----END CERTIFICATE REQUEST-----"
      responses:
        '201':
          description: Terminal enrôlé.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnrollmentResponse'
              example:
                device_id: 3f7d2c10-6a55-4b6e-9d0e-1c2b3a4d5e6f
                serial: TPE-FOOD-02
                certificate_pem: "-----BEGIN CERTIFICATE-----\nMIIC...\n-----END CERTIFICATE-----"
                access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImRldi0yMDI2In0.eyJzdWIiOiIzZjdkMmMxMCJ9.sig
                token_type: Bearer
                expires_in: 900
                refresh_token: drt_2wq0mXn9vBv4c1s8u7yT
                next_seq: 1
                server_time: '2026-12-09T08:12:03Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /device-tokens/refresh:
    post:
      tags: [Terminaux]
      operationId: refreshDeviceToken
      summary: Rafraîchir le jeton d'appareil
      description: |
        Le terminal présente son jeton de rafraîchissement ET une preuve de possession : signature ECDSA P-256
        (clé Keystore) de `nonce || serial || refresh_token`. Le jeton de rafraîchissement est à rotation
        (usage unique) ; la réutilisation d'un jeton déjà consommé révoque toute la famille (vol présumé).
        Un appareil `SUSPENDED` ou `REVOKED` reçoit `403 DEVICE_SUSPENDED` / `DEVICE_REVOKED`.
      security: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRefreshRequest'
            example:
              serial: TPE-FOOD-02
              refresh_token: drt_2wq0mXn9vBv4c1s8u7yT
              nonce: 6f1c2b8e9a0d4e7f
              signature: MEUCIQDx...base64
      responses:
        '200':
          description: Nouveau jeton.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiIzZjdkIn0.sig
                token_type: Bearer
                expires_in: 900
                refresh_token: drt_9pL0aQ2wE4rT6yU8iO1p
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /device/config:
    get:
      tags: [Terminaux]
      operationId: getDeviceConfig
      summary: Configuration du terminal
      description: |
        Configuration complète du terminal appelant : affectation (événement, devise, point de vente,
        station), mode d'application, catalogue, politique hors ligne effective (`effective_offline_policy`),
        clés publiques de vérification du snapshot (ECDSA P-256 par défaut), autorité de débit courante et époque,
        heure serveur (pour la correction d'horloge). Supporte `If-None-Match` (ETag).
      security:
        - deviceMtls: []
        - deviceToken: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag de la dernière configuration reçue.
      responses:
        '200':
          description: Configuration.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConfig'
              example:
                config_id: 48213
                terminal_settings:
                  online_connect_timeout_ms: 2000
                  online_total_timeout_ms: 3000
                  online_retries: 2
                  pending_sync_seconds: 30
                  reconcile_sync_seconds: 300
                  heartbeat_seconds: 60
                  reversal_window_minutes: 15
                  local_retention_days: 7
                  tap_replay_window_seconds: 120
                device:
                  device_id: 3f7d2c10-6a55-4b6e-9d0e-1c2b3a4d5e6f
                  serial: TPE-FOOD-02
                  kind: POS
                  app_mode: CATALOG_POS
                  os: ANDROID
                  nfc_enabled: true
                  status: ACTIVE
                  station_name: null
                event:
                  event_id: 7b1e4a52-8f0c-4c1d-9d3e-2a6b0f1c9e11
                  name: Festival Sons 2026
                  currency: XOF
                  minor_units: 0
                  timezone: Africa/Dakar
                  status: LIVE
                  activation_modes: [DESK, SELF_APP]
                pos:
                  pos_id: 0c6f0d7e-11aa-4b8b-9c3e-5d2f1a7b8c90
                  name: Food truck — comptoir 2
                  merchant_name: Food truck
                catalog:
                  version: 12
                  items:
                    - product_id: 9d1b7a4c-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                      name: Thiéboudienne
                      unit_price: 3000
                      category: Plats
                      vat_rate_bps: 1800
                    - product_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      name: Bissap 33 cl
                      unit_price: 1000
                      category: Boissons
                      vat_rate_bps: 1800
                offline_policy:
                  offline_enabled: true
                  max_per_sale: 15000
                  max_per_media_per_device: 20000
                  max_total_per_device: 300000
                  max_snapshot_age_seconds: 900
                  cash_topup_offline: false
                  capped: false
                snapshot_keys:
                  - key_id: snap-2026-01
                    algorithm: ECDSA_P256_SHA256
                    public_key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7vN2kq9Lr0c1mW3Qq1l3Zt6m2xY3fQ9m8u0X4bP0dL2c7aQ5eR9tY1uI3oP5aS7dF9gH1jK3lA4Zm2Lq9c0kqg==
                    not_after: '2027-06-30T00:00:00Z'
                debit_authority:
                  ledger_id: 2c9a1f0e-3b4d-4e5f-8a7b-6c5d4e3f2a1b
                  authority: CENTRAL
                  epoch: 4
                  edge_gateway_id: null
                  edge_base_url: null
                seq:
                  next_seq_floor: 88
                  contiguous_acked_seq: 87
                server_time: '2026-12-13T21:00:00Z'
                clock_tolerance_seconds: 120
        '304':
          description: Configuration inchangée.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /device/heartbeat:
    post:
      tags: [Terminaux]
      operationId: postDeviceHeartbeat
      summary: Battement de cœur du terminal
      description: |
        Envoyé toutes les `heartbeat_seconds` (réglage de l'événement, défaut 60 s) quand le réseau est
        disponible. Met à jour `device.last_seen_at`,
        informe le serveur de la file d'attente locale (opérations non acquittées) et renvoie l'heure serveur,
        l'ETag de configuration, l'autorité de débit et la dernière version de snapshot disponible.
      security:
        - deviceMtls: []
        - deviceToken: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
            example:
              device_time: '2026-12-13T21:00:01Z'
              snapshot_version: 1532
              last_local_seq: 91
              pending_operations: 4
              pending_exposure: 12500
              battery_percent: 64
              app_version: 1.4.2
      responses:
        '200':
          description: Accusé.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
              example:
                server_time: '2026-12-13T21:00:00Z'
                config_etag: '"cfg-7f3a"'
                latest_snapshot_version: 1534
                debit_authority:
                  ledger_id: 2c9a1f0e-3b4d-4e5f-8a7b-6c5d4e3f2a1b
                  authority: CENTRAL
                  epoch: 4
                  edge_gateway_id: null
                  edge_base_url: null
                sync_requested: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /device/seq-status:
    get:
      tags: [Hors ligne]
      operationId: getDeviceSeqStatus
      summary: État des séquences du terminal vu par le serveur
      description: |
        Renvoie le plus grand numéro de séquence reçu sans trou (`contiguous_acked_seq`), le plus grand reçu
        (`max_seen_seq`) et la liste des trous connus. Utilisé à la reprise après coupure
        (sync_protocol.md §6).
      security:
        - deviceMtls: []
        - deviceToken: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: État des séquences.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeqStatus'
              example:
                device_serial: TPE-FOOD-02
                contiguous_acked_seq: 85
                max_seen_seq: 91
                missing_seqs: [86]
                next_seq_floor: 92
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/{event_id}/device-sync-status:
    get:
      tags: [Hors ligne]
      operationId: getEventDeviceSyncStatus
      summary: Remontée des terminaux d'un événement avant le règlement (back-office)
      description: |
        Renvoie, pour chaque terminal de l'événement, s'il est à jour (`event_device_sync_status`, ADR-73) et la
        date limite de synchronisation (`event_sync_deadline` : fin de l'événement, ou passage en `CLOSING`,
        plus `event.sync_deadline_hours`, 72 h par défaut). Avant cette date, le passage à `SETTLING` est refusé
        (`409 CLOSING_CONDITION_NOT_MET`, `CL019`) tant qu'un terminal n'est pas à jour ; après, il est permis et
        les opérations arrivées ensuite suivent la règle des synchronisations tardives (ADR-49).
        Raisons : `NOT_SEEN_SINCE_CLOSING`, `SEQ_GAP`, `BATCH_IN_PROGRESS`. Exclus : terminaux révoqués et
        téléphones personnels.
      security:
        - humanBearer: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: État de remontée.
          content:
            application/json:
              schema:
                type: object
                required: [sync_deadline, devices]
                properties:
                  sync_deadline:
                    type: [string, 'null']
                    format: date-time
                  devices:
                    type: array
                    items:
                      type: object
                      required: [device_id, serial, caught_up]
                      properties:
                        device_id: {type: string, format: uuid}
                        serial: {type: string}
                        caught_up: {type: boolean}
                        reason:
                          type: [string, 'null']
                          enum: [NOT_SEEN_SINCE_CLOSING, SEQ_GAP, BATCH_IN_PROGRESS, null]
              example:
                sync_deadline: '2026-07-14T02:00:00Z'
                devices:
                  - {device_id: 7c0e1a52-0000-4000-8000-000000000001, serial: TPE-BAR-01, caught_up: true, reason: null}
                  - {device_id: 7c0e1a52-0000-4000-8000-000000000002, serial: TPE-FOOD-02, caught_up: false, reason: NOT_SEEN_SINCE_CLOSING}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{device_id}/seq-gaps/{seq}/waive:
    post:
      tags: [Hors ligne]
      operationId: waiveSeqGap
      summary: Lever un trou de séquence (back-office, deux personnes)
      description: |
        Clôt un trou de séquence dont le terminal a définitivement perdu l'opération (stockage détruit).
        Exige `SUPERVISOR`. Opération à deux personnes du back-office (ADR-74, SPECIFICATION §3.2) : l'appel crée une demande
        d'approbation (action `WAIVE_SEQ_GAP`) et répond `202` avec la demande `PENDING` ; rien n'est exécuté.
        Une seconde personne `SUPERVISOR` (≠ appelant) l'approuve par `approveApprovalRequest`, qui exécute
        l'action une seule fois avec elle comme valideur et renvoie le `SeqStatus` dans `result`.
        À l'exécution, l'anomalie `SEQ_GAP` est passée `RESOLVED` ; aucune écriture comptable n'est produite.
        Un numéro qui n'est pas un trou connu (déjà reçu, ou au-delà de `max_seen_seq`) est refusé :
        `409 SEQ_GAP_NOT_FOUND` (SQLSTATE `CL012`). Un numéro couvert par un lot encore en cours de traitement est
        refusé : `409 BATCH_IN_PROGRESS` (`CL010`). Ces contrôles sont faits à la création de la demande, puis de
        nouveau à l'exécution (la demande passe alors `FAILED`, avec le code dans `failure_code`).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: seq
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
            example:
              reason: Terminal réinitialisé en usine après chute, journal local perdu.
      responses:
        '202':
          $ref: '#/components/responses/ApprovalRequestAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /devices/{device_id}/journal-imports:
    post:
      tags: [Hors ligne]
      operationId: importDeviceJournal
      summary: Importer le journal d'un terminal révoqué (back-office, deux personnes)
      description: |
        Un terminal `REVOKED` ne peut plus envoyer de lots. Ses opérations non acquittées restent dues au
        commerçant (I4). Pas de MDM (ADR-69) : un superviseur exporte le journal depuis l'application du
        terminal (écran superviseur) ; l'export a le format des lots (`OfflineBatch`) et reste signé par la clé
        Keystore du terminal. Sans export possible (appareil perdu ou détruit), les numéros deviennent des trous
        levés par `waiveSeqGap`.
        L'API vérifie la signature de chaque lot avec `device.public_key`, recalcule la chaîne depuis le dernier
        `chain_hash` accepté, puis traite chaque opération selon sync_protocol.md §7.1 (`record_device_seq`,
        `post_transaction`, source `OFFLINE_SYNC`). `open_offline_batch` refuse un terminal révoqué : l'import
        ne l'utilise pas. Une opération datée après la révocation est rejetée (`OFFLINE_NOT_ALLOWED`, anomalie
        `NON_COMPLIANT_OPERATION`).
        Exige `SUPERVISOR`. Opération à deux personnes du back-office (ADR-74, SPECIFICATION §3.2) : l'appel crée une demande
        d'approbation (action `DEVICE_JOURNAL_IMPORT`) et répond `202` avec la demande `PENDING` ; rien n'est exécuté.
        Une seconde personne `SUPERVISOR` (≠ appelant) l'approuve par `approveApprovalRequest`, qui exécute
        l'action une seule fois avec elle comme valideur et renvoie le `DeviceJournalImportResult` dans `result`.
        Le serveur vérifie les signatures et la chaîne dès la création de la demande (refus immédiat), puis
        traite les lots à l'exécution. Terminal non `REVOKED` : `409 CONFLICT_STATE` (il envoie ses
        lots lui-même, sync_protocol.md §11 cas 33).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceJournalImport'
      responses:
        '202':
          $ref: '#/components/responses/ApprovalRequestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  # ---------------------------------------------------------------- Bracelets
  /media/auth-keys:
    post:
      tags: [Bracelets]
      operationId: getMediaAuthKey
      summary: Obtenir le PWD/PACK chiffré d'un bracelet (avant PWD_AUTH)
      description: |
        Le terminal lit l'UID (7 octets) et l'index de clé (page 4, octets 2-3, format B) puis demande le
        PWD||PACK du tag. Le serveur retrouve `media` par `(operator_id, nfc_uid)`, déchiffre `pwd_pack_enc`
        avec la DEK (`tag_data_key`, un seul Decrypt KMS mis en cache mémoire) et le re-chiffre pour ce
        terminal : ECDH-ES P-256 (clé d'accord de l'appareil) + HKDF-SHA256 + AES-256-GCM,
        AAD = `"CASHLESS/PWDPACK/DEV/v1" || device_id || nfc_uid`. Le PWD n'est jamais transmis en clair et
        n'est jamais persisté par le terminal hors du snapshot chiffré.
        Pour un UID inconnu, le serveur renvoie `404 MEDIA_UNKNOWN` après un délai constant.
      security:
        - deviceMtls: []
        - deviceToken: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAuthKeyRequest'
            example:
              nfc_uid: 04a1b2c3d4e5f6
              key_index: 1
      responses:
        '200':
          description: PWD||PACK chiffré pour ce terminal.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAuthKey'
              example:
                nfc_uid: 04a1b2c3d4e5f6
                key_index: 1
                enc:
                  alg: ECDH-ES+HKDF-SHA256+A256GCM
                  epk: BGx1...base64url
                  nonce: 3q2+7w0AAAABAAAA
                  ciphertext: V2hhdGV2ZXI
                  tag: pQ1u9hV0Wm6o3vXcZ8r1Tg
                ttl_seconds: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /taps:
    post:
      tags: [Bracelets]
      operationId: createTap
      summary: Enregistrer une lecture de bracelet (register_tap)
      description: |
        Après PWD_AUTH (PACK vérifié), le terminal exécute INCR_CNT puis READ_CNT, lit l'identité opaque de
        16 octets, et envoie `token_hash = sha256(identité)`, l'UID et le compteur. Le serveur appelle
        `register_tap(..., p_mode => 'ONLINE')` et renvoie son résultat, le bracelet et le solde disponible
        si `result = OK`.
        Le terminal lit aussi la signature d'originalité (`READ_SIG`) et l'envoie dans `originality_signature`.
        Le `tap_id` renvoyé (entier, `media_tap.id`) sert à UNE opération (paiement, recharge, activation, caution,
        restitution, rendu d'espèces) sur le MÊME terminal. L'écriture le consomme par `consume_tap`, qui relie
        `media_tap.transaction_id` à l'écriture. Une écriture en ligne doit suivre la lecture de moins de
        `tap_replay_window_seconds` (défaut 120 s) ; au-delà, ou si le passage a déjà servi à une autre écriture :
        `409 TAP_UNUSABLE` (`CL022`). Une opération peut aussi embarquer directement la lecture (`tap`) : le
        serveur appelle alors `register_tap` lui-même (un seul aller-retour).
        Une même lecture (même terminal, même UID, même compteur) jamais utilisée pour une écriture est réutilisée,
        quel que soit le délai. Déjà utilisée : un renvoi réseau reçu dans `tap_replay_window_seconds` (ADR-50)
        reçoit le même résultat, sans anomalie ; au-delà, ou depuis un autre terminal, c'est une copie suspectée
        (`CLONE_SUSPECTED`).
        Codes : `OK`, `UNKNOWN`, `BLOCKED`, `UID_MISMATCH`, `SIGNATURE_MISMATCH`, `SIGNATURE_MISSING`,
        `CLONE_SUSPECTED`, `RETIRED`, `REPLACED`, `NOT_ACTIVATED`, `RELEASED`, `BATCH_INACTIVE`, `WRONG_EVENT`.
        `SIGNATURE_MISMATCH` : signature lue différente de celle de la personnalisation, bracelet mis en liste
        noire. `SIGNATURE_MISSING` : signature absente alors que la puce en a une enregistrée ; le terminal DOIT
        relire le bracelet (pas de liste noire, `tap_id` nul). Un résultat autre que `OK` est une
        réponse 200 (information métier), pas une erreur HTTP.
      security:
        - deviceMtls: []
        - deviceToken: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapInput'
            example:
              nfc_uid: 04a1b2c3d4e5f6
              token_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
              counter: 412
              key_index: 1
              format_major: 1
              format_minor: 0
              pack_verified: true
              originality_signature: 3a7f0c9e5b2d4a6f8e1c3b5d7f9a0c2e4b6d8f0a1c3e5b7d9f0a2c4e6b8d0f1a
              occurred_at: '2026-12-11T19:09:58Z'
      responses:
        '200':
          description: Résultat de la lecture.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapResponse'
              examples:
                ok:
                  summary: Bracelet valide
                  value:
                    tap_id: 918273
                    result: OK
                    tap_expires_at: '2026-12-11T19:11:58Z'
                    media:
                      media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                      status: ACTIVE
                      batch_kind: PUBLIC
                      deposit_status: HELD
                      deposit_held: 2000
                    wallet:
                      wallet_id: a1b2c3d4-e5f6-4789-8abc-def012345678
                      status: ACTIVE
                      currency: XOF
                      spendable: 14000
                      paid: 14000
                      promo: 0
                clone:
                  summary: Compteur déjà vu — bracelet mis en liste noire
                  value:
                    tap_id: null
                    result: CLONE_SUSPECTED
                    tap_expires_at: null
                    media: null
                    wallet: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /media/activations:
    post:
      tags: [Bracelets]
      operationId: activateMedia
      summary: Activer un bracelet (DESK, FIRST_TOPUP) et encaisser la caution
      description: |
        Remise + rattachement d'un bracelet à un portefeuille (`activate_media`). Le canal doit figurer dans
        `event.activation_modes` (sinon `422 ACTIVATION_MODE_NOT_ALLOWED`). Si `wallet_id` est absent, un
        portefeuille anonyme est créé dans le grand livre de l'événement (refusé si
        `identity_mode = ACCOUNT_REQUIRED` sans `customer_id`). Si le lot prévoit une caution, elle est
        encaissée par `take_deposit` : mode `FROM_BALANCE` (prélevée sur le solde, peut rester `DUE`) ou
        `SEPARATE` (payée à part : `deposit_payment.method` obligatoire). Idempotency-Key = `serial:seq`.
        Pendant `EDGE` (passerelle), servie seulement sans frais d'activation prélevés sur le solde et, si le lot
        prévoit une caution, en mode `SEPARATE` espèces ; sinon `409 DEBIT_AUTHORITY_EDGE` (ADR-52,
        sync_protocol.md §9.6).
      security:
        - deviceMtls: []
        - deviceToken: []
        - humanBearer: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaActivationRequest'
            example:
              tap_id: 918270
              channel: DESK
              wallet_id: null
              customer_id: null
              deposit_payment:
                method: CASH
              occurred_at: '2026-12-11T18:03:00Z'
      responses:
        '201':
          description: Bracelet activé.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaActivationResponse'
              example:
                media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                media_status: ACTIVE
                wallet:
                  wallet_id: a1b2c3d4-e5f6-4789-8abc-def012345678
                  status: ACTIVE
                  currency: XOF
                  spendable: 0
                  paid: 0
                  promo: 0
                deposit:
                  status: HELD
                  amount: 2000
                  mode: SEPARATE
                  transaction_id: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /media/{media_id}:
    get:
      tags: [Bracelets]
      operationId: getMedia
      summary: Consulter un bracelet (staff)
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Bracelet.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
              example:
                media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                kind: NFC_TAG
                chip_type: MF0UL11
                nfc_uid: 04a1b2c3d4e5f6
                key_index: 1
                status: ACTIVE
                batch_id: 44d1e2f3-a4b5-4c6d-8e7f-9a0b1c2d3e4f
                batch_kind: PUBLIC
                deposit_status: HELD
                deposit_held: 2000
                wallet_ids: [a1b2c3d4-e5f6-4789-8abc-def012345678]
                last_counter: 412
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /media/{media_id}/deposit:
    post:
      tags: [Bracelets]
      operationId: takeDeposit
      summary: Encaisser la caution (take_deposit)
      description: |
        Transaction `DEPOSIT_TAKEN`. Mode `FROM_BALANCE` : prélevée sur `WALLET_PAID` si le solde suffit,
        sinon statut `DUE` (prélevée à la prochaine recharge). Mode `SEPARATE` : `payment.method` obligatoire
        (`CASH` → compte `CASH_DESK` de la station). Idempotent : si déjà `HELD`, renvoie l'état courant.
        Pendant `EDGE` (passerelle) : seul le mode `SEPARATE` avec `payment.method = CASH` est servi ;
        `FROM_BALANCE` → `409 DEBIT_AUTHORITY_EDGE` (ADR-52).
      security:
        - deviceMtls: []
        - deviceToken: []
        - humanBearer: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
            example:
              tap_id: 918271
              payment:
                method: CASH
      responses:
        '200':
          description: État de la caution.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositState'
              example:
                status: HELD
                amount: 2000
                mode: FROM_BALANCE
                transaction_id: 7c8d9e0f-1a2b-4c3d-9e4f-5a6b7c8d9e0f
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /media/{media_id}/deposit/refund:
    post:
      tags: [Bracelets]
      operationId: refundDeposit
      summary: Rendre la caution (refund_deposit)
      description: |
        Transaction `DEPOSIT_REFUNDED`. Mode `FROM_BALANCE` : recréditée sur le portefeuille. Mode `SEPARATE` :
        rendue par `payment.method` (espèces à la station, mobile money). Exige une lecture du bracelet
        (`tap_id` ou `tap`) : on ne rend pas une caution sans le bracelet physique.
      security:
        - deviceMtls: []
        - deviceToken: []
        - humanBearer: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
            example:
              tap_id: 918300
              payment:
                method: CASH
      responses:
        '200':
          description: Caution rendue.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositState'
              example:
                status: REFUNDED
                amount: 2000
                mode: SEPARATE
                transaction_id: 8d9e0f1a-2b3c-4d4e-8f5a-6b7c8d9e0f1a
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /media/{media_id}/release:
    post:
      tags: [Bracelets]
      operationId: releaseMedia
      summary: Restitution du bracelet (release_media)
      description: |
        Le bracelet rendu est libéré (`RELEASED`) ; l'argent ne suit jamais le bracelet. Préconditions
        vérifiées par `release_media` : caution non `HELD` (`409 DEPOSIT_OUTSTANDING`), aucune espèce due au
        détenteur (anomalie `CASH_TOPUP_OVER_LIMIT` ouverte : `409 MEDIA_STATE_INVALID`, `CL020` ; les rendre
        d'abord par `refundCashDue`) et portefeuilles soldés (`409 BALANCE_OUTSTANDING`). L'API contrôle ces
        préconditions avant l'appel et renvoie le code précis ; un autre refus `CL020` de la base donne
        `409 MEDIA_STATE_INVALID`.
        Cette opération ne rend que des **espèces**, depuis la caisse de la session `cash_session_id`. Elle ne
        rembourse rien par carte ni vers un numéro mobile money saisi au guichet. Le solde payé se rembourse
        autrement par les opérations prévues : demande de remboursement (`createMyRefundRequest`, numéro vérifié
        du titulaire, ou un autre numéro aux conditions d'ADR-76, puis `approveRefundRequest`). Une caution `SEPARATE` payée par mobile money se rend par `refundDeposit`.
        Si `settle_balance` est fourni, le serveur enchaîne dans l'ordre imposé
        par SPECIFICATION §7.9 : `refund_deposit` (`DEPOSIT_REFUNDED`, si la caution est `HELD`) → expiration
        des crédits offerts restants du portefeuille (`PROMO_EXPIRY`, clé
        `promo-expiry:<wallet_id>:<n° de rattachement>`) → remboursement du solde payé en espèces (`WALLET_REFUND`,
        frais de remboursement éventuels) → `release_media` (exige un solde nul). Chaque étape a sa propre
        écriture ; la requête est idempotente dans son ensemble. Sans `settle_balance`, un solde offert non nul
        est aussi refusé (`409 BALANCE_OUTSTANDING`).
        Espèces rendues au-delà de `event.cash_refund_single_max` (ADR-53) : seconde personne obligatoire, par
        jeton d'approbation sur place (en-tête `X-Approval-Token`, ADR-74) ; sans jeton `403 APPROVAL_REQUIRED`,
        jeton refusé `403 APPROVAL_INVALID`. Le valideur écrit est le `sub` du jeton.
        Indisponible pendant `EDGE` (`409 DEBIT_AUTHORITY_EDGE`, sync_protocol.md §9.6).
      security:
        - deviceMtls: []
        - deviceToken: []
        - humanBearer: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaReleaseRequest'
            example:
              tap_id: 918301
              cash_session_id: 0d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a
              refund_deposit_by:
                method: CASH
              settle_balance:
                method: CASH
      responses:
        '200':
          description: Bracelet restitué.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaReleaseResponse'
              example:
                media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                media_status: RELEASED
                deposit_refund_transaction_id: 8d9e0f1a-2b3c-4d4e-8f5a-6b7c8d9e0f1a
                promo_expiry_transaction_id: null
                balance_refund_transaction_id: 9e0f1a2b-3c4d-4e5f-9a6b-7c8d9e0f1a2b
                cash_to_hand_back: 3500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /media/{media_id}/replace:
    post:
      tags: [Bracelets]
      operationId: replaceMedia
      summary: Remplacer un bracelet perdu ou abîmé (replace_media)
      description: |
        L'ancien bracelet passe `REPLACED` ; le nouveau (lu par `tap_id`) reprend le même portefeuille et les
        portefeuilles des autres devises. Même organisateur obligatoire. Rôle `SUPERVISOR` ou `CASHIER`.
        Une caution `HELD` ou `DUE` passe au nouveau bracelet ; il doit alors venir d'un lot de même mode de
        caution. L'ancien bracelet doit être `ACTIVE` ou `SUSPENDED` ; le nouveau doit être neuf (`PERSONALIZED`
        ou `ISSUED`, sans portefeuille ni caution). Sinon : `409 MEDIA_STATE_INVALID` (`CL020`).
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_media_tap_id, reason]
              properties:
                new_media_tap_id:
                  type: integer
                  format: int64
                reason:
                  type: string
            example:
              new_media_tap_id: 918410
              reason: Bracelet déchiré, identité vérifiée sur pièce.
      responses:
        '200':
          description: Remplacement effectué.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [old_media_id, new_media_id, wallet_id]
                properties:
                  old_media_id:
                    type: string
                    format: uuid
                  new_media_id:
                    type: string
                    format: uuid
                  wallet_id:
                    type: string
                    format: uuid
              example:
                old_media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                new_media_id: 2e3f4051-6b7c-4d8e-9fa0-1b2c3d4e5f60
                wallet_id: a1b2c3d4-e5f6-4789-8abc-def012345678
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /media/{media_id}/cash-due-refunds:
    post:
      tags: [Bracelets]
      operationId: refundCashDue
      summary: Rendre au guichet les espèces dues à un détenteur (refund_cash_due)
      description: |
        Rend en espèces la somme due au détenteur après une recharge espèces hors ligne au-delà d'un plafond
        (ADR-63, anomalies `CASH_TOPUP_OVER_LIMIT` ouvertes du bracelet). Appelle `refund_cash_due`.
        - Le montant est calculé par le serveur : somme des anomalies `CASH_TOPUP_OVER_LIMIT` OUVERTES de ce
          bracelet. La requête n'a pas de champ montant ; la réponse donne le montant à remettre.
        - Espèces uniquement : le compte de caisse est celui de la session de caisse `cash_session_id`, qui DOIT
          être ouverte (`409 CONFLICT_STATE` sinon) et du même grand livre.
        - Bracelet présenté : lecture `tap_id` ou `tap`, consommée par `consume_tap` (`409 TAP_UNUSABLE`).
        - Au-delà de `event.cash_refund_single_max` (ADR-53) : seconde personne obligatoire, par jeton
          d'approbation sur place (en-tête `X-Approval-Token`, ADR-74) ; sans jeton `403 APPROVAL_REQUIRED`,
          jeton refusé (expiré, déjà utilisé, autre action, même personne) `403 APPROVAL_INVALID`. Le valideur
          transmis à `refund_cash_due` est le `sub` du jeton.
        - Écriture `WALLET_REFUND` (débit `L-ESP-A-RENDRE`, crédit caisse), source `ONLINE` ; les anomalies sont
          closes. Idempotency-Key = `serial:seq` ; un rejeu renvoie le même résultat.
        - Rien n'est dû : `409 MEDIA_STATE_INVALID` (`CL020`).
        Rôle `CASHIER` ou `SUPERVISOR`. Servie par le central, y compris pendant `EDGE` (aucun débit de
        portefeuille). À appeler avant `releaseMedia`, qui refuse tant que des espèces sont dues.
      security:
        - deviceMtls: []
        - deviceToken: []
        - humanBearer: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ApprovalToken'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashDueRefundRequest'
            example:
              tap_id: 918520
              cash_session_id: 0d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a
      responses:
        '201':
          description: Espèces rendues ; remettre `amount` au détenteur.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashDueRefundResult'
              example:
                transaction_id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                idempotency_key: C1-TPE:0042
                media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                amount: 7000
                currency: XOF
                resolved_anomaly_ids: [e2f3a4b5-c6d7-4e8f-9a0b-1c2d3e4f5a6b]
                approved_by: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # ---------------------------------------------------------------- Paiements
  /payments:
    post:
      tags: [Paiements]
      operationId: createPayment
      summary: Payer (PURCHASE) par bracelet ou QR client
      description: |
        Débit du portefeuille (`WALLET_PROMO` puis `WALLET_PAID` selon `spend_order`) au profit du commerçant
        du point de vente du terminal, frais et commissions calculés par les `fee_rule` REALTIME.
        Écriture par `post_transaction(type => 'PURCHASE', source => 'ONLINE', key => Idempotency-Key)`.
        Moyen : `tap_id` (lecture déjà enregistrée), `tap` (lecture embarquée) ou `customer_qr_token`
        (QR affiché par l'app client). `payment_intent_id` (terminal `PAIRED_TPE`, intention d'un POS tiers)
        est **V2 (ADR-43)** : refusé en V1 (`422 DEVICE_MODE_NOT_ALLOWED`).
        Refus typiques : `INSUFFICIENT_FUNDS` (avec le solde disponible), `MEDIA_BLOCKED`,
        `DEBIT_AUTHORITY_EDGE` (le terminal DOIT alors passer par la passerelle), `EVENT_CLOSING`.
        `409 DEBIT_AUTHORITY_MOVING` (bascule d'autorité en cours) n'est PAS un refus définitif : le terminal
        garde la même clé et, si sa politique le permet, peut passer hors ligne (sync_protocol.md §5.1, §9.3).
        Objectifs (ADR-60, SPECIFICATION §15) : serveur seul p95 ≤ 200 ms et p99 ≤ 500 ms ; réseau + serveur
        p95 ≤ 800 ms et p99 ≤ 1,5 s (un seul aller-retour, lecture intégrée `tap`) ; au-delà de
        `online_total_timeout_ms` (défaut 3 s) sans réponse, le terminal applique sync_protocol.md §5.1 (bascule
        hors ligne avec la MÊME clé).
        Résultats de lecture qui refusent l'écriture : `422 MEDIA_SIGNATURE_MISMATCH`, `422 MEDIA_SIGNATURE_MISSING`
        (relire le bracelet), et les autres codes `MEDIA_*` ; passage inutilisable : `409 TAP_UNUSABLE`.
      security:
        - deviceMtls: []
        - deviceToken: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/AuthorityEpoch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestBody'
            examples:
              catalogue:
                summary: Caisse catalogue, lecture embarquée
                value:
                  amount: 6000
                  currency: XOF
                  occurred_at: '2026-12-11T19:10:00Z'
                  tap:
                    nfc_uid: 04a1b2c3d4e5f6
                    token_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    counter: 413
                    key_index: 1
                    pack_verified: true
                    originality_signature: 3a7f0c9e5b2d4a6f8e1c3b5d7f9a0c2e4b6d8f0a1c3e5b7d9f0a2c4e6b8d0f1a
                    occurred_at: '2026-12-11T19:09:59Z'
                  lines:
                    - product_id: 9d1b7a4c-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                      quantity: 2
                      unit_price: 3000
              keypad:
                summary: TPE simplifié, montant saisi, QR client
                value:
                  amount: 4000
                  currency: XOF
                  occurred_at: '2026-12-11T20:05:00Z'
                  customer_qr_token: CQ7M2K9XQ4TP
      responses:
        '201':
          description: Paiement accepté.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
              example:
                transaction_id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                idempotency_key: TPE-FOOD-01:0001
                type: PURCHASE
                status: SUCCEEDED
                amount: 6000
                currency: XOF
                occurred_at: '2026-12-11T19:10:00Z'
                recorded_at: '2026-12-11T19:10:00.412Z'
                media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                wallet_id: a1b2c3d4-e5f6-4789-8abc-def012345678
                balance_after:
                  spendable: 13000
                  paid: 13000
                  promo: 0
                receipt_number: FOOD-01-000001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

