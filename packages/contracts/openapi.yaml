    StatusCondition:
      type: object
      description: Condition d'un passage de statut et son état.
      required: [code, met, detail, source]
      properties:
        code:
          type: string
          description: |
            Identifiant stable. `DATABASE` : `TRANSITION_ALLOWED`, `DEVICES_CAUGHT_UP`, `DEBIT_AUTHORITY_CENTRAL`,
            `SUSPENSE_ZERO`, `PARTY_POSITIONS_ZERO`, `PAYOUT_PENDING_ZERO`, `POSITIONS_SETTLED`. `CONFIGURATION` :
            `FUNDS_HOLDER_SET`, `CONTRACT_IN_FORCE`, `JURISDICTION_SET`, `LEDGER_OPEN`. `EXTERNAL` :
            `CASH_DESKS_COUNTED`, `PSP_RECONCILED`, `DEVICES_REPORTED`.
        met:
          type:
            - boolean
            - 'null'
          description: '`null` : condition externe, pas encore calculable.'
        detail:
          type: string
          description: Raison, traduite selon `Accept-Language`.
        source:
          type: string
          enum: [DATABASE, CONFIGURATION, EXTERNAL]
        owner_mission:
          type: string
          description: Pour une condition `EXTERNAL` - mission qui la rendra calculable.
    StatusTransition:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          $ref: '#/components/schemas/EventStatus'
    Participation:
      type: object
      description: |
        Présence d'un commerçant à un événement (`merchant_participation`, §3.1, §12.1). `INTERNAL` : versements à
        l'organisateur ; `EXTERNAL` : au commerçant. La commission est une règle de frais de portée `PARTICIPATION`.
      required: [participation_id, operator_id, event_id, merchant_id, link_type, payout_to, pitch_fee_mode,
                 pitch_fee, pitch_fee_reference, account_id]
      properties:
        participation_id:
          type: string
          format: uuid
        operator_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        link_type:
          type: string
          enum: [INTERNAL, EXTERNAL]
        payout_to:
          type: string
          format: uuid
          description: Bénéficiaire des versements, posé par la base.
        pitch_fee_mode:
          type: string
          enum: [DEDUCT_OR_DEBT, PREPAID, DEDUCT_CAPPED]
        pitch_fee:
          type: integer
          format: int64
          minimum: 0
          description: Droit de place, en unités mineures de la devise de l'événement.
        pitch_fee_reference:
          type:
            - string
            - 'null'
          description: Référence du paiement d'avance (`PREPAID`).
        account_id:
          type: string
          format: uuid
          description: Compte du commerçant dans le grand livre de l'événement (`L-MCH-<id>`).
    ParticipationCreate:
      type: object
      required: [merchant_id, link_type]
      additionalProperties: false
      properties:
        merchant_id:
          type: string
          format: uuid
        link_type:
          type: string
          enum: [INTERNAL, EXTERNAL]
        pitch_fee_mode:
          type: string
          enum: [DEDUCT_OR_DEBT, PREPAID, DEDUCT_CAPPED]
          default: DEDUCT_OR_DEBT
        pitch_fee:
          type: integer
          format: int64
          minimum: 0
          default: 0
        pitch_fee_reference:
          type:
            - string
            - 'null'
          maxLength: 200
    ParticipationUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        pitch_fee_mode:
          type: string
          enum: [DEDUCT_OR_DEBT, PREPAID, DEDUCT_CAPPED]
        pitch_fee:
          type: integer
          format: int64
          minimum: 0
        pitch_fee_reference:
          type:
            - string
            - 'null'
          maxLength: 200
    PointOfSale:
      type: object
      description: Lieu d'encaissement d'une participation (`point_of_sale`), qui portera les terminaux.
      required: [pos_id, operator_id, participation_id, name]
      properties:
        pos_id:
          type: string
          format: uuid
        operator_id:
          type: string
          format: uuid
        participation_id:
          type: string
          format: uuid
        name:
          type: string
    PointOfSaleCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    FeeRuleScopeType:
      type: string
      description: |
        Portée d'une règle de frais (§5.6) : `PLATFORM_CONTRACT` (plateforme → prestataire), `OPERATOR_CONTRACT`
        (prestataire → organisateur), `EVENT` et `PARTICIPATION` (organisateur → commerçant, frais festivalier),
        `PSP_CONFIGURATION` (frais PSP propres à une configuration de paiement, `scope_id` = `psp_config_id`).
      enum: [PLATFORM_CONTRACT, OPERATOR_CONTRACT, EVENT, PARTICIPATION, PSP_CONFIGURATION]
    FeeRule:
      type: object
      description: |
        Règle de frais (`fee_rule`, §5.6). Jamais modifiée : elle se ferme (`valid_to`) et une nouvelle version la
        remplace. Montants en unités mineures.
      required: [fee_rule_id, operator_id, scope_type, scope_id, payer_purpose, beneficiary_purpose, basis, rate_bps,
                 fixed_amount, min_amount, max_amount, tax_code, tax_inclusive, trigger, valid_from, valid_to, version]
      properties:
        fee_rule_id:
          type: string
          format: uuid
        operator_id:
          type:
            - string
            - 'null'
          format: uuid
        scope_type:
          $ref: '#/components/schemas/FeeRuleScopeType'
        scope_id:
          type: string
          format: uuid
          description: Contrat, événement ou participation, selon `scope_type`.
        payer_purpose:
          type: string
          description: Usage du compte payeur (`ORG_FPREST`, `MERCHANT`, `OPE_REDEV`…), §5.2.
        beneficiary_purpose:
          type: string
          description: Usage du compte bénéficiaire (`OPE_FRAIS`, `ORG_COM`, `PLT_REDEV`…).
        basis:
          type: string
          enum: [TOPUP_AMOUNT, SALE_AMOUNT, PER_MEDIA, PER_TERMINAL_DAY, PER_REFUND, FIXED, FEE_AMOUNT]
        rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Taux en points de base (1200 = 12 %).
        fixed_amount:
          type: integer
          format: int64
          minimum: 0
        min_amount:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        max_amount:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        tax_code:
          type:
            - string
            - 'null'
          description: Taxe du profil de législation (`rules.taxes`) ; `null` = hors taxe.
        tax_inclusive:
          type: boolean
        trigger:
          type: string
          enum: [REALTIME, CLOSING]
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          type:
            - string
            - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
    FeeRuleCreate:
      type: object
      description: |
        Création ou remplacement d'une règle. `valid_from` omise : instant de l'écriture. `min_amount` ne dépasse pas
        `max_amount`.
      required: [scope_type, scope_id, payer_purpose, beneficiary_purpose, basis, trigger]
      additionalProperties: false
      properties:
        scope_type:
          $ref: '#/components/schemas/FeeRuleScopeType'
        scope_id:
          type: string
          format: uuid
        payer_purpose:
          type: string
          minLength: 1
        beneficiary_purpose:
          type: string
          minLength: 1
        basis:
          type: string
          enum: [TOPUP_AMOUNT, SALE_AMOUNT, PER_MEDIA, PER_TERMINAL_DAY, PER_REFUND, FIXED, FEE_AMOUNT]
        rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        fixed_amount:
          type: integer
          format: int64
          minimum: 0
          default: 0
        min_amount:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        max_amount:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
        tax_code:
          type:
            - string
            - 'null'
        tax_inclusive:
          type: boolean
          default: true
        trigger:
          type: string
          enum: [REALTIME, CLOSING]
        valid_from:
          $ref: '#/components/schemas/Timestamp'
    MediaBatchStatus:
