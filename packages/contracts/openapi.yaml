              method: WAVE
              provider: WAVE
              holder_party_id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
              secret_ref: psp/6f1c0000-0000-4000-8000-000000000001/wave-prod
              is_default: true
              valid_from: '2026-11-01T00:00:00Z'
              valid_until: null
      responses:
