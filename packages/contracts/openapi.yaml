  /devices/{device_id}/reactivate:
    post:
      tags: [Terminaux]
      operationId: reactivateDevice
      summary: Réactiver un terminal suspendu (back-office)
      description: |
        `SUSPENDED` → `ACTIVE`, motif obligatoire. Autre statut de départ (dont `REVOKED`, définitif) :
        `409 CONFLICT_STATE`. Rôles : `OPERATOR_ADMIN` ; `ORGANIZER_ADMIN` pour un terminal d'un événement de son
        organisateur ; une personne suffit. Terminal d'un autre prestataire ou hors du périmètre : `404`. Historique
        des statuts et audit écrits dans la même transaction.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusChangeRequest'
            example:
              reason: Terminal retrouvé et contrôlé par le superviseur du site.
      responses:
        '200':
          description: Terminal réactivé.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
