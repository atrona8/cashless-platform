      tags: [Webhooks sortants]
      x-release: V2
      operationId: onPaymentIntentSucceeded
      summary: payment_intent.succeeded (sortant)
      description: |
        Envoyé au POS tiers quand la vente est écrite. En-tête `X-Cashless-Signature: t=<unix>,v1=<hex>` où
        `v1 = HMAC-SHA256(secret, t + "." + corps_brut)`. Répondre 2xx en moins de 5 s ; dédoublonner par
        `event_id`.
      security: []
      parameters:
