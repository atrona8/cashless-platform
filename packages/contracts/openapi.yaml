  /payment-intents/{payment_intent_id}/capture:
    post:
      tags: [Intentions de paiement]
      operationId: capturePaymentIntent
      x-release: V2
      summary: Capturer une intention autorisée (MANUAL)
      description: |
        Écrit la vente `PURCHASE` pour `amount_to_capture` (≤ montant autorisé, défaut : totalité) et libère
        le reliquat. Uniquement depuis `AUTHORIZED` ; sinon `409 PAYMENT_INTENT_INVALID_STATE`.
        Refusée si `debit_authority = EDGE` et que la capture n'est pas faite via la passerelle.
      security:
        - posClient: [payment_intents:write]
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_to_capture:
                  $ref: '#/components/schemas/Amount'
            example:
              amount_to_capture: 7000
      responses:
        '200':
          description: Intention capturée.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /payment-intents/{payment_intent_id}/cancel:
    post:
      tags: [Intentions de paiement]
      operationId: cancelPaymentIntent
      x-release: V2
      summary: Annuler une intention
      description: |
        Depuis `REQUIRES_PAYMENT` ou `AUTHORIZED` (libère la réserve) → `CANCELLED`. Depuis `SUCCEEDED`,
        l'annulation écrit une contre-passation `REVERSAL` si la fenêtre d'annulation n'est pas dépassée
        (sinon `409 REVERSAL_WINDOW_EXPIRED`).
      security:
        - posClient: [payment_intents:write]
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [REQUESTED_BY_CUSTOMER, DUPLICATE, ABANDONED, INPUT_ERROR]
            example:
              reason: ABANDONED
      responses:
        '200':
          description: Intention annulée.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /device/payment-intents:
