  # ---------------------------------------------------------------- Paiements
  /payments:
    post:
      tags: [Paiements]
      operationId: createPayment
      x-process: public
      summary: Payer (PURCHASE) par bracelet ou QR client
      description: |
        Débit du portefeuille (`WALLET_PROMO` puis `WALLET_PAID` selon `spend_order`) au profit du commerçant
        du point de vente du terminal, frais et commissions calculés par les `fee_rule` REALTIME.
        Écriture par `post_transaction(type => 'PURCHASE', source => 'ONLINE', key => Idempotency-Key)`.
        Moyen : `tap_id` (lecture déjà enregistrée), `tap` (lecture embarquée) ou `customer_qr_token`
        (QR affiché par l'app client). `payment_intent_id` (terminal `PAIRED_TPE`, intention d'un POS tiers)
        est **V2 (ADR-43)** : refusé en V1 (`422 DEVICE_MODE_NOT_ALLOWED`).
        Refus typiques : `INSUFFICIENT_FUNDS` (avec le solde disponible), `MEDIA_BLOCKED`,
        `DEBIT_AUTHORITY_EDGE` (le terminal DOIT alors passer par la passerelle), `EVENT_CLOSING`.
        `409 DEBIT_AUTHORITY_MOVING` (bascule d'autorité en cours) n'est PAS un refus définitif : le terminal
        garde la même clé et, si sa politique le permet, peut passer hors ligne (sync_protocol.md §5.1, §9.3).
        Objectifs (ADR-60, SPECIFICATION §15) : serveur seul p95 ≤ 200 ms et p99 ≤ 500 ms ; réseau + serveur
        p95 ≤ 800 ms et p99 ≤ 1,5 s (un seul aller-retour, lecture intégrée `tap`) ; au-delà de
        `online_total_timeout_ms` (défaut 3 s) sans réponse, le terminal applique sync_protocol.md §5.1 (bascule
        hors ligne avec la MÊME clé).
        Résultats de lecture qui refusent l'écriture : `422 MEDIA_SIGNATURE_MISMATCH`, `422 MEDIA_SIGNATURE_MISSING`
        (relire le bracelet), et les autres codes `MEDIA_*` ; passage inutilisable : `409 TAP_UNUSABLE`.
        Session de vendeur (mission 5b) : `vendor_session_id` est requis ; la session doit être ouverte sur ce
        terminal, non expirée, et son vendeur `ACTIVE` et non bloqué, sinon `409 VENDOR_SESSION_INVALID`
        (`CL032`). La vente est attribuée par le serveur au vendeur de la session (jamais d'après un champ du
        corps) ; `PaymentResult.vendor`, `lines` et `channel` le rendent.
        Lignes : obligatoires depuis une caisse `CATALOG_POS` (chaque ligne porte `product_id`), interdites depuis un
        `KEYPAD_TPE` (`422 VALIDATION_FAILED`) ; terminal `TOPUP_DESK` : `422 DEVICE_MODE_NOT_ALLOWED`. Article
        inconnu, inactif, d'un autre point de vente, prix ou taux ni courant ni servi au terminal, somme différente
        du montant : `422 SALE_LINES_INVALID` (`CL034`) ; le terminal se resynchronise.
        `tap_id` : lecture de CE terminal, non consommée, dans `tap_replay_window_seconds` (heure de la base) ;
        bracelet bloqué : `422 MEDIA_BLOCKED` ; portefeuille bloqué : `422 WALLET_BLOCKED`.
        QR client (`customer_qr_token`) inconnu, expiré, déjà utilisé, annulé ou d'un autre événement :
        `422 QR_TOKEN_INVALID` (réponse unique, sans dire lequel des cas ; code existant du contrat).
        `Idempotency-Key` : `<serial>:<seq>`, `<serial>` égal au `serial` du terminal authentifié (sinon
        `422 VALIDATION_FAILED`, rien n'est écrit) ; chaque réponse finale (2xx ou 4xx) est enregistrée dans le
        registre des numéros du terminal, sauf `409 DEBIT_AUTHORITY_MOVING` et `409 DEBIT_AUTHORITY_EDGE` (même clé
        rejouable).
      security:
        - deviceMtls: []
          deviceToken: []
          deviceSignature: []
      x-edge-available: true
      parameters:
        - $ref: '#/components/parameters/AuthorityEpoch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceRequestId'
        - $ref: '#/components/parameters/SignatureInput'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestBody'
            examples:
              catalogue:
                summary: Caisse catalogue, lecture embarquée
                value:
                  amount: 6000
                  currency: XOF
                  occurred_at: '2026-12-11T19:10:00Z'
                  vendor_session_id: 2f3a4b5c-6d7e-4f80-9a1b-2c3d4e5f6a7b
                  tap:
                    nfc_uid: 04a1b2c3d4e5f6
                    token_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    counter: 413
                    key_index: 1
                    pack_verified: true
                    originality_signature: 3a7f0c9e5b2d4a6f8e1c3b5d7f9a0c2e4b6d8f0a1c3e5b7d9f0a2c4e6b8d0f1a
                    occurred_at: '2026-12-11T19:09:59Z'
                  lines:
                    - product_id: 9d1b7a4c-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                      quantity: 2
                      unit_price: 3000
              keypad:
                summary: TPE simplifié, montant saisi, QR client
                value:
                  amount: 4000
                  currency: XOF
                  occurred_at: '2026-12-11T20:05:00Z'
                  vendor_session_id: 2f3a4b5c-6d7e-4f80-9a1b-2c3d4e5f6a7b
                  customer_qr_token: CQ7M2K9XQ4TP
      responses:
        '201':
          description: Paiement accepté.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
              example:
                transaction_id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                idempotency_key: TPE-FOOD-01:0001
                type: PURCHASE
                status: SUCCEEDED
                amount: 6000
                currency: XOF
                occurred_at: '2026-12-11T19:10:00Z'
                recorded_at: '2026-12-11T19:10:00.412Z'
                media_id: 1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                wallet_id: a1b2c3d4-e5f6-4789-8abc-def012345678
                balance_after:
                  spendable: 13000
                  paid: 13000
                  promo: 0
                receipt_number: FOOD-01-000001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
