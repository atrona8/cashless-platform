          description: Reçu.
  paymentIntentCancelled:
    post:
      tags: [Webhooks sortants]
      x-release: V2
      operationId: onPaymentIntentCancelled
      summary: payment_intent.cancelled / payment_intent.expired / payment_intent.failed (sortant)
      security: []
      parameters:
        - $ref: '#/components/parameters/OutboundSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundEvent'
      responses:
        '200':
          description: Reçu.
  paymentIntentReversed:
    post:
      tags: [Webhooks sortants]
      x-release: V2
      operationId: onPaymentIntentReversed
      summary: payment_intent.reversed (sortant)
      security: []
      parameters:
        - $ref: '#/components/parameters/OutboundSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundEvent'
      responses:
        '200':
          description: Reçu.

components:
  securitySchemes:
    humanBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT OIDC (staff, back-office, client). Claims `sub`, `operator_id`, `roles`.
    staffBearer:
      type: apiKey
      in: header
      name: X-Staff-Authorization
      description: |
        `Bearer <JWT OIDC>` de la personne qui agit au guichet (routes terminal ET personne), mêmes règles que
        `humanBearer` (identité seule ; prestataire, statut et rôles relus en base). Le jeton d'appareil occupe
        `Authorization` sur ces routes. Refusé (`401`) sur toute autre route.
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton d'appareil (JWT ES256 seul, 15 min), en-tête `typ = device+jwt` et `kid` du signataire. Claims :
        `iss`, `aud = cashless-device`, `sub = device_id`, `operator_id`, `serial`, `event_id`, `cnf.jkt` (empreinte
        JWK, RFC 7638, de la clé de signature du terminal), `fid` (famille de jetons, vérifiée non révoquée à chaque
        requête), `iat`, `exp`, `jti`. `operator_id` et `event_id` ne sont JAMAIS crus : le terminal, son prestataire,
        son statut et son affectation sont relus en base à chaque requête. Le jeton ne porte ni statut, ni rôle, ni
        affectation qui ferait foi. Exigé avec `deviceMtls` et `deviceSignature` (ADR-107).
    deviceMtls:
      type: mutualTLS
      description: |
        Certificat client X.509 délivré à l'enrôlement par l'autorité des terminaux (clé matérielle non exportable) ;
        son empreinte SHA-256 doit être celle enregistrée pour le terminal du jeton. Exigé avec `deviceToken` et
        `deviceSignature` (ADR-107).
    deviceSignature:
      type: apiKey
      in: header
      name: Signature
      description: |
        Signature de chaque requête de terminal (RFC 9421, HTTP Message Signatures, profil restreint ; ADR-107),
        exigée avec `deviceMtls` et `deviceToken`. En-têtes `Signature-Input` et `Signature` (Structured Fields,
        RFC 8941), un seul libellé : `dev` (toute autre signature est ignorée).
        - Algorithme `ecdsa-p256-sha256` avec la clé de signature du terminal (celle de l'enrôlement) ; signature
          au format brut `r ‖ s` (64 octets), base64 : `Signature: dev=:<base64>:`.
        - Composants couverts, dans cet ordre et tous obligatoires : `"@method"`, `"@authority"`, `"@path"`,
          `"@query"`, `"content-digest"`, `"x-request-id"`, et `"idempotency-key"` sur toute route d'écriture
          (en-tête obligatoire sur ces routes). `@authority` empêche de rejouer au central une requête signée pour
          la passerelle locale.
        - `Content-Digest` (RFC 9530) : `sha-256` seul, calculé sur les octets bruts du corps, présent même pour un
          corps vide.
        - Paramètres obligatoires : `created` (secondes Unix), `nonce` (128 bits au moins, base64url),
          `keyid` (= `device_id`), `alg` (= `ecdsa-p256-sha256`) ; `expires` est refusé.
        - Rejeu : `created` doit être dans la tolérance d'horloge (`clock_tolerance_seconds`, 300 s au plus) autour
          de l'heure de la base ; un nonce déjà vu pour ce terminal est refusé. Le nonce n'est enregistré qu'après
          vérification des trois preuves.
        Refus : `401 DEVICE_SIGNATURE_INVALID` (sans dire quel élément a échoué) ; `created` hors tolérance :
        `400 CLOCK_SKEW_TOO_LARGE` avec l'heure du serveur dans l'en-tête `Date`.
        Exemple de `Signature-Input` :
        `dev=("@method" "@authority" "@path" "@query" "content-digest" "x-request-id" "idempotency-key");created=1797000000;nonce="<b64url>";keyid="<device_id>";alg="ecdsa-p256-sha256"`.
    edgeMtls:
      type: mutualTLS
      description: Certificat client de la passerelle locale (`edge_gateway.public_key`).
    posClient:
      type: oauth2
      description: Client credentials des POS tiers (un client par intégration et par prestataire).
      flows:
        clientCredentials:
          tokenUrl: https://api.cashless.test/v1/oauth/token
          scopes:
            payment_intents:read: Lire les intentions de paiement
            payment_intents:write: Créer, capturer, annuler des intentions
            webhooks:read: Lire les abonnements webhooks
            webhooks:write: Gérer les abonnements webhooks
    pspHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        `t=<unix>,v1=<hex HMAC-SHA256(secret_psp, t + "." + corps_brut)>` (Wave : en-tête `Wave-Signature`,
        même format). Tolérance d'horodatage 300 s ; secret par configuration PSP (`psp_config_id` de l'URL),
        rotation avec deux secrets valides simultanément.

  headers:
    X-Request-Id:
      description: Identifiant de corrélation (repris de la requête, sinon généré).
      schema:
        type: string
        format: uuid
    Idempotency-Replayed:
      description: '`true` si la réponse est celle mémorisée pour une requête antérieure de même clé.'
      schema:
        type: boolean
    ETag:
      description: Version de la ressource.
      schema:
        type: string
    Retry-After:
      description: Secondes avant de réessayer.
      schema:
        type: integer

  parameters:
    ApprovalToken:
      name: X-Approval-Token
      in: header
      required: false
      description: |
        Jeton d'approbation sur place (guichet, ADR-74, SPECIFICATION §3.2). La seconde personne saisit son code
        personnel sur le même terminal ; le serveur d'identité (OIDC, authentification renforcée) délivre un JWT
        signé, valable 5 min, à usage unique (`jti` mémorisé jusqu'à l'expiration), lié à l'action :
        `sub` = valideur, `act` = operationId, `act_hash` = SHA-256 (hex) de la requête canonique
        (méthode, chemin, corps en JSON canonique JCS, RFC 8785 ; le jeton n'en fait pas partie).
        Le serveur vérifie signature, expiration, `jti` non réutilisé, `act` et `act_hash`, `sub` ≠ appelant et
        rôle du valideur ; le valideur transmis à la base est le `sub`. Obligatoire seulement quand l'opération
        l'exige (au-delà de `event.cash_refund_single_max`) : absent → `403 APPROVAL_REQUIRED` ; refusé
        (invalide, expiré, déjà utilisé, autre action, même personne) → `403 APPROVAL_INVALID`. Envoyé sans
        nécessité, il est vérifié puis consommé de la même façon.
      schema:
        type: string
        minLength: 16
        maxLength: 4096
    ApprovalRequestId:
      name: approval_request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperatorId:
      name: operator_id
      in: path
      required: true
      description: Prestataire visé ; celui de la personne, sauf pour un `PLATFORM_ADMIN` (sinon `404`).
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clé d'idempotence. Terminaux : `<device_serial>:<seq>` (seq ≥ 1, au moins 4 chiffres). Autres : UUID.
        Conservée au moins 30 jours (terminaux : pour toujours, c'est la clé du grand livre).
        Terminal : `<device_serial>` DOIT être le `serial` du terminal authentifié, sinon `422 VALIDATION_FAILED`
        sans aucune écriture. Les refus non définitifs `409 DEBIT_AUTHORITY_MOVING` et `409 DEBIT_AUTHORITY_EDGE`
        ne sont pas enregistrés : ni réponse d'idempotence ni numéro consommé, la même clé est rejouable.
        Exception : `openVendorSession` et `closeVendorSession` (sessions de vendeur) prennent une clé UUID (portée
        `device:<device_id>:`), car aucun numéro `<seq>` n'y est enregistré dans le registre des numéros du
        terminal (un tel numéro laisserait un trou dans `contiguous_acked_seq`).
        Routes à réponse non conservée (`openVendorSession`, `closeVendorSession`, `createPaymentRequest`,
        `createCustomerQrToken`, `createDeviceEnrollmentCode`) : aucune réponse n'est enregistrée ; un renvoi de la
        même clé reçoit `409 CONFLICT_STATE`, sans rien de la réponse d'origine.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      examples:
        terminal:
          value: TPE-FOOD-01:0001
        app:
          value: 5f0c7a8e-1d2b-4c3a-9e8f-7a6b5c4d3e2f
    AuthorityEpoch:
      name: X-Authority-Epoch
      in: header
      required: false
      description: |
        Époque d'autorité de débit connue du terminal. DOIT être envoyée sur toute opération de débit.
        Si elle diffère de l'époque courante du serveur qui répond, celui-ci refuse le débit
        (`409 STALE_AUTHORITY_EPOCH` ou `DEBIT_AUTHORITY_EDGE`) et renvoie l'époque courante.
      schema:
        type: integer
        format: int64
        minimum: 0
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identifiant de corrélation fourni par le client.
      schema:
        type: string
        format: uuid
    DeviceRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: |
        Identifiant de corrélation (UUID), obligatoire sur une route de terminal : composant signé
        `"x-request-id"` (`deviceSignature`).
      schema:
        type: string
        format: uuid
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      description: |
        Paramètres de la signature du terminal (RFC 9421, libellé `dev`) : composants couverts et `created`,
        `nonce`, `keyid`, `alg`. Profil : `deviceSignature`.
      schema:
        type: string
        maxLength: 1024
      example: 'dev=("@method" "@authority" "@path" "@query" "content-digest" "x-request-id");created=1797000000;nonce="q3RfUjx7d8bL0mNp4sVw2A";keyid="3f7d2c10-6a55-4b6e-9d0e-1c2b3a4d5e6f";alg="ecdsa-p256-sha256"'
    Signature:
      name: Signature
      in: header
      required: true
      description: Signature ECDSA P-256 (`r ‖ s`, 64 octets) du terminal, libellé `dev` ; profil `deviceSignature`.
      schema:
        type: string
        maxLength: 512
      example: 'dev=:l0ZLDkpZDOz58wdBIAxR/JjJVNndy47EtbZxcSvK5T/3rZUvojnTbojLpcXq3k+myvFhnNCuD8vTDlrRu6FlCQ==:'
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      description: |
        Empreinte du corps (RFC 9530), `sha-256` seul, sur les octets bruts du corps ; présente même pour un corps
        vide. Composant signé `"content-digest"`.
      schema:
        type: string
        maxLength: 256
      example: 'sha-256=:47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=:'
    SignatureInputIfDevice:
      name: Signature-Input
      in: header
      required: false
      description: |
        Obligatoire quand l'appelant est un terminal (route ouverte aussi à un autre type d'appelant) ; voir
        `SignatureInput` et `deviceSignature`. Un terminal y couvre aussi `"x-request-id"`, donc envoie `X-Request-Id`.
      schema:
        type: string
        maxLength: 1024
    SignatureIfDevice:
      name: Signature
      in: header
      required: false
      description: Obligatoire quand l'appelant est un terminal ; voir `Signature` et `deviceSignature`.
      schema:
        type: string
        maxLength: 512
    ContentDigestIfDevice:
      name: Content-Digest
      in: header
      required: false
      description: Obligatoire quand l'appelant est un terminal ; voir `ContentDigest` et `deviceSignature`.
      schema:
        type: string
        maxLength: 256
    Cursor:
      name: cursor
      in: query
      required: false
      description: Curseur opaque renvoyé par la page précédente (`next_cursor`).
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WalletId:
      name: wallet_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LedgerId:
      name: ledger_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentIntentId:
      name: payment_intent_id
      in: path
      required: true
      schema:
        type: string
    PaymentRequestId:
      name: payment_request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentRequestToken:
      name: X-Payment-Request-Token
      in: header
      required: false
      description: |
        Jeton de la demande de paiement lu dans le QR commerçant. Obligatoire quand l'appelant est un festivalier
        (`getPaymentRequest`, `cancelPaymentRequest`) ; ignoré pour un terminal (le terminal d'origine est
        reconnu par ses preuves). Transmis en en-tête seulement, jamais dans la chaîne de requête ni dans le
        chemin (il finirait dans les journaux d'accès) ; masqué dans le journal des requêtes, jamais audité ni
        gardé (seule l'empreinte SHA-256 de la demande l'est). Absent ou faux : `404`, réponse identique à une
        demande inconnue.
      schema:
        type: string
        minLength: 12
        maxLength: 64
    VendorId:
      name: vendor_id
      in: path
      required: true
      description: Vendeur d'un commerçant ; hors du périmètre de la personne ou d'un autre prestataire → `404`.
      schema:
        type: string
        format: uuid
    VendorMerchantId:
      name: merchant_id
      in: path
      required: true
      description: Commerçant du prestataire de la personne ; hors de son périmètre ou inconnu → `404`.
      schema:
        type: string
        format: uuid
    CatalogCategoryId:
      name: category_id
      in: path
      required: true
      description: Catégorie du catalogue d'un point de vente ; hors du périmètre de la personne → `404`.
      schema:
        type: string
        format: uuid
    CatalogItemId:
      name: item_id
      in: path
      required: true
      description: Article du catalogue d'un point de vente ; hors du périmètre de la personne → `404`.
      schema:
        type: string
        format: uuid
    CatalogVersionNumber:
      name: version
      in: path
      required: true
      description: Numéro de version du catalogue du point de vente (croissant à partir de 1).
      schema:
        type: integer
        minimum: 1
    RefundRequestId:
      name: refund_request_id
      in: path
      required: true
      schema:
        type: string
    CashSessionId:
      name: cash_session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KycVerificationId:
      name: kyc_verification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HandoverId:
      name: handover_id
      in: path
      required: true
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Langue des messages lisibles (`title`, `detail` des erreurs, libellés). Valeurs `fr` ou `en` ;
        défaut `fr` (en-tête absent ou sans langue prise en charge). Sans effet sur les codes stables.
      schema:
        type: string
        default: fr
        examples: [fr, en, 'en;q=0.9, fr;q=0.8']
    OutboundSignature:
      name: X-Cashless-Signature
      in: header
      required: true
      schema:
        type: string
        example: t=1765569672,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
    ProfileId:
      name: profile_id
      in: path
      required: true
      description: Version de profil de législation.
      schema:
        type: string
        format: uuid
    ContractId:
      name: contract_id
      in: path
      required: true
      description: Version de contrat.
      schema:
        type: string
        format: uuid
    OrganizerId:
      name: organizer_id
      in: path
      required: true
      description: Organisateur du prestataire du chemin (sinon `404`).
      schema:
        type: string
        format: uuid
    MerchantId:
      name: merchant_id
      in: path
      required: true
      description: Commerçant du prestataire du chemin (sinon `404`).
      schema:
        type: string
        format: uuid
    EventPathId:
      name: event_id
      in: path
      required: true
      description: Événement du prestataire du chemin (sinon `404`).
      schema:
        type: string
        format: uuid
    ParticipationId:
      name: participation_id
      in: path
      required: true
      description: Participation d'un commerçant à un événement.
      schema:
        type: string
        format: uuid
    PosId:
      name: pos_id
      in: path
      required: true
      description: Point de vente.
      schema:
        type: string
        format: uuid
    FeeRuleId:
      name: fee_rule_id
      in: path
      required: true
      description: Règle de frais.
      schema:
        type: string
        format: uuid
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyIndex:
      name: key_index
      in: path
      required: true
      description: Index de clé de bracelet (octets 2-3 de la page 4, format B).
      schema:
        type: integer
        minimum: 0
        maximum: 65535
    TagKeyJobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requête invalide (`VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`…).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/VALIDATION_FAILED
            title: Requête invalide
            status: 400
            code: VALIDATION_FAILED
            detail: 'amount : doit être un entier strictement positif'
            instance: /v1/payments
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
            errors:
              - pointer: /amount
                message: doit être un entier strictement positif
    Unauthorized:
      description: |
        Authentification absente ou invalide (`UNAUTHENTICATED`, `DEVICE_SIGNATURE_INVALID`,
        `REFRESH_TOKEN_INVALID`, `WEBHOOK_SIGNATURE_INVALID`). Pour un terminal, la réponse ne dit pas quelle
        preuve a échoué. Ouverture d'une session de vendeur refusée : `VENDOR_PIN_INVALID` (réponse unique).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/UNAUTHENTICATED
            title: Authentification requise
            status: 401
            code: UNAUTHENTICATED
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
    Forbidden:
      description: |
        Droits insuffisants ou appareil inactif (`FORBIDDEN`, `DEVICE_SUSPENDED`, `OFFLINE_NOT_ALLOWED`…), ou
        jeton d'approbation sur place absent (`APPROVAL_REQUIRED`) ou refusé (`APPROVAL_INVALID`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/DEVICE_SUSPENDED
            title: Terminal suspendu
            status: 403
            code: DEVICE_SUSPENDED
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
    NotFound:
      description: Objet introuvable (ou appartenant à un autre prestataire — réponse neutre).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/NOT_FOUND
            title: Objet introuvable
            status: 404
            code: NOT_FOUND
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
    Conflict:
      description: |
        Conflit d'état ou d'idempotence (`IDEMPOTENCY_KEY_REUSED`, `DEBIT_AUTHORITY_EDGE`,
        `DEBIT_AUTHORITY_MOVING`, `HANDOVER_INVALID_STATE`, `CHAIN_BROKEN`, `ALREADY_REVERSED`,
        `MEDIA_STATE_INVALID`, `SEQ_OUT_OF_RANGE`, `TAP_UNUSABLE`, `APPROVAL_INVALID` pour une demande
        d'approbation expirée ou déjà décidée, `LATE_CLAIM_INVALID` pour une réclamation tardive hors bornes,
        `VENDOR_SESSION_INVALID`, `PAYMENT_REQUEST_NOT_PENDING`…).
        `DEBIT_AUTHORITY_EDGE` et `DEBIT_AUTHORITY_MOVING` ne sont pas des refus définitifs : rejouer la même
        requête, avec la même clé, vers l'autorité indiquée ou suivante (sync_protocol.md §5.1, §9).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            edge:
              summary: Autorité de débit détenue par la passerelle
              value:
                type: https://docs.cashless.test/problems/DEBIT_AUTHORITY_EDGE
                title: Débit refusé par le central
                status: 409
                code: DEBIT_AUTHORITY_EDGE
                detail: Les débits de ce grand livre sont autorisés par la passerelle locale.
                request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
                retryable: true
                edge_base_url: https://edge.local:8443/v1
                authority_epoch: 5
            reused:
              summary: Clé rejouée avec un contenu différent
              value:
                type: https://docs.cashless.test/problems/IDEMPOTENCY_KEY_REUSED
                title: Clé d'idempotence déjà utilisée
                status: 409
                code: IDEMPOTENCY_KEY_REUSED
                detail: La clé TPE-BAR-01:0003 a déjà servi pour un autre contenu.
                request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
                retryable: false
    ApprovalRequestAccepted:
      description: |
        Opération à deux personnes du back-office (ADR-74) : demande d'approbation créée (`PENDING`), rien n'est
        encore exécuté. Une seconde personne l'approuve (`approveApprovalRequest`) ou la refuse
        (`rejectApprovalRequest`) avant `expires_at` (24 h). Un rejeu avec la même clé d'idempotence renvoie la
        même demande.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Idempotency-Replayed:
          $ref: '#/components/headers/Idempotency-Replayed'
        Location:
          description: '`/v1/approval-requests/{approval_request_id}`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalRequest'
          example:
            approval_request_id: 4b5c6d7e-8f90-4a1b-9c2d-3e4f5a6b7c8d
            action: WAIVE_SEQ_GAP
            target_id: 7c0e1a52-0000-4000-8000-000000000002
            payload:
              device_id: 7c0e1a52-0000-4000-8000-000000000002
              seq: 87
              reason: Terminal réinitialisé en usine après chute, journal local perdu.
            requested_by: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            requested_at: '2026-12-13T09:00:00Z'
            expires_at: '2026-12-14T09:00:00Z'
            status: PENDING
            decided_by: null
            decided_at: null
            decision_note: null
            executed_tx_id: null
            result: null
            failure_code: null
            failure_reason: null
    Unprocessable:
      description: Règle métier non satisfaite (`INSUFFICIENT_FUNDS`, `MEDIA_BLOCKED`, `WALLET_LIMIT_EXCEEDED`…).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cashless.test/problems/INSUFFICIENT_FUNDS
            title: Solde insuffisant
            status: 422
            code: INSUFFICIENT_FUNDS
            detail: Solde disponible 3000 XOF, montant demandé 6000 XOF.
            request_id: 0f1e2d3c-4b5a-4987-8a6b-5c4d3e2f1a0b
            retryable: false
            available_balance: 3000
            currency: XOF
    PayloadTooLarge:
      description: |
        Lot trop volumineux (`BATCH_TOO_LARGE`) ; le découper. Notification de PSP de plus de 64 Kio
        (`PAYLOAD_TOO_LARGE`) : rien n'est conservé.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Trop de requêtes (`RATE_LIMITED`, `OTP_RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Service ou PSP indisponible (`SERVICE_UNAVAILABLE`, `PSP_UNAVAILABLE`) ; réessayer avec la MÊME clé.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------------------ Communs
    Problem:
      type: object
      description: RFC 9457 Problem Details, avec extensions stables.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
          description: '`https://docs.cashless.test/problems/<code>`'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
          description: '`true` si réessayer à l''identique (même clé d''idempotence) peut réussir.'
        errors:
          type: array
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: JSON Pointer (RFC 6901) vers le champ fautif.
              message:
                type: string
        violations:
          type: array
          description: |
            `VALIDATION_FAILED` sur un réglage hors bornes (§4.1) : une entrée par borne franchie. Le `detail`
            cite la même règle, traduit selon `Accept-Language`.
          items:
            type: object
            required: [field, rule, requested, limit, source]
            properties:
              field:
                type: string
                description: Réglage refusé (`refund_deadline`, `cash_refund_single_max`…).
              rule:
                type: string
                description: Identifiant stable de la règle (`jurisdiction.min_refund_window_days`, `catalog.range`, `operator.cash_refund_single_max_cap`…).
              requested:
                description: Valeur demandée.
              limit:
                description: Borne franchie.
              source:
                type: string
                description: Origine de la borne — profil de législation (`SN v1`), niveau et version de configuration, ou `catalog`.
        authority_epoch:
          type: integer
          format: int64
          minimum: 0
          description: |
            `409 STALE_AUTHORITY_EPOCH` : époque d'autorité de débit COURANTE du grand livre de l'événement du
            terminal (`ledger.authority_epoch`). Le terminal la reprend, relit sa configuration et rejoue avec une
            nouvelle clé `<serial>:<seq>`. Absent des autres problèmes.
      additionalProperties: true
    ProblemCode:
      type: string
      description: |
        Codes métier stables (ne jamais renommer ; en ajouter est une évolution compatible). La traduction
        SQLSTATE → code suit SPECIFICATION §5.7 (jamais le texte du message SQL). Sens de chaque code :
        - `VALIDATION_FAILED` (400, ou 422 pour une valeur bien formée mais non prise en charge) : requête ou donnée invalide, y compris tout refus `CL001` de la base.
        - `UNAUTHENTICATED` (401) : jeton ou certificat absent, expiré ou invalide.
        - `FORBIDDEN` (403) : rôle insuffisant (y compris le valideur d'une demande d'approbation), ou refus de la
          base faute de seconde personne distincte de l'auteur (`23514`).
        - `APPROVAL_REQUIRED` (403) : opération de guichet qui exige une seconde personne, sans en-tête
          `X-Approval-Token` (ADR-74).
        - `APPROVAL_INVALID` : seconde validation refusée (ADR-74). Règle : `403` pour un jeton d'approbation sur
          place (invalide, expiré, déjà utilisé, d'une autre action ou de la même personne que l'appelant, rôle
          du valideur insuffisant) ; `409` (`CL023`) pour une demande d'approbation du back-office (expirée, déjà
          décidée, ou décidée par son auteur). 403 = la preuve jointe à la requête ne vaut rien ; 409 = l'état
          de la demande enregistrée ne permet plus la décision.
        - `NOT_FOUND` (404) : objet inexistant ou d'un autre prestataire (réponse neutre).
        - `RATE_LIMITED` (429) : trop de requêtes ou d'essais ; voir `Retry-After`.
        - `INTERNAL_ERROR` (500) : erreur interne ; réessayer avec la même clé d'idempotence.
        - `SERVICE_UNAVAILABLE` (503) : service momentanément indisponible ; réessayer avec la même clé.
        - `IDEMPOTENCY_KEY_REQUIRED` (400) : écriture sans en-tête `Idempotency-Key`.
        - `IDEMPOTENCY_KEY_REUSED` (409, `CL002`) : même clé, contenu différent.
        - `IDEMPOTENCY_KEY_IN_PROGRESS` (409) : requête concurrente avec la même clé encore en cours.
        - `ENROLLMENT_CODE_INVALID` (422) : code d'enrôlement inconnu ou déjà utilisé.
        - `ENROLLMENT_CODE_EXPIRED` (422) : code d'enrôlement expiré.
        - `ATTESTATION_FAILED` (422) : attestation de clé Android non conforme (clé hors du matériel sécurisé,
          bootloader déverrouillé, application non signée ou modifiée). Pas de MDM (ADR-69).
        - `REFRESH_TOKEN_INVALID` (401) : jeton de rafraîchissement inconnu, déjà consommé (la famille est
          révoquée) ou preuve de possession invalide.
        - `DEVICE_SUSPENDED` (403) : terminal suspendu.
        - `DEVICE_REVOKED` (403) : terminal révoqué (SQLSTATE `42501`).
        - `DEVICE_NOT_ASSIGNED` (409) : terminal sans affectation (événement, point de vente) pour cette action.
        - `DEVICE_MODE_NOT_ALLOWED` (422) : mode d'application non permis ; en V1, tout usage de `PAIRED_TPE`
          ou de `payment_intent_id` (V2, ADR-43).
        - `CLOCK_SKEW_TOO_LARGE` (400) : horloge du terminal hors de la tolérance (`clock_tolerance_seconds`).
          Sur une route de terminal, l'heure du serveur est renvoyée dans l'en-tête `Date`.
        - `DEVICE_SIGNATURE_INVALID` (401) : signature de la requête du terminal absente, invalide ou rejouée
          (`deviceSignature`) ; la réponse ne dit pas quel élément a échoué.
        - `DEVICE_SERIAL_IN_USE` (409) : `serial` déjà porté par un terminal non révoqué du même prestataire.
        - `CURRENCY_MISMATCH` (422) : devise différente de celle de l'événement.
        - `AMOUNT_OUT_OF_RANGE` (422) : montant hors des bornes permises pour l'opération.
        - `INSUFFICIENT_FUNDS` (422, `CL007`) : solde disponible insuffisant (refus en ligne définitif).
        - `WALLET_BLOCKED` (422, `CL039`) : portefeuille bloqué ou clos (à l'initiation d'une recharge PSP et à la
          notification).
        - `WALLET_LIMIT_EXCEEDED` (422, `CL008`) : plafond de solde dépassé.
        - `MONTHLY_TOPUP_LIMIT_EXCEEDED` (422, `CL009`) : plafond mensuel de recharge dépassé.
        - `MEDIA_UNKNOWN` (404) : UID ou bracelet inconnu (chemin en ligne ; dans un lot :
          `MEDIA_NOT_IN_SNAPSHOT`).
        - `MEDIA_BLOCKED` (422, `CL038`) : bracelet `SUSPENDED` ou `BLACKLISTED`.
        - `MEDIA_NOT_ACTIVATED` (422) : bracelet `PERSONALIZED` ou `ISSUED`, pas encore rattaché.
        - `MEDIA_RETIRED` (422) : bracelet `RETIRED` ou `DESTROYED`.
        - `MEDIA_REPLACED` (422) : bracelet remplacé par un autre.
        - `MEDIA_RELEASED` (422) : bracelet restitué.
        - `MEDIA_UID_MISMATCH` (422) : identité lue incohérente avec l'UID enregistré.
        - `MEDIA_CLONE_SUSPECTED` (422) : compteur déjà vu ou identité retirée ; bracelet mis en liste noire.
        - `MEDIA_SIGNATURE_MISMATCH` (422) : signature d'originalité différente de celle de la personnalisation
          (résultat `SIGNATURE_MISMATCH`) ; bracelet mis en liste noire (ADR-59).
        - `MEDIA_SIGNATURE_MISSING` (422) : signature d'originalité absente alors que la puce en a une enregistrée
          (résultat `SIGNATURE_MISSING`) ; relire le bracelet. Pas de liste noire.
        - `MEDIA_STATE_INVALID` (409, `CL020`) : bracelet ou lot dans un état qui ne permet pas l'action
          (remplacement, restitution avec espèces dues, rendu d'espèces sans somme due, lot, caution).
        - `MEDIA_WRONG_EVENT` (422) : bracelet d'un lot d'un autre événement.
        - `MEDIA_BATCH_INACTIVE` (422) : lot du bracelet non `ACTIVE`.
        - `MEDIA_CLAIM_INVALID` (422) : code de rattachement inconnu ou déjà utilisé (réponse identique).
        - `TAP_EXPIRED` (422) : `tap_id` au-delà de `tap_replay_window_seconds` (défaut 120 s), contrôle de l'API
          avant écriture ; relire le bracelet.
        - `TAP_ALREADY_USED` (409) : `tap_id` déjà consommé par une autre opération, ou présenté par un autre
          terminal (contrôle de l'API avant écriture).
        - `TAP_UNUSABLE` (409, `CL022`) : refus de `consume_tap` : passage déjà utilisé par une autre écriture, ou
          par une demande de rattachement (lecture qui a confirmé un rattachement, `consume_tap_for_claim`), ou
          écriture en ligne plus de `tap_replay_window_seconds` après la lecture ; relire le bracelet.
        - `ACTIVATION_MODE_NOT_ALLOWED` (422) : mode d'activation absent de `event.activation_modes`.
        - `ACCOUNT_REQUIRED` (422) : `identity_mode = ACCOUNT_REQUIRED` et aucun compte client fourni.
        - `DEPOSIT_OUTSTANDING` (409) : caution encore `HELD` ; la rendre avant la restitution.
        - `BALANCE_OUTSTANDING` (409) : portefeuille non soldé ; restitution impossible.
        - `DEPOSIT_PAYMENT_REQUIRED` (422) : caution `SEPARATE` sans moyen de paiement (`deposit_payment`).
        - `EVENT_CLOSING` (409, `CL004`) : grand livre en clôture ; recharges et ventes en ligne refusées.
        - `LEDGER_LOCKED` (409, `CL003`) : grand livre verrouillé.
        - `PERIOD_CLOSED` (409, `CL005`) : date dans une période close.
        - `DEBIT_AUTHORITY_EDGE` (409, `CL006`) : débits autorisés par la passerelle ; rejouer la même requête
          (même clé) vers `edge_base_url`. Pas un refus.
        - `DEBIT_AUTHORITY_MOVING` (409) : bascule d'autorité en cours (passerelle en `RELEASING`). Pas un
          refus définitif : garder la même clé, passer hors ligne si la politique le permet, puis rejouer vers
          la nouvelle autorité (sync_protocol.md §5.1, §9.3).
        - `STALE_AUTHORITY_EPOCH` (409, `CL015`) : époque d'autorité périmée ; l'émetteur cesse de débiter.
        - `HANDOVER_INVALID_STATE` (409, `CL013`) : action de bascule impossible dans l'état du handover.
        - `EDGE_NOT_CAUGHT_UP` (409, `CL014`) : passerelle en retard (filigrane non atteint, `edge_seq` manquants).
        - `REVERSAL_NOT_ALLOWED` (422, `CL036`) : transaction non annulable (type, vendeur ou terminal différent).
        - `REVERSAL_WINDOW_EXPIRED` (409) : délai d'annulation dépassé.
        - `ALREADY_REVERSED` (409, `CL035`) : transaction déjà annulée (contrainte
          `journal_transaction_reverses_once`).
        - `OFFLINE_NOT_ALLOWED` (403) : hors ligne désactivé pour ce terminal (seul nom de ce refus).
        - `SNAPSHOT_VERSION_UNKNOWN` (409) : version de snapshot inconnue pour ce grand livre ; demander un FULL.
        - `BATCH_IN_PROGRESS` (409, `CL010`) : un lot est déjà en cours pour ce terminal ; attendre son résultat.
        - `BATCH_TOO_LARGE` (413, `CL011`) : lot vide ou de plus de 500 opérations ou 1 Mio.
        - `PAYLOAD_TOO_LARGE` (413) : notification de PSP de plus de 64 Kio ; rien n'est conservé.
        - `BATCH_SIGNATURE_INVALID` (400) : signature de l'en-tête du lot invalide ; lot non traité.
        - `CHAIN_BROKEN` (409, `CL017`) : chaîne de hachage rompue (terminal ou passerelle) ; alerte, examen manuel.
        - `SEQ_OUT_OF_ORDER` (400 pour un lot de terminal non continu ; 409, `CL016`, pour un `edge_seq`
          qui n'est pas le suivant attendu).
        - `SEQ_GAP_NOT_FOUND` (409, `CL012`) : le numéro à lever n'est pas un trou connu.
        - `SEQ_OUT_OF_RANGE` (409, `CL021`) : numéro ou lot au-delà de `contiguous_acked_seq + 10 000`
          (`max_seq_jump`) ; refusé sans anomalie.
        - `PAYMENT_REQUEST_EXPIRED` (409) : demande de paiement QR expirée.
        - `PAYMENT_REQUEST_NOT_PENDING` (409, `CL037`) : demande de paiement QR déjà payée, annulée ou expirée, ou
          jeton inconnu ; réponse unique, sans dire lequel des cas.
        - `QR_TOKEN_INVALID` (422) : jeton de QR client inconnu, expiré ou déjà utilisé.
        - `PAYMENT_INTENT_INVALID_STATE` (409, V2) : intention dans un état qui ne permet pas l'action.
        - `PAYMENT_INTENT_EXPIRED` (409, V2) : intention expirée.
        - `PSP_UNAVAILABLE` (503) : PSP injoignable ; réessayer avec la même clé. Inclut un fournisseur
          indisponible en production tant que les adaptateurs réels ne sont pas livrés (OP-N81).
        - `PSP_NOT_CONFIGURED` (409) : aucune configuration PSP valide pour ce moyen et cet événement (S26b ou défaut de l'organisateur, titulaire = détenteur des fonds, ADR-72) ; le titulaire est contrôlé à la résolution.
        - `PSP_REJECTED` (422) : paiement refusé par le PSP.
        - `WEBHOOK_SIGNATURE_INVALID` (401) : signature HMAC du webhook entrant invalide.
        - `WEBHOOK_TIMESTAMP_OUT_OF_TOLERANCE` (401) : horodatage du webhook hors tolérance (rejeu suspect).
        - `REFUND_NOT_ALLOWED` (422) : remboursement impossible (solde payé nul, destination non vérifiée…).
        - `REFUND_WINDOW_CLOSED` (422) : fenêtre de remboursement close.
        - `REFUND_ALREADY_OPEN` (409) : une demande de remboursement est déjà ouverte pour ce portefeuille.
        - `OTP_INVALID` (422) : code à usage unique faux, expiré ou déjà utilisé.
        - `CARD_DAILY_LIMIT` (422) : plafond de recharge par carte et par jour atteint (ADR-77). Contrôlé à la
          notification, jamais à l'initiation : c'est le motif d'échec d'une recharge (`failure_reason`).
        - `OTP_RATE_LIMITED` (429) : trop de demandes ou d'essais de code à usage unique (défauts : 3 envois par
          numéro sur 15 min, 10 demandes par IP et par heure, 5 essais par code puis blocage du numéro 30 min).
        - `CONFLICT_STATE` (409) : objet dans un état qui ne permet pas l'action (ex. demande de
          remboursement qui n'est pas `REQUESTED` à l'approbation ; opération en espèces sans session de caisse
          ouverte pour le terminal, ADR-89).
        - `EVENT_TRANSITION_INVALID` (409, `CL018`) : passage de statut d'événement non prévu (ADR-51).
        - `CLOSING_CONDITION_NOT_MET` (409, `CL019`) : condition de clôture calculable non remplie ; le détail nomme la condition (ADR-51).
        - `ENROLLMENT_EVENT_CLOSED` (422, `CL031`) : création d'un code d'enrôlement ou enrôlement refusé pour un
          événement `CLOSED` ou un point de vente supprimé, ou, dès `CLOSING`, pour les modes `CATALOG_POS` et
          `KEYPAD_TPE` (OP-N74) ; rien n'est écrit.
        - `VENDOR_SESSION_INVALID` (409, `CL032`) : session de vendeur absente, close, expirée, d'un autre terminal
          ou autre que celle désignée, ou vendeur désactivé ou bloqué ; ouvrir une nouvelle session.
        - `VENDOR_PIN_INVALID` (401, `CL033`) : ouverture de session refusée ; réponse unique (même statut, même
          corps) pour un PIN faux, un vendeur inconnu, bloqué, désactivé ou d'un autre commerçant (NFR-004).
        - `SALE_LINES_INVALID` (422, `CL034`) : lignes de vente refusées (article inconnu, inactif ou d'un autre
          point de vente, prix ou taux ni courant ni servi au terminal, somme différente du montant) ; se
          resynchroniser.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
