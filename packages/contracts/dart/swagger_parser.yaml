# Génération des types Dart depuis le contrat (mission bracelets-nfc, research R-10). Types seulement : pas de client.
swagger_parser:
  schema_path: ../openapi.yaml
  output_directory: lib/src/generated
  language: dart
  json_serializer: json_serializable
  # L'outil écrit toujours des clients (retrofit, dio) : on les range à part et le script de génération les supprime.
  root_client: false
  put_clients_in_folder: true
  export_file: true
  enums_to_json: true
  unknown_enum_value: false
  mark_files_as_generated: true
