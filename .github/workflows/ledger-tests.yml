# .github/workflows/ledger-tests.yml — vérifie à chaque push / PR tout ce que livrent les missions, sous PostgreSQL 17 :
# générateurs, calculs de référence, bibliothèque de format des bracelets (TypeScript et Dart), types du contrat
# (TypeScript et Dart), lint, types, migrations, suites pgTAP, puis tests Jest (unitaires, intégration, rejeu du
# scénario) et mesures de temps isolées (dont la latence du paiement, NFR-001). Détail et répétition locale : .github/CI.md.
# Mission identite-enrolement-terminaux (lot WP18, T085) : historique git complet (test
# `git diff` de SC-007), installation sans aucun script vérifiée, réglages de test des
# terminaux (clés HMAC, jetons, attestation), types du contrat régénérés sans écart, nouvelles
# suites pgTAP (tests/*.sql, lues par test-pgtap.sh), tests HTTPS (certificats générés à
# l'exécution par apps/api/test/support/tls.ts, aucune clé dans le dépôt) et mesures des
# terminaux isolées.
# Mission recharges-caisses-psp (lot WP14, T072) : une étape de plus, la latence des recharges (NFR-006 notifications
# PSP, NFR-009 recharges espèces), suite seule après la passe parallèle ; les suites pgTAP de la mission
# (tests_cash_sessions, tests_psp_configurations, tests_psp_topups, tests_cash_psp_rights, tests_execute_grants) sont
# lues par le motif tests/*.sql de test-pgtap.sh ; `check:generated` garde les .sql générés intacts (C-002).
# Mission passerelle-locale (lot WP25, T117) : contrôle de stabilité du contrat (témoin positif, jamais
# tolérant), migrations de la passerelle puis suites `apps/gateway` hors e2e (`gateway-integration`), et job
# séparé `gateway-e2e` (preuves de bout en bout en série, image construite puis balayée, NFR-001 à 100
# débits/s). Toutes les actions tierces sont épinglées par SHA de commit (test ci-workflow.spec.ts).
name: ledger-tests
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      # Lus par psql/createdb/pg_prove, par tools/dev-db/env.sh (valeurs gardées) et par les tests.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cashless_test
      CASHLESS_APP_PASSWORD: cashless_app_ci
      CASHLESS_PLATFORM_PASSWORD: cashless_platform_ci
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/cashless_test
      DATABASE_URL_APP: postgres://cashless_app:cashless_app_ci@localhost:5432/cashless_test
      DATABASE_URL_PLATFORM: postgres://cashless_platform:cashless_platform_ci@localhost:5432/cashless_test
      # Rôles des processus des clés de bracelet (post-roles.sql) : mots de passe posés par les migrations.
      CASHLESS_TAGKEYS_PASSWORD: cashless_tagkeys_ci
      CASHLESS_PERSO_PASSWORD: cashless_perso_ci
      CASHLESS_TAGCHECK_PASSWORD: cashless_tagcheck_ci
      CASHLESS_KEYADMIN_PASSWORD: cashless_keyadmin_ci
      CASHLESS_SNAPCONTENT_PASSWORD: cashless_snapcontent_ci
      CASHLESS_SNAPSIGN_PASSWORD: cashless_snapsign_ci
      CASHLESS_MAINT_PASSWORD: cashless_maint_ci
      DATABASE_URL_TAGKEYS: postgres://cashless_tagkeys:cashless_tagkeys_ci@localhost:5432/cashless_test
      DATABASE_URL_PERSO: postgres://cashless_perso:cashless_perso_ci@localhost:5432/cashless_test
      DATABASE_URL_TAGCHECK: postgres://cashless_tagcheck:cashless_tagcheck_ci@localhost:5432/cashless_test
      DATABASE_URL_KEYADMIN: postgres://cashless_keyadmin:cashless_keyadmin_ci@localhost:5432/cashless_test
      # Mission hors-ligne-snapshots-lots (WP21) : processus snapshot-content, snapshot-signer et
      # maintenance. Sans ces trois adresses, config.ts retombe sur 127.0.0.1:5433 (cluster local)
      # et les suites de processus ne se connectent pas.
      DATABASE_URL_SNAPCONTENT: postgres://cashless_snapcontent:cashless_snapcontent_ci@localhost:5432/cashless_test
      DATABASE_URL_SNAPSIGN: postgres://cashless_snapsign:cashless_snapsign_ci@localhost:5432/cashless_test
      DATABASE_URL_MAINT: postgres://cashless_maint:cashless_maint_ci@localhost:5432/cashless_test
      # Clé d'empreinte des codes de rattachement : valeur de test (32 octets en hexadécimal), sans valeur ailleurs.
      CLAIM_CODE_HMAC_KEY: 636173686c6573732d63692d636c61696d2d636f64652d686d61632d74657374
      # Répartiteurs de confiance devant l'API (OP-N53) : aucun en CI, l'adresse est celle de la connexion. Obligatoire
      # en production (refus de démarrer sans valeur) ; les tests qui simulent un répartiteur le règlent eux-mêmes.
      TRUST_PROXY_HOPS: "0"
      # Mode d'exécution (RISK-3) : obligatoire, sinon tout processus refuse de démarrer. `test` en
      # CI : faux permis.
      NODE_ENV: test
      # Mission identite-enrolement-terminaux : VALEURS DE TEST seulement (publiques, celles de
      # tools/dev-db/env.sh et des défauts hors production de config.ts), refusées en production
      # même posées. Secrets HMAC (research R-13) : 32 octets au moins, distincts entre eux et de
      # CLAIM_CODE_HMAC_KEY.
      IDEMPOTENCY_HMAC_KEY: 636173686c6573732d6964656d706f74656e63792d686d61632d6b65792d64652d746573742d756e697175656d656e742d3030
      ENROLLMENT_CODE_HMAC_KEY: 636173686c6573732d656e726f6c6c6d656e742d636f64652d686d61632d6b65792d64652d746573742d756e697175656d656e74
      # Jetons d'appareil (R-07), certificat client (R-09), tolérance d'horloge (requêtes signées).
      DEVICE_TOKEN_ISSUER: https://api.cashless.test
      DEVICE_TOKEN_TTL_SECONDS: "900"
      DEVICE_REFRESH_TOKEN_TTL_DAYS: "30"
      DEVICE_CERT_VALIDITY_DAYS: "365"
      CLOCK_TOLERANCE_SECONDS: "120"
      # Requêtes signées : autorités des serveurs HTTPS de test (port tiré à chaque test ; joker
      # refusé en production).
      DEVICE_REQUEST_AUTHORITIES: "localhost:*,127.0.0.1:*"
      # Attestation (R-05, R-06) : application de test (valeurs de TEST_DEVICE_SETTINGS) ;
      # racines de test générées par les suites (test/support/attestation), aucune dans le dépôt.
      ANDROID_APP_PACKAGE: org.cashless.terminal
      ANDROID_APP_SIGNING_DIGESTS: 7d51f416c76adade6809a73c4308b8fec0b742b2a6d3011edab8dda18d17ffb6
      IOS_TEAM_ID: TESTTEAM01
      IOS_BUNDLE_ID: org.cashless.terminal
      IOS_APP_ATTEST_ENVIRONMENT: development
    steps:
      # Historique complet : le test SC-007 (media-port-swap.spec.ts) compare les contrôleurs de la
      # mission 4 à la branche principale (`git merge-base HEAD origin/main`).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # SDK Dart épinglé : bibliothèque de format des bracelets et types Dart du contrat.
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: "3.8.3"

      - name: Module Python cryptography (script de vecteurs du kit, version épinglée)
        run: |
          python -m pip install --only-binary=:all: "cryptography==44.0.3"

      - name: Installer pgTAP dans le conteneur et pg_prove sur le runner
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c "apt-get update -qq && apt-get install -y -qq postgresql-17-pgtap"
          # L'installation de pgTAP peut monter la version mineure de PostgreSQL 17 sous le serveur
          # en marche (17.11 -> 17.12 le 12/11/2026 : plpgsql.so incompatible, toute migration
          # échoue) : le service est redémarré sur les nouveaux binaires, puis attendu.
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 60); do
            docker exec ${{ job.services.postgres.id }} pg_isready -U postgres && break
            sleep 1
          done
          docker exec ${{ job.services.postgres.id }} pg_isready -U postgres
          sudo apt-get update -qq && sudo apt-get install -y -qq libtap-parser-sourcehandler-pgtap-perl postgresql-client

      # .npmrc porte ignore-scripts=true (research R-12) : vérifié avant l'installation.
      - name: Dépendances (sans scripts d'installation)
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          npm ci --ignore-scripts

      - name: Suites pgTAP générées à jour
        run: npm run check:generated -w @cashless/ledger-sql

      - name: Calculs de référence du moteur d'écritures
        run: python packages/ledger-sql/moteur_ecritures_reference.py

      - name: Bibliothèque de format (TypeScript)
        run: npm test -w @cashless/tag-format

      - name: Bibliothèque de format (Dart)
        working-directory: packages/tag-format/dart
        run: |
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos
          dart test

      - name: Types du contrat à jour (TypeScript et Dart)
        run: npm run check -w @cashless/contracts

      - name: Stabilité du contrat (témoin positif)
        run: |
          node tools/contract-stability/check.mjs
          node tools/contract-stability/check-baseline-decision.mjs
          node --test tools/contract-stability/check.test.mjs tools/contract-stability/check-baseline-decision.test.mjs

      - name: Types du contrat régénérés sans écart
        run: |
          npm run generate
          git diff --exit-code -- packages/contracts

      - name: Lint et vérification des types
        run: |
          npm run lint
          npm run typecheck

      - name: Base par les migrations
        run: |
          createdb cashless_test
          npm run migrate -w @cashless/ledger-sql

      # Passerelle locale (WP25, T117) : rôle et base locale `edge_app`, migrations `edge-NNNN`, puis les suites
      # d'intégration de `apps/gateway` hors e2e, en série. Le rôle `edge_app` est celui du site (propriétaire de
      # sa base locale) ; mot de passe de test, public.
      - name: Migrations de la passerelle (base locale edge_app)
        env:
          GATEWAY_DATABASE_URL: postgres://edge_app:edge_app_local@localhost:5432/cashless_gateway_ci
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE edge_app LOGIN PASSWORD 'edge_app_local' NOSUPERUSER CREATEDB"
          createdb -O edge_app cashless_gateway_ci
          npm run migrate -w @cashless/gateway

      # Quelques suites de la passerelle lisent le journal et lancent `pg_dump` du serveur : le conteneur du service
      # porte le nom du poste de développement et `pg_dump` est celui du conteneur (version 17 du serveur).
      - name: Accès au conteneur PostgreSQL pour les suites de la passerelle
        run: |
          docker rename ${{ job.services.postgres.id }} cashless-platform-pg17
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec docker exec -e PGPASSWORD="$PGPASSWORD" cashless-platform-pg17 pg_dump "$@"\n' > "$RUNNER_TEMP/bin/pg_dump"
          chmod +x "$RUNNER_TEMP/bin/pg_dump"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Intégration de la passerelle (gateway-integration, hors e2e, en série)
        run: npm test -w @cashless/gateway -- --runInBand --forceExit

      - name: Suites pgTAP (référence, scénario, S21, suites du dépôt dont celles des terminaux)
        run: npm run test:pgtap -w @cashless/ledger-sql

      # Intégration en HTTPS réel (terminal de test, identité réelle) comprise : certificats générés
      # à l'exécution dans un répertoire temporaire privé.
      - name: Tests Jest sur base recréée (unitaires, intégration, scénario)
        run: |
          npm run reset-db -w @cashless/ledger-sql
          SKIP_LATENCY=1 npm test

      # Concurrence de la mission recharges-caisses-psp (NFR-001, NFR-008, SC-003) : jusqu'à 100 connexions
      # simultanées par suite ; écartées de la passe parallèle (SKIP_LATENCY=1), lancées seules, en série.
      - name: Concurrence des caisses, recharges PSP et contestations (suites seules, en série)
        run: >-
          npm test -w @cashless/api -- --runInBand
          end-to-end/psp-concurrency end-to-end/cash-concurrency topups/psp-concurrency
          chargebacks/chargeback-concurrency cash-sessions/close-concurrency

      # Travailleurs psp-poller (interrogation, reprise, purge) : ils voient les recharges de tous les prestataires
      # (OP-N86) ; suites écartées de la passe parallèle, lancées seules, en série.
      - name: Travailleurs psp-poller (suites seules, en série)
        run: >-
          npm test -w @cashless/api -- --runInBand
          end-to-end/topup-journey end-to-end/topup-secrets webhooks/receive webhooks/retry topups/poller-

      # Mission hors-ligne-snapshots-lots (WP21, NFR-001, NFR-011, NFR-013) : 100 rejeux d'un même
      # lot, 50 envois concurrents d'un terminal, pool de verrous des lots réduit ; écartée de la
      # passe parallèle (SKIP_LATENCY=1), lancée seule, en série.
      - name: Concurrence des lots hors ligne (suite seule, en série)
        run: npm test -w @cashless/api -- --runInBand end-to-end/offline-concurrency

      # Parcours complets de la mission hors-ligne-snapshots-lots (WP21) : ils lancent les travailleurs de
      # snapshots, qui voient les grands livres de toutes les suites ; écartés de la passe parallèle, lancés seuls.
      - name: Parcours hors ligne (suites seules, en série)
        run: >-
          npm test -w @cashless/api -- --runInBand
          end-to-end/offline-journey end-to-end/offline-minimal

      # Rotation des clés de signature des snapshots (WP09) : les suites vident la table des clés, globale
      # (au plus deux clés valides) ; une suite voisine qui publie un snapshot la référence. Lancées seules,
      # sur base recréée : les snapshots laissés par les parcours ci-dessus référencent encore des clés.
      - name: Clés de signature des snapshots (suites seules, en série, base recréée)
        run: |
          npm run reset-db -w @cashless/ledger-sql
          npm test -w @cashless/api -- --runInBand snapshot-keys/rotation snapshot-keys/key-admin-worker

      - name: Latence des routes de configuration (suite seule, sans nouvel essai)
        run: npm test -w @cashless/api -- configuration-latency

      - name: Latence des bracelets, NFR-006 (suite seule, sans nouvel essai)
        run: npm test -w @cashless/api -- media-latency

      - name: Codes imprimés sans énumération, NFR-007 (suite seule, sans nouvel essai)
        run: npm test -w @cashless/api -- claims-timing

      # NFR-009 (preuves, enrôlement, configuration, battement de cœur) et NFR-006 (codes
      # d'enrôlement) : suites des terminaux seules, en série, sans nouvel essai.
      - name: Latence et chronométrage des terminaux, NFR-009 et NFR-006 (suites seules, en série)
        run: >-
          npm test -w @cashless/api -- --runInBand
          end-to-end/device-latency devices/config.spec devices/heartbeat.spec
          devices/enrollment.spec

      # NFR-001 (mission terminaux-paiement-en-ligne, WP14) : 200 paiements par bracelet en un aller-retour, en
      # série, serveur seul ; p95 ≤ 200 ms et p99 ≤ 500 ms. Après la passe parallèle (SKIP_LATENCY=1), SEULE :
      # aucune autre suite ne tourne pendant la mesure.
      - name: Latence du paiement, NFR-001 (suite seule, sans nouvel essai)
        run: npm test -w @cashless/api -- --runInBand end-to-end/payment-latency

      # NFR-006 (200 notifications PSP authentifiées, p95 <= 500 ms) et NFR-009 (200 recharges espèces, p95 <= 200 ms)
      # de la mission recharges-caisses-psp (WP14) : en série, serveur seul. Après la passe parallèle, SEULE.
      - name: Latence des recharges, NFR-006 et NFR-009 (suite seule, sans nouvel essai)
        run: npm test -w @cashless/api -- --runInBand end-to-end/topup-latency

      # NFR-003 (lot de 500 opérations, p95 <= 60 s), NFR-004 (FULL de 50 000 bracelets signé en
      # 30 s, DELTA servi en 2 s pour 95 % des demandes) et NFR-005 (blocage publié en 5 s, autre
      # changement en 60 s) de la mission hors-ligne-snapshots-lots (WP21) : en série, serveur seul,
      # après la passe parallèle. SEULES : aucune autre suite ne tourne pendant la mesure, et les
      # travailleurs de snapshots voient tous les grands livres.
      - name: Latence des lots et des snapshots hors ligne, NFR-003 à NFR-005 (suites seules, sans nouvel essai)
        run: >-
          npm test -w @cashless/api -- --runInBand
          end-to-end/offline-latency end-to-end/snapshot-latency

  # Preuves de bout en bout de la passerelle locale (mission 8, WP25, T117) : deux processus, deux bases, relais
  # TCP, canari, purge, stabilité du contrat. Job SEPARÉ : la batterie est plus longue que les 20 minutes de
  # marge du job `ledger` (dont le délai n'est pas touché) et tourne en série (`--runInBand`, une seule base à la
  # fois). NFR-001 (décision 54) : plancher de 100 débits/s EXIGÉ ici (Linux, PostgreSQL natif) ; en local il reste
  # réglable (`M8_MIN_DEBIT_RATE`), jamais abaissé en CI. Aucune écoute sur le port 80 : les bancs écoutent sur des
  # ports tirés au hasard. Les secrets du banc sont des valeurs de test locales, publiques.
  gateway-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      NODE_ENV: test
      # NFR-001 : 100 débits/s exigés (décision 54). Ne jamais abaisser dans ce job (ci-workflow.spec.ts).
      M8_MIN_DEBIT_RATE: "100"
      # Volumes de la recette (DoD de T114) : 20 bascules sous charge (SC-002) et 10 000 opérations rendues
      # (NFR-002, SC-003). Sans cette variable les suites tournent en volumes réduits (3 bascules, 2 000
      # opérations). Ne jamais retirer ni changer (ci-workflow.spec.ts).
      M8_E2E_LONG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Conteneur PostgreSQL lu par le canari (`pg_dump`, journal du serveur) : celui du service. Le contexte
      # `job` n'existe pas dans l'`env` d'un job : la variable est posée par une étape.
      - name: Conteneur du service PostgreSQL
        run: echo "M8_PG_CONTAINER=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances (sans scripts d'installation)
        run: |
          test "$(npm config get ignore-scripts)" = "true"
          npm ci --ignore-scripts

      - name: Image de la passerelle (construction)
        run: docker build -f apps/gateway/Dockerfile -t cashless-gateway-ci .

      # DIRECTIVE_051 : balayage des vulnérabilités de l'image (condensats de base compris). Outil lancé depuis
      # son image officielle épinglée par condensat (aucune action tierce). Tableau complet au journal du job,
      # puis échec sur toute vulnérabilité HIGH ou CRITICAL corrigeable
      # (décision du porteur, 12/11) ; le balayage n'est jamais facultatif.
      - name: Image de la passerelle (balayage des vulnérabilités, DIRECTIVE_051)
        run: |
          docker save cashless-gateway-ci -o "$RUNNER_TEMP/gateway-image.tar"
          TRIVY=ghcr.io/aquasecurity/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$TRIVY" image --input /scan/gateway-image.tar \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format table
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$TRIVY" image --input /scan/gateway-image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet

      - name: Preuves de bout en bout de la passerelle (en série, NFR-001 à NFR-013, SC-001 à SC-007)
        working-directory: apps/gateway
        run: npx jest -c test/e2e/jest.e2e.config.cjs --runInBand --forceExit
